id: N3-10-boss-stores
type: array
title: "Босс: сводка магазин × день"
difficulty: 3
boss: true
lesson_section: axis
statement: |
  `sales` — выручка сети ShopData: строки — магазины, столбцы — дни. `plan` — план выручки за период для каждого магазина.

  Создай четыре переменные:
  1. `totals` — выручка каждого магазина за период;
  2. `best_day` — номер дня (с 0) с наибольшей выручкой для каждого магазина;
  3. `share` — доля каждого магазина в выручке сети **за каждый день**: таблица той же формы, что `sales`, округлённая до 3 знаков через `np.round`;
  4. `growth` — изменение выручки сети по сравнению с предыдущим днём: массив на один элемент короче числа дней.

  Циклы не нужны.
setup: |
  import numpy as np
  rng = np.random.default_rng(SEED)
  stores, days = int(rng.integers(4, 9)), int(rng.integers(10, 31))
  base = rng.uniform(40_000, 120_000, size=(stores, 1))
  sales = np.round(base * rng.uniform(0.7, 1.3, size=(stores, days)), 2)
  plan = np.round(base[:, 0] * days * rng.uniform(0.9, 1.1, size=stores), 2)
outputs:
  - var: totals
    title: выручка магазинов
  - var: best_day
    title: лучший день каждого магазина
  - var: share
    title: доля магазина в дне
  - var: growth
    title: изменение выручки сети
reference: |
  totals = sales.sum(axis=1)
  best_day = sales.argmax(axis=1)
  share = np.round(sales / sales.sum(axis=0), 3)
  growth = np.diff(sales.sum(axis=0))
requires: ["no_loops"]
star3: [first_try, "max_lines:4"]
buggy_variants:
  - code: "totals = sales.sum(axis=1)\nbest_day = sales.argmax(axis=0)\nshare = np.round(sales / sales.sum(axis=0), 3)\ngrowth = np.diff(sales.sum(axis=0))"
  - code: "totals = sales.sum(axis=1)\nbest_day = sales.argmax(axis=1)\nshare = np.round(sales / sales.sum(axis=1, keepdims=True), 3)\ngrowth = np.diff(sales.sum(axis=0))"
hints:
  - "Всё из уровня: агрегаты по осям, argmax по оси, деление с broadcasting и np.diff."
  - "Магазины — строки, дни — столбцы. Выручка магазина — сумма строки. Лучший день — индекс максимума в строке. Доля в дне — каждый элемент, делённый на сумму своего столбца. Рост — разности соседних дневных сумм сети."
  - "sales.sum(axis=1), sales.argmax(axis=1), sales / sales.sum(axis=0), np.diff(sales.sum(axis=0))."
  - "totals = sales.sum(axis=___)\nbest_day = sales.argmax(axis=___)\nshare = np.round(sales / sales.sum(axis=___), 3)\ngrowth = np.___(sales.sum(axis=0))"
  - "Суммы столбцов имеют форму (дни,) и совмещаются с каждой строкой (магазины, дни) без keepdims, поэтому деление на них даёт долю магазина внутри дня. Деление на суммы строк ответило бы на другой вопрос — какая доля выручки магазина пришлась на день. В каждом столбце share сумма равна 1. np.diff возвращает на один элемент меньше, чем дней."
