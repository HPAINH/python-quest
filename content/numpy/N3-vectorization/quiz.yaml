quiz:
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      m = np.array([[1, 2, 3], [4, 5, 6]])
      print(m.sum(axis=0), m.sum(axis=1))
    answer: "[5 7 9] [ 6 15]"
    explain: axis=0 складывает строки между собой — получаются суммы столбцов. axis=1 — суммы строк.
    section: axis
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      m = np.array([[1, 2], [3, 4]])
      print(m + np.array([10, 20]))
    answer: "[[11 22]\n [13 24]]"
    explain: Строка (2,) прибавляется к каждой строке матрицы.
    section: broadcasting
  - type: choice
    q: Какая форма у m.mean(axis=1), если m имеет форму (5, 3)?
    options: ["(5,)", "(3,)", "(5, 3)", "(1, 3)"]
    answer: 0
    explain: Указанная в axis ось исчезает — остаются 5 строк.
    section: axis
  - type: fill
    q: Впиши пропуск, чтобы получить накопительную сумму [1 3 6].
    code: |
      import numpy as np
      print(np.___(np.array([1, 2, 3])))
    answer: ["cumsum"]
    expect: "[1 3 6]"
    explain: cumsum на каждом шаге прибавляет текущий элемент к сумме предыдущих.
    section: aggregates
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      q = np.array([5, 12, 8, 20])
      print(np.where(q >= 10, q * 0.9, q))
    answer: "[ 5.  10.8  8.  18. ]"
    explain: Где условие истинно — значение со скидкой, иначе исходное. Весь массив стал дробным.
    section: vectorization

express:
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([1, 2, 3])
      print((a[:, None] * a).shape)
    answer: "(3, 3)"
    explain: Столбец (3, 1) умножается на строку (3,) — broadcasting даёт таблицу (3, 3).
    section: broadcasting
  - type: choice
    q: Совместимы ли формы (4, 3) и (4,) при сложении?
    options: ["Да, всегда", "Нет: с конца сравниваются 3 и 4, они не равны и ни одна не равна 1", "Да, если массивы целые", "Только при axis=1"]
    answer: 1
    explain: Чтобы прибавить столбец, ему нужна форма (4, 1).
    section: broadcasting
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      m = np.array([[3, 9, 1], [7, 2, 8]])
      print(m.argmax(axis=1), m.max(axis=0))
    answer: "[1 2] [7 9 8]"
    explain: argmax по строкам даёт индекс столбца с максимумом. max по axis=0 — максимум каждого столбца.
    section: axis
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      print(np.diff(np.array([10, 15, 12, 20])))
    answer: "[ 5 -3  8]"
    explain: Разности соседних элементов — массив на один элемент короче.
    section: aggregates
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      m = np.array([[1, 3], [2, 2]])
      print(m / m.sum(axis=1, keepdims=True))
    answer: "[[0.25 0.75]\n [0.5  0.5 ]]"
    explain: keepdims оставляет суммы столбцом (2, 1), и каждая строка делится на свою сумму.
    section: broadcasting
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([2.0, 4.0, 6.0])
      print(np.round((a - a.mean()) / a.std(), 2))
    answer: "[-1.22  0.    1.22]"
    explain: Среднее 4, стандартное отклонение около 1.63. Крайние значения отстоят на 1.22 отклонения.
    section: aggregates
