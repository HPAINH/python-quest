id: N4-07-fix-matmul
type: fix_bug
base: value
title: Исправь линейную модель
difficulty: 1
lesson_section: linalg
statement: |
  `X` — признаки клиентов, форма `(n, 3)`. `W` — веса двух линейных моделей, форма `(2, 3)`: каждая строка — веса одной модели. Нужно получить прогнозы обеих моделей для всех клиентов — матрицу `(n, 2)`. Код падает. Исправь его.
setup: |
  import numpy as np
  rng = np.random.default_rng(SEED)
  X = np.round(rng.normal(0, 1, size=(int(rng.integers(5, 15)), 3)), 3)
  W = np.round(rng.normal(0, 1, size=(2, 3)), 3)
starter: |
  result = X @ W
reference: |
  result = X @ W.T
star3: [first_try]
hints:
  - "Прочитай ошибку и проверь формы — раздел «Матрицы»."
  - "Для (n, 3) @ (?, ?) внутренние размеры должны совпасть. Веса нужно повернуть так, чтобы столбцами стали модели."
  - "Транспонирование .T."
  - "result = X @ W.___"
  - "(n, 3) @ (2, 3) не согласованы: 3 ≠ 2. W.T имеет форму (3, 2), и (n, 3) @ (3, 2) даёт (n, 2) — по столбцу прогнозов на модель. Именно так считает линейный слой нейросети."
