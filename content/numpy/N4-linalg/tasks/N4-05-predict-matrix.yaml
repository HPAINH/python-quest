id: N4-05-predict-matrix
type: predict
title: Матрицы без запуска
difficulty: 2
lesson_section: linalg
statement: |
  Впиши, что выведет программа.
code: |
  import numpy as np
  A = np.array([[1, 0], [2, 1]])
  B = np.array([[3, 1], [0, 2]])
  print(A @ B)
  print(A * B)
  print((A @ B).sum(), (A.T @ np.ones(2)).astype(int))
hints:
  - "Различай @ и * — раздел «Матрицы»."
  - "Элемент (i, j) произведения A @ B — сумма произведений строки i матрицы A на столбец j матрицы B. A * B просто перемножает элементы на одних местах."
  - "Первая строка A @ B: [1·3 + 0·0, 1·1 + 0·2]. Вторая: [2·3 + 1·0, 2·1 + 1·2]."
  - "Пять строк вывода: две строки матрицы A @ B, две строки A * B и строка с числом и массивом."
  - "Ответ: «[[3 1]», « [6 4]]», «[[3 0]», « [0 2]]», «14 [3 1]». A.T @ [1, 1] — суммы столбцов A: 1 + 2 = 3 и 0 + 1 = 1."
