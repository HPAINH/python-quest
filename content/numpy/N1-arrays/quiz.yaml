quiz:
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([1, 2, 3])
      print(a * 2, [1, 2, 3] * 2)
    answer: "[2 4 6] [1, 2, 3, 1, 2, 3]"
    explain: Массив умножается поэлементно, а список повторяется.
    section: arrays
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      m = np.zeros((3, 4))
      print(m.shape, m.ndim, m.size, m.dtype)
    answer: "(3, 4) 2 12 float64"
    explain: 3 строки и 4 столбца, две оси, 12 элементов. zeros по умолчанию создаёт float64.
    section: dtype
  - type: fill
    q: Впиши пропуск, чтобы получить массив 0, 5, 10, 15.
    code: |
      import numpy as np
      print(np.arange(0, ___, 5))
    answer: ["20", "16", "17", "18", "19"]
    expect: "[ 0  5 10 15]"
    explain: Правая граница arange не включается, поэтому она должна быть больше 15.
    section: create
  - type: choice
    q: Какая форма НЕ подходит для reshape массива из 12 элементов?
    options: ["(3, 4)", "(2, 6)", "(5, 3)", "(4, -1)"]
    answer: 2
    explain: 5 · 3 = 15, а элементов 12. В (4, -1) NumPy сам вычислит вторую ось — 3.
    section: reshape
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      print(np.array([1, 2.5]).dtype, np.array([3.9, -3.9]).astype(int))
    answer: "float64 [ 3 -3]"
    explain: Одно дробное число делает весь массив float64. astype(int) отбрасывает дробную часть.
    section: dtype

express:
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      print(np.linspace(0, 10, 3), np.arange(0, 10, 4))
    answer: "[ 0.  5. 10.] [0 4 8]"
    explain: linspace включает правую границу и даёт ровно 3 точки, arange — нет.
    section: create
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      m = np.arange(6).reshape(2, 3)
      print(m.T.shape, m.T[0])
    answer: "(3, 2) [0 3]"
    explain: Транспонирование меняет форму (2, 3) на (3, 2). Первая строка m.T — первый столбец m.
    section: reshape
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([10, 20, 30])
      b = np.array([1, 2, 3])
      print((a / b).dtype, (a // b).dtype == a.dtype)
    answer: "float64 True"
    explain: Обычное деление всегда даёт дробные, а целочисленное деление целых оставляет целый тип исходного массива.
    section: dtype
  - type: choice
    q: Что произойдёт при np.zeros(2, 3)?
    options: ["Матрица 2 на 3", "Массив [0, 0, 0]", "Ошибка — второй аргумент считается типом", "Массив из 6 нулей"]
    answer: 2
    explain: Форму передают кортежем — np.zeros((2, 3)).
    section: mistakes
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([3, 1, 2])
      print((a > 1).sum(), (a * a).max())
    answer: "2 9"
    explain: Сравнение даёт массив True/False, сумма считает True как 1. Квадраты — 9, 1, 4.
    section: arrays
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      print(np.arange(8).reshape(2, -1).shape)
    answer: "(2, 4)"
    explain: "-1 значит «вычисли сам»: 8 / 2 = 4."
    section: reshape
