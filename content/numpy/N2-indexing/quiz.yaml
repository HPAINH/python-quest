quiz:
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([5, 8, 1, 9, 3])
      print(a[1:3], a[-2:], a[::2])
    answer: "[8 1] [9 3] [5 1 3]"
    explain: Срезы массива работают как у списков.
    section: indexing
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      m = np.arange(12).reshape(3, 4)
      print(m[1, 3], m[:, 0], m[2, 1:3])
    answer: "7 [0 4 8] [ 9 10]"
    explain: m[1, 3] — вторая строка, четвёртый столбец. m[:, 0] — первый столбец.
    section: slicing2d
  - type: fill
    q: Впиши маску, чтобы остались числа от 10 до 20 включительно.
    code: |
      import numpy as np
      a = np.array([5, 10, 15, 20, 25])
      print(a[___])
    answer: ["(a >= 10) & (a <= 20)", "(a <= 20) & (a >= 10)"]
    expect: "[10 15 20]"
    explain: Каждое сравнение в скобках, между ними &.
    section: masks
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([3, -1, 4, -5])
      print(np.where(a < 0, 0, a), (a < 0).sum())
    answer: "[3 0 4 0] 2"
    explain: where заменяет отрицательные на 0. Сумма маски считает True.
    section: where
  - type: choice
    q: Почему a[a > 1 and a < 5] выдаёт ошибку?
    options: ["and работает только с числами, а не с массивами целиком", "Нужно писать a[a > 1, a < 5]", "Маски нельзя объединять", "Нужен np.and"]
    answer: 0
    explain: and спрашивает, истинен ли массив целиком — NumPy не знает ответа. Для поэлементного «и» есть &.
    section: masks

express:
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.arange(5)
      b = a[1:3]
      b[:] = 0
      print(a)
    answer: "[0 0 0 3 4]"
    explain: Срез — представление исходного массива, поэтому изменение b меняет a.
    section: indexing
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      r = np.array([4.0, 9.5, 1.2, 7.0])
      print(np.argsort(-r)[:2], r.argmin())
    answer: "[1 3] 2"
    explain: argsort(-r) упорядочивает индексы по убыванию значения. Минимум 1.2 на индексе 2.
    section: where
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      m = np.array([[1, 2], [3, 4], [5, 6]])
      print(m[m > 2], m[[0, 2], 1])
    answer: "[3 4 5 6] [2 6]"
    explain: Маска по двумерному массиву возвращает одномерный массив подходящих элементов. m[[0, 2], 1] — второй столбец первой и третьей строк.
    section: slicing2d
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([10, 20, 30, 40])
      print(a[~(a > 15)], np.clip(a, 15, 35))
    answer: "[10] [15 20 30 35]"
    explain: ~ инвертирует маску. clip обрезает значения по границам.
    section: where
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      a = np.array([1, 5, 2, 8, 3])
      print((a > 2).mean(), np.where(a > 4)[0])
    answer: "0.6 [1 3]"
    explain: Условие a > 2 выполняется для 3 из 5 элементов (5, 8, 3) — доля 0.6. where с одним аргументом даёт индексы.
    section: masks
  - type: choice
    q: Что вернёт m[:, -1] для матрицы формы (3, 5)?
    options: ["Последнюю строку", "Последний столбец — 3 элемента", "Последний элемент", "Ошибку"]
    answer: 1
    explain: Двоеточие — все строки, -1 — последний столбец.
    section: slicing2d
