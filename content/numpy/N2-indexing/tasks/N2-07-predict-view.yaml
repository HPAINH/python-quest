id: N2-07-predict-view
type: predict
title: Представление и копия
difficulty: 2
lesson_section: indexing
statement: |
  Впиши, что выведет программа.
code: |
  import numpy as np
  prices = np.array([100, 200, 300, 400, 500])
  top = prices[:2]
  top[0] = 1
  picked = prices[[3, 4]]
  picked[0] = 0
  safe = prices[2:].copy()
  safe[:] = 7
  print(prices)
  print(top, picked, safe)
hints:
  - "Разберись, где срез-представление, а где копия — разделы «Индексы и срезы» и «Двумерные массивы»."
  - "Обычный срез — представление: его изменение меняет prices. Выбор списком индексов и .copy() создают копии."
  - "Изменится только первый элемент prices."
  - "Первая строка — prices после всех операций, вторая — три массива через пробел."
  - "Ответ: «[  1 200 300 400 500]» и «[  1 200] [  0 500] [7 7 7]». top — представление, поэтому prices[0] стал 1. picked и safe — копии, prices от них не меняется. NumPy выравнивает числа по ширине, поэтому перед 1 стоят пробелы."
