id: S3-08-predict
type: predict
title: Решения по p-value
difficulty: 2
lesson_section: h0
statement: |
  Впиши, что выведет программа.
code: |
  from scipy import stats
  alpha = 0.05
  for p in [0.049, 0.05, 0.2]:
      print("reject" if p < alpha else "keep", end=" ")
  print()
  z = 2.0
  print(round(2 * stats.norm.sf(z), 4), round(stats.norm.sf(z), 4))
  res = stats.ttest_ind([1, 2, 3], [1, 2, 3])
  print(res.statistic, res.pvalue)
  print(round(stats.chi2.sf(3.84, df=1), 3))
hints:
  - "Повтори разделы «H0, alpha и p-value», «z-тест» и «Хи-квадрат»."
  - "Неравенство строгое: p = alpha не отвергает H0."
  - "Одинаковые выборки дают статистику 0 и p-value 1. Хи-квадрат 3,84 с одной степенью свободы — это z = 1,96 в квадрате."
  - "Четыре строки: три слова, два числа, два числа, одно число."
  - "Ответ: «reject keep keep», «0.0455 0.0228», «0.0 1.0», «0.05»."
