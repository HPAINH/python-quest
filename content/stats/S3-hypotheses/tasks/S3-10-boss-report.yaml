id: S3-10-boss-report
type: dataframe
title: "Босс: итоги двух тестов"
difficulty: 3
boss: true
lesson_section: why
statement: |
  Подведи итоги обоих экспериментов. Создай две переменные.

  1. `report` — таблица с колонками `experiment`, `metric`, `p_value`, `reject`. Для каждого эксперимента (`exp_checkout`, `exp_banner`) две строки:
     - `metric` = `conversion` — хи-квадрат без поправки по `converted`;
     - `metric` = `revenue` — t-тест Уэлча по `revenue` всех участников, B против A.

     `p_value` округли до 5 знаков, `reject` — при alpha = 0.05. Порядок строк любой.
  2. `ship` — `True`, если в `exp_checkout` конверсия значимо выросла (H0 отвергнута и конверсия B больше A).
setup: |
  import pandas as pd
  from scipy import stats
  t = pd.read_csv("ab_metrics.csv").merge(pd.read_csv("ab_assignments.csv"), on=["user_id", "experiment"])
outputs:
  - var: report
    title: итоговая таблица
  - var: ship
    title: выкатываем?
reference: |
  rows = []
  for exp in ["exp_checkout", "exp_banner"]:
      c = t[t["experiment"] == exp]
      p_conv = stats.chi2_contingency(pd.crosstab(c["group"], c["converted"]), correction=False)[1]
      p_rev = stats.ttest_ind(c.loc[c["group"] == "B", "revenue"], c.loc[c["group"] == "A", "revenue"], equal_var=False).pvalue
      rows.append({"experiment": exp, "metric": "conversion", "p_value": round(p_conv, 5), "reject": bool(p_conv < 0.05)})
      rows.append({"experiment": exp, "metric": "revenue", "p_value": round(p_rev, 5), "reject": bool(p_rev < 0.05)})
  report = pd.DataFrame(rows)
  c = t[t["experiment"] == "exp_checkout"]
  conv = c.groupby("group")["converted"].mean()
  ship = bool(report.loc[(report["experiment"] == "exp_checkout") & (report["metric"] == "conversion"), "reject"].iloc[0] and conv["B"] > conv["A"])
star3: [first_try]
