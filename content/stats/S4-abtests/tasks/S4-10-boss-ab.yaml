id: S4-10-boss-ab
type: stat
title: "Босс: решение по тесту"
difficulty: 3
boss: true
lesson_section: why
statement: |
  Подготовь итог по `exp_checkout` для решения о выкатке.

  1. `srm_p` — p-value проверки SRM для сплита 50/50 (допуск ±0.00001).
  2. `p_value` — z-тест `proportions_ztest` для конверсии B против A (допуск ±0.00001).
  3. `ci` — 95% интервал для разницы конверсий B − A методом `wald` (допуск ±0.00001).
  4. `uplift` — относительный прирост конверсии B к A (допуск ±0.0001).
  5. `ship` — `True`, если нет SRM (p ≥ 0.01), эффект значим (p < 0.05) и положителен.
setup: |
  import pandas as pd
  from scipy import stats
  from statsmodels.stats.proportion import proportions_ztest, confint_proportions_2indep
  t = pd.read_csv("ab_metrics.csv").merge(pd.read_csv("ab_assignments.csv"), on=["user_id", "experiment"])
outputs:
  - var: srm_p
    tol: 0.00001
  - var: p_value
    tol: 0.00001
  - var: ci
    tol: 0.00001
  - var: uplift
    tol: 0.0001
  - var: ship
reference: |
  c = t[t["experiment"] == "exp_checkout"]
  g = c.groupby("group")["converted"].agg(["sum", "size"])
  xb, nb = g.loc["B"]
  xa, na = g.loc["A"]
  srm_p = stats.chisquare([na, nb], f_exp=[(na + nb) / 2] * 2).pvalue
  z, p_value = proportions_ztest([xb, xa], [nb, na])
  ci = confint_proportions_2indep(xb, nb, xa, na, method="wald")
  uplift = (xb / nb) / (xa / na) - 1
  ship = bool(srm_p >= 0.01 and p_value < 0.05 and uplift > 0)
star3: [first_try]
buggy_variants:
  - code: "c = t[t['experiment'] == 'exp_checkout']\ng = c.groupby('group')['converted'].agg(['sum', 'size'])\nxb, nb = g.loc['B']\nxa, na = g.loc['A']\nsrm_p = stats.chisquare([xa, xb]).pvalue\nz, p_value = proportions_ztest([xb, xa], [nb, na])\nci = confint_proportions_2indep(xb, nb, xa, na, method='wald')\nuplift = (xb / nb) / (xa / na) - 1\nship = bool(srm_p >= 0.01 and p_value < 0.05 and uplift > 0)"
    expect_detector: stat_value
  - code: "c = t[t['experiment'] == 'exp_checkout']\ng = c.groupby('group')['converted'].agg(['sum', 'size'])\nxb, nb = g.loc['B']\nxa, na = g.loc['A']\nsrm_p = stats.chisquare([na, nb], f_exp=[(na + nb) / 2] * 2).pvalue\nz, p_value = proportions_ztest([xb, xa], [nb, na])\nci = confint_proportions_2indep(xb, nb, xa, na, method='wald')\nuplift = xb / nb - xa / na\nship = bool(srm_p >= 0.01 and p_value < 0.05 and uplift > 0)"
    expect_detector: stat_value
hints:
  - "Всё из уровня: SRM, z-тест, интервал, прирост и правило решения."
  - "Сначала посчитай конверсии и размеры групп. SRM проверяется по размерам групп, а не по числу конверсий. Остальное — как в задачах уровня, все с порядком «B, потом A»."
  - "stats.chisquare([na, nb], f_exp=[(na + nb) / 2] * 2).pvalue, proportions_ztest([xb, xa], [nb, na]), confint_proportions_2indep(xb, nb, xa, na, method=\"wald\")."
  - "c = t[t[\"experiment\"] == \"exp_checkout\"]\ng = c.groupby(\"group\")[\"converted\"].agg([\"sum\", \"size\"])\nxb, nb = g.loc[\"B\"]\nxa, na = g.loc[\"A\"]\nsrm_p = stats.chisquare([___, ___], f_exp=[(na + nb) / 2] * 2).pvalue\nz, p_value = proportions_ztest([xb, xa], [nb, na])\nci = confint_proportions_2indep(xb, nb, xa, na, method=\"wald\")\nuplift = (xb / nb) / (xa / na) - 1\nship = bool(srm_p >= ___ and p_value < 0.05 and uplift > 0)"
  - "Число конверсий в группах и не должно быть равным — на нём SRM-проверка «найдёт» перекос именно там, где есть эффект. Решение о выкатке — три условия сразу: группы честные, эффект значим и он в нужную сторону."
