id: S4-06-multiple
type: stat
title: Поправка Холма
difficulty: 2
lesson_section: multiple
statement: |
  По `exp_banner` проверили четыре метрики — B против A тестом Уэлча: `converted`, `revenue`, `sessions`, `time_on_site` (в этом порядке). Примени поправку Холма при alpha = 0.05. Запиши `p_adj` — список скорректированных p-value (допуск ±0.0001) и `reject` — список решений (`True`/`False`) в том же порядке.
setup: |
  import pandas as pd
  from scipy import stats
  from statsmodels.stats.multitest import multipletests
  t = pd.read_csv("ab_metrics.csv").merge(pd.read_csv("ab_assignments.csv"), on=["user_id", "experiment"])
outputs:
  - var: p_adj
    tol: 0.0001
  - var: reject
reference: |
  c = t[t["experiment"] == "exp_banner"]
  metrics = ["converted", "revenue", "sessions", "time_on_site"]
  pvals = [stats.ttest_ind(c.loc[c["group"] == "B", k], c.loc[c["group"] == "A", k], equal_var=False).pvalue for k in metrics]
  rej, adj, _, _ = multipletests(pvals, alpha=0.05, method="holm")
  p_adj = adj.tolist()
  reject = [bool(x) for x in rej]
star3: [first_try, "max_lines:6"]
buggy_variants:
  - code: "c = t[t['experiment'] == 'exp_banner']\nmetrics = ['converted', 'revenue', 'sessions', 'time_on_site']\npvals = [stats.ttest_ind(c.loc[c['group'] == 'B', k], c.loc[c['group'] == 'A', k], equal_var=False).pvalue for k in metrics]\np_adj = pvals\nreject = [bool(p < 0.05) for p in pvals]"
    expect_detector: stat_value
  - code: "c = t[t['experiment'] == 'exp_banner']\nmetrics = ['converted', 'revenue', 'sessions', 'time_on_site']\npvals = [stats.ttest_ind(c.loc[c['group'] == 'B', k], c.loc[c['group'] == 'A', k], equal_var=False).pvalue for k in metrics]\nrej, adj, _, _ = multipletests(pvals, alpha=0.05, method='bonferroni')\np_adj = adj.tolist()\nreject = [bool(x) for x in rej]"
hints:
  - "Множественные сравнения — раздел «Множественные сравнения»."
  - "Посчитай четыре p-value в списке и передай его в multipletests с method=\"holm\". Первый элемент результата — решения, второй — скорректированные p-value."
  - "[stats.ttest_ind(b[k], a[k], equal_var=False).pvalue for k in metrics], multipletests(pvals, alpha=0.05, method=\"holm\")."
  - "c = t[t[\"experiment\"] == \"exp_banner\"]\nmetrics = [\"converted\", \"revenue\", \"sessions\", \"time_on_site\"]\npvals = [stats.ttest_ind(c.loc[c[\"group\"] == \"B\", k], c.loc[c[\"group\"] == \"A\", k], equal_var=False).pvalue for k in metrics]\nrej, adj, _, _ = multipletests(pvals, alpha=0.05, method=___)\np_adj = adj.___()\nreject = [bool(x) for x in rej]"
  - "Скорректированный p-value никогда не меньше исходного. Бонферрони строже Холма: при одной явно значимой метрике разница может быть в остальных p-value."
