id: S2-08-predict
type: predict
title: Интервалы в цифрах
difficulty: 2
lesson_section: ci-mean
statement: |
  Впиши, что выведет программа.
code: |
  import math
  import numpy as np
  x = np.array([10, 12, 14, 16, 18])
  se = x.std(ddof=1) / np.sqrt(len(x))
  print(x.mean(), round(se, 3))
  print(round(x.mean() - 2 * se, 2), round(x.mean() + 2 * se, 2))
  p, n = 0.3, 100
  print(round(math.sqrt(p * (1 - p) / n), 4))
  print(math.ceil((2 * 10 / 4) ** 2), math.ceil(4 * 0.25 / 0.1 ** 2))
hints:
  - "Повтори разделы «Стандартная ошибка», «Интервал для доли» и «Размер выборки»."
  - "Среднее 14, отклонения −4, −2, 0, 2, 4, сумма квадратов 40. Выборочное std = √(40/4) = √10 ≈ 3,162."
  - "SE = 3,162 / √5 ≈ 1,414. Для доли √(0,3 · 0,7 / 100) = √0,0021."
  - "Четыре строки: два числа, две границы, одно число, два целых."
  - "Ответ: «14.0 1.414», «11.17 16.83», «0.0458», «25 100»."
