quiz:
  - type: choice
    q: Нужно показать, как менялась выручка по неделям за полгода. Какой график?
    options: ["Круговая диаграмма", "Линия", "Гистограмма", "Точечный"]
    answer: 1
    explain: Динамика во времени — линия.
    section: time
  - type: choice
    q: Нужно сравнить конверсию шести источников трафика. Какой график?
    options: ["Отсортированные столбцы", "Линия", "Круговая", "Гистограмма"]
    answer: 0
    explain: Сравнение категорий — столбцы, отсортированные по значению.
    section: compare
  - type: choice
    q: Почему ось Y у столбцов должна начинаться с нуля?
    options: ["Так требует matplotlib", "Высота столбца — это величина, и обрезанная ось преувеличивает различия", "Чтобы влезли подписи", "Это не обязательно"]
    answer: 1
    explain: С обрезанной осью разница 2% выглядит как двукратная.
    section: compare
  - type: choice
    q: Нужно понять, есть ли связь между длительностью сессии и числом событий. Какой график?
    options: ["Столбцы", "Линия", "Точечный", "Круговая"]
    answer: 2
    explain: Связь двух числовых величин — scatter.
    section: choose
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      a = pd.Series(["m", "m", "n", "n"])
      b = pd.Series(["app", "web", "app", "app"])
      print(pd.crosstab(a, b, normalize="index").values.tolist())
    answer: "[[0.5, 0.5], [1.0, 0.0]]"
    explain: normalize="index" делит каждую строку на её сумму.
    section: parts

express:
  - type: choice
    q: Чем плоха круговая диаграмма для долей шести каналов?
    options: ["Её нельзя построить в matplotlib", "Глаз плохо сравнивает близкие углы; столбцы читаются точнее", "Она не показывает проценты", "Ничем"]
    answer: 1
    explain: Доли лучше показывать столбцами.
    section: parts
  - type: choice
    q: Категорий 40, а важны крупнейшие. Что сделать?
    options: ["Показать все 40", "Оставить топ-10, при необходимости добавить «прочее»", "Сделать круговую", "Убрать подписи"]
    answer: 1
    explain: 40 столбцов не читаются.
    section: compare
  - type: choice
    q: Распределение длительности сессий с очень длинным хвостом. Как сделать форму видимой?
    options: ["Уменьшить bins до 3", "Ограничить ось квантилем или взять логарифм", "Построить линию", "Отсортировать данные"]
    answer: 1
    explain: Без этого почти все значения сожмутся в первый столбец.
    section: distribution
  - type: choice
    q: Нужно показать, как меняется доля app и web по месяцам. Какой график?
    options: ["Составные столбцы долей по месяцам", "Две круговые диаграммы", "Гистограмма", "Точечный"]
    answer: 0
    explain: Структура во времени — составные столбцы.
    section: parts
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      s = pd.Series([5, 9, 1, 7], index=list("abcd"))
      print(s.nlargest(3).sort_values().index.tolist())
    answer: "['a', 'd', 'b']"
    explain: nlargest(3) берёт 9, 7 и 5, сортировка по возрастанию ставит лидера последним — для barh он окажется сверху.
    section: compare
  - type: choice
    q: Дневной ряд DAU сильно шумит из-за выходных. Как показать тренд?
    options: ["Убрать выходные", "Добавить скользящее среднее за 7 дней", "Перейти к круговой", "Сделать столбцы"]
    answer: 1
    explain: Окно в неделю сглаживает недельный цикл.
    section: time
