    expect_detector: plot_data
  - code: "steps = ['view', 'add_to_cart', 'checkout', 'purchase']\nfunnel = events.groupby('event')['user_id'].nunique().reindex(steps)\ndau = events.resample('D', on='event_time')['user_id'].nunique()\nwau = dau.resample('W').sum()\nrev = events.loc[events['event'] == 'purchase', 'revenue']\nfig, axes = plt.subplots(1, 3)\naxes[0].bar(funnel.index, funnel.values)\naxes[0].set_title('Воронка')\naxes[1].plot(wau.index, wau.values)\naxes[1].set_title('WAU')\naxes[2].hist(rev, bins=30)\naxes[2].set_title('Чеки')"
    expect_detector: plot_data
hints:
  - "Всё из уровня: столбцы для сравнения шагов, линия для времени, гистограмма для распределения."
  - "Воронка — nunique по событию с reindex в порядке шагов. Недельная аудитория — resample(\"W\") и nunique по событиям, а не сумма дневных значений. Чеки — revenue у purchase."
  - "events.groupby(\"event\")[\"user_id\"].nunique().reindex(steps), events.resample(\"W\", on=\"event_time\")[\"user_id\"].nunique(), axes[2].hist(rev, bins=30)."
  - "steps = [\"view\", \"add_to_cart\", \"checkout\", \"purchase\"]\nfunnel = events.groupby(\"event\")[\"user_id\"].nunique().reindex(___)\nwau = events.resample(\"W\", on=\"event_time\")[\"user_id\"].___()\nrev = events.loc[events[\"event\"] == \"purchase\", ___]\nfig, axes = plt.subplots(1, 3, figsize=(14, 4))\naxes[0].bar(funnel.index, funnel.values)\naxes[0].set_title(\"...\")\naxes[1].plot(wau.index, wau.values)\naxes[1].set_title(\"...\")\naxes[2].hist(rev, bins=___)\naxes[2].set_title(\"...\")"
  - "Сумма DAU за неделю завышает аудиторию: человек, заходивший каждый день, считается семь раз. Без reindex шаги воронки встанут по алфавиту, и столбцы перестанут убывать."
