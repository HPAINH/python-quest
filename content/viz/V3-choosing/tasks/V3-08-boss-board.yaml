id: V3-08-boss-board
type: plot
title: "Босс: продуктовая панель"
difficulty: 3
boss: true
lesson_section: choose
statement: |
  Собери панель из трёх графиков в одну строку. Для каждого вопроса выбери подходящий тип.

  1. «Где теряются пользователи?» — число уникальных пользователей на шагах `view`, `add_to_cart`, `checkout`, `purchase` в порядке воронки.
  2. «Растёт ли аудитория?» — число уникальных активных пользователей по неделям (`resample("W")`).
  3. «Какие обычно чеки?» — распределение `revenue` покупок на 30 корзин.

  У каждого графика нужен заголовок.
setup: |
  import pandas as pd
  import matplotlib.pyplot as plt
  import seaborn as sns
  events = pd.read_csv("events.csv", parse_dates=["event_time"])
plot:
  labels: true
  ordered: true
  hist: true
reference: |
  steps = ["view", "add_to_cart", "checkout", "purchase"]
  funnel = events.groupby("event")["user_id"].nunique().reindex(steps)
  wau = events.resample("W", on="event_time")["user_id"].nunique()
  rev = events.loc[events["event"] == "purchase", "revenue"]
  fig, axes = plt.subplots(1, 3, figsize=(14, 4))
  axes[0].bar(funnel.index, funnel.values)
  axes[0].set_title("Воронка")
  axes[1].plot(wau.index, wau.values)
  axes[1].set_title("Активные по неделям")
  axes[2].hist(rev, bins=30)
  axes[2].set_title("Чеки")
  fig.tight_layout()
star3: [first_try]
buggy_variants:
