hints:
  - "Сравнение трендов — раздел «Время»."
  - "Оставь покупки, добавь к ним платформу из сессий и в цикле по платформам нарисуй недельное число покупок с label. В конце — legend."
  - "events[events[\"event\"] == \"purchase\"].merge(sessions[[\"session_id\", \"platform\"]], on=\"session_id\"), resample(\"W\", on=\"event_time\").size(), ax.legend()."
  - "b = events[events[\"event\"] == ___].merge(sessions[[\"session_id\", \"platform\"]], on=\"session_id\")\nfig, ax = plt.subplots()\nfor p in [\"app\", \"web\"]:\n    w = b[b[\"platform\"] == p].resample(\"W\", on=\"event_time\").size()\n    ax.plot(w.index, w.values, label=___)\nax.set_title(\"...\")\nax.___()"
  - "Две линии на одних осях сравнивают тренды напрямую. Последняя неделя может быть неполной — в отчёте её стоит пометить или отрезать, иначе кажется, что покупки упали."
