id: V3-07-platforms
type: plot
title: Тренды платформ
difficulty: 2
lesson_section: time
statement: |
  Вопрос: «Как менялось число покупок по неделям в приложении и на сайте?» Построй две линии — число событий `purchase` по неделям (`resample("W")`) для `platform` `app` и `web` (платформа — из сессии события). Нужны легенда и заголовок.
setup: |
  import pandas as pd
  import matplotlib.pyplot as plt
  import seaborn as sns
  events = pd.read_csv("events.csv", parse_dates=["event_time"])
  sessions = pd.read_csv("sessions.csv")
plot:
  labels: true
  legend: true
reference: |
  b = events[events["event"] == "purchase"].merge(sessions[["session_id", "platform"]], on="session_id")
  fig, ax = plt.subplots()
  for p in ["app", "web"]:
      w = b[b["platform"] == p].resample("W", on="event_time").size()
      ax.plot(w.index, w.values, label=p)
  ax.set_title("Покупки по неделям")
  ax.legend()
star3: [first_try, "max_lines:8"]
