id: V1-08-boss-dashboard
type: plot
title: "Босс: мини-дашборд"
difficulty: 3
boss: true
lesson_section: subplots
statement: |
  Собери фигуру из двух графиков в одну строку.

  1. Слева — столбцы выручки по отделам (`department` из `categories`) по позициям **доставленных** заказов, по убыванию. Выручка позиции — `quantity * unit_price * (1 - discount)`.
  2. Справа — линия числа доставленных заказов по месяцам (`resample("MS")`).

  У обоих графиков нужны заголовок и подписи обеих осей.
setup: |
  import pandas as pd
  import matplotlib.pyplot as plt
  orders = pd.read_csv("orders.csv", parse_dates=["order_date"])
  items = pd.read_csv("order_items.csv")
  products = pd.read_csv("products.csv")
  categories = pd.read_csv("categories.csv")
plot:
  labels: true
  ordered: true
reference: |
  delivered = orders[orders["status"] == "delivered"]
  items["revenue"] = items["quantity"] * items["unit_price"] * (1 - items["discount"])
  t = items.merge(delivered[["order_id"]], on="order_id").merge(products[["product_id", "category_id"]], on="product_id")
  t = t.merge(categories[["category_id", "department"]], on="category_id")
  dep = t.groupby("department")["revenue"].sum().sort_values(ascending=False)
  m = delivered.resample("MS", on="order_date").size()
  fig, axes = plt.subplots(1, 2, figsize=(11, 4))
  axes[0].bar(dep.index, dep.values)
  axes[0].set_title("Выручка по отделам")
  axes[0].set_xlabel("Отдел")
  axes[0].set_ylabel("₽")
  axes[1].plot(m.index, m.values)
  axes[1].set_title("Доставленные заказы")
  axes[1].set_xlabel("Месяц")
  axes[1].set_ylabel("Заказов")
  fig.tight_layout()
star3: [first_try]
