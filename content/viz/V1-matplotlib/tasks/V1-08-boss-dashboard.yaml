  - "Для левого графика оставь позиции доставленных заказов (merge с их order_id), доберись до отдела через товары и категории, сложи выручку по отделу и отсортируй. Для правого — resample по месяцам и size."
  - "items.merge(delivered[[\"order_id\"]], on=\"order_id\"), merge с products и categories, groupby(\"department\")[\"revenue\"].sum().sort_values(ascending=False), delivered.resample(\"MS\", on=\"order_date\").size()."
