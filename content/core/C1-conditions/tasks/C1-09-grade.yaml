id: C1-09-grade
type: stdio
title: Оценка по баллам
difficulty: 1
lesson_section: elif
statement: |
  Дан балл за тест от 0 до 100. Выведи оценку:
  - 90 и выше — `отлично`;
  - от 75 до 89 — `хорошо`;
  - от 50 до 74 — `удовлетворительно`;
  - ниже 50 — `неудовлетворительно`.
reference: |
  score = int(input())
  if score >= 90:
      print("отлично")
  elif score >= 75:
      print("хорошо")
  elif score >= 50:
      print("удовлетворительно")
  else:
      print("неудовлетворительно")
requires: ["uses:elif"]
tests:
  visible: ["95", "60"]
  hidden: ["90", "89", "75", "74", "50", "49", "0", "100"]
star3: [first_try]
hints:
  - "Четыре варианта — это цепочка if / elif / else из раздела «Цепочка elif»."
  - "Проверяй границы сверху вниз: сначала 90, потом 75, потом 50. Всё, что ниже, — неудовлетворительно."
  - "if score >= 90, elif score >= 75, elif score >= 50, else."
  - "score = int(input())\nif score >= ___:\n    print(\"отлично\")\nelif score >= ___:\n    print(\"хорошо\")\n___ score >= 50:\n    print(\"удовлетворительно\")\nelse:\n    print(___)"
  - "Цепочка проверяется сверху вниз. До ветки «хорошо» доходят только баллы ниже 90, поэтому достаточно проверить score >= 75 — верхнюю границу 89 писать не нужно."
