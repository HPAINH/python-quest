id: C1-12-boss-delivery
type: stdio
title: "Босс: тариф доставки ShopData"
difficulty: 3
boss: true
lesson_section: nested
statement: |
  Посчитай стоимость доставки заказа ShopData.

  Ввод — три строки:
  1. вес посылки в килограммах и расстояние в километрах — два целых числа через пробел;
  2. сумма заказа в рублях — целое число;
  3. есть ли у клиента подписка: `да` или `нет`.

  Правила:
  - базовая цена: до 1 кг включительно — 199 ₽, до 5 кг включительно — 299 ₽, тяжелее — 299 ₽ плюс 40 ₽ за каждый килограмм сверх пяти;
  - если расстояние больше 30 км, к цене добавляется 100 ₽;
  - если сумма заказа от 5000 ₽, доставка бесплатная;
  - иначе подписчики платят половину, округлённую вниз до рубля.

  Выведи стоимость доставки — одно целое число.
reference: |
  w, dist = map(int, input().split())
  total = int(input())
  sub = input()
  if w <= 1:
      cost = 199
  elif w <= 5:
      cost = 299
  else:
      cost = 299 + 40 * (w - 5)
  if dist > 30:
      cost += 100
  if total >= 5000:
      cost = 0
  elif sub == "да":
      cost = cost // 2
  print(cost)
tests:
  visible: ["3 12\n2500\nнет", "8 45\n1200\nда"]
  hidden: ["1 30\n4999\nнет", "1 31\n100\nда", "5 0\n5000\nда", "6 1\n0\nнет", "0 100\n10\nнет", "20 31\n4999\nда"]
random: {count: 40, gen: "f'{random.randint(0, 25)} {random.randint(0, 60)}\\n{random.randint(0, 8000)}\\n{random.choice([\"да\", \"нет\"])}'"}
star3: [first_try]
