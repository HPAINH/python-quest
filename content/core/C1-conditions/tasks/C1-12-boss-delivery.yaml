  - code: "w, dist = map(int, input().split())\ntotal = int(input())\nsub = input()\ncost = 199\nif w <= 5:\n    cost = 299\nelse:\n    cost = 299 + 40 * (w - 5)\nif dist > 30:\n    cost += 100\nif total >= 5000:\n    cost = 0\nelif sub == 'да':\n    cost = cost // 2\nprint(cost)"
hints:
  - "Здесь всё из уровня: цепочка elif, условия с границами и порядок проверок. Перечитай «Цепочка elif» и «Вложенные условия»."
  - "Считай по шагам, как в правилах: базовая цена по весу, потом надбавка за расстояние, потом бесплатная доставка или скидка подписчику. Храни текущую цену в одной переменной и меняй её."
  - "Цепочка if / elif / else по весу, отдельный if для расстояния, if / elif для суммы и подписки, деление // 2."
  - "w, dist = map(int, input().split())\ntotal = int(input())\nsub = input()\nif w <= 1:\n    cost = ___\nelif w <= 5:\n    cost = ___\nelse:\n    cost = 299 + 40 * (___)\nif dist ___ 30:\n    cost += 100\nif total >= 5000:\n    cost = ___\nelif sub == ___:\n    cost = cost // 2\nprint(cost)"
  - "Для «8 45, 1200, да»: вес 8 > 5, база 299 + 40 * 3 = 419. Расстояние 45 > 30, получаем 519. Сумма меньше 5000, клиент подписчик — 519 // 2 = 259. Важны границы: ровно 1 кг — 199, ровно 30 км — без надбавки, ровно 5000 — бесплатно."
