id: C1-06-fix-discount
type: fix_bug
base: stdio
title: Исправь скидку
difficulty: 2
lesson_section: elif
statement: |
  Скидка в магазине зависит от суммы заказа: от 5000 ₽ — 10%, от 1000 ₽ — 5%, меньше 1000 ₽ — скидки нет. Программа должна вывести размер скидки в процентах.

  Программа работает без ошибок, но для крупных заказов выдаёт не ту скидку. Найди и исправь баг.
starter: |
  total = int(input())
  if total >= 1000:
      print(5)
  elif total >= 5000:
      print(10)
  else:
      print(0)
reference: |
  total = int(input())
  if total >= 5000:
      print(10)
  elif total >= 1000:
      print(5)
  else:
      print(0)
tests:
  visible: ["7000", "1500"]
  hidden: ["999", "1000", "5000", "4999", "0"]
random: {count: 20, gen: "str(random.randint(0, 20000))"}
star3: [first_try]
hints:
  - "Python выполняет первую подходящую ветку — раздел «Цепочка elif»."
  - "Проверь, что будет для 7000. Какое условие проверяется первым и истинно ли оно?"
  - "Поменяй местами ветки: сначала самое строгое условие."
  - "total = int(input())\nif total >= ___:\n    print(10)\nelif total >= ___:\n    print(5)\nelse:\n    print(0)"
  - "Для 7000 условие total >= 1000 истинно, поэтому программа печатала 5 и не доходила до проверки 5000. Когда первым проверяется total >= 5000, крупные заказы получают 10%, а остальные спускаются к следующей ветке."
