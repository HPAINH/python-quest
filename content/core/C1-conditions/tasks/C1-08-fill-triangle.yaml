id: C1-08-fill-triangle
type: fill_gaps
base: stdio
title: Существует ли треугольник
difficulty: 2
lesson_section: logic
statement: |
  Даны три длины отрезков в одной строке. Треугольник существует, если каждая сторона меньше суммы двух других. Выведи `YES` или `NO`.

  Заполни пропуски `___`.
template: |
  a, b, c = map(int, input().split())
  if a < b + c ___ b < a + c ___ c < a + b:
      print("YES")
  ___:
      print("NO")
reference: |
  a, b, c = map(int, input().split())
  if a < b + c and b < a + c and c < a + b:
      print("YES")
  else:
      print("NO")
tests:
  visible: ["3 4 5", "1 2 3"]
  hidden: ["1 1 1", "10 1 1", "1 10 1", "1 1 10", "5 5 9"]
random: {count: 25, gen: "' '.join(str(random.randint(1, 12)) for _ in range(3))"}
star3: [first_try]
hints:
  - "Нужны логические операторы — раздел «and, or, not»."
  - "Все три проверки должны выполняться одновременно, иначе треугольника нет."
  - "Оператор, который требует истинности обеих частей, и ветка «иначе»."
  - "Первые два пропуска — один и тот же логический оператор. Третий — ключевое слово для ветки, когда условие ложно."
  - "and требует, чтобы все три неравенства были верны. Для 1 2 3: 3 < 1 + 2 ложно, значит NO — такой «треугольник» вырождается в отрезок. Ветка else ловит все остальные случаи."
