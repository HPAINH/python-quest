id: C1-04-quarter
type: stdio
title: Координатная четверть
difficulty: 2
lesson_section: nested
statement: |
  В одной строке даны координаты точки `x` и `y` — целые числа. Выведи номер координатной четверти, в которой лежит точка: `1`, `2`, `3` или `4`. Если точка лежит на оси, выведи `0`.
reference: |
  x, y = map(int, input().split())
  if x == 0 or y == 0:
      print(0)
  elif x > 0 and y > 0:
      print(1)
  elif x < 0 and y > 0:
      print(2)
  elif x < 0 and y < 0:
      print(3)
  else:
      print(4)
tests:
  visible: ["3 5", "-2 -7"]
  hidden: ["0 4", "5 0", "0 0", "-1 1", "1 -1"]
random: {count: 25, gen: "f'{random.randint(-5, 5)} {random.randint(-5, 5)}'"}
star3: [first_try]
hints:
  - "Это ветвление с несколькими вариантами — разделы «Цепочка elif» и «Вложенные условия»."
  - "Сначала проверь, не лежит ли точка на оси: x или y равны нулю. Потом по знакам x и y определи четверть: первая — оба плюс, вторая — x минус и y плюс, третья — оба минус, четвёртая — оставшийся случай."
  - "Условия x == 0 or y == 0, x > 0 and y > 0 и так далее, цепочка if / elif / else."
  - "x, y = map(int, input().split())\nif x == 0 ___ y == 0:\n    print(0)\nelif x > 0 and y > 0:\n    print(1)\nelif x ___ 0 and y > 0:\n    print(2)\nelif ___:\n    print(3)\nelse:\n    print(4)"
  - "Проверка оси стоит первой: иначе точка (0, 4) попала бы в какую-то четверть. Дальше четыре случая по знакам. Последний else ловит x > 0 и y < 0 — это четвёртая четверть."
