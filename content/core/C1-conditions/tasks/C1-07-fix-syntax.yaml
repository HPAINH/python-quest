id: C1-07-fix-syntax
type: fix_bug
base: stdio
title: Исправь проверку пароля
difficulty: 1
lesson_section: bool
statement: |
  Программа читает две строки — пароль и его повтор — и должна вывести `совпадают` или `не совпадают`. Сейчас она даже не запускается. Исправь её.
starter: |
  p1 = input()
  p2 = input()
  if p1 = p2
      print("совпадают")
  else:
      print("не совпадают")
reference: |
  p1 = input()
  p2 = input()
  if p1 == p2:
      print("совпадают")
  else:
      print("не совпадают")
tests:
  visible: ["qwerty\nqwerty", "Secret1\nsecret1"]
  hidden: ["a\nb", "123\n123", "пароль\nпароль ", "x\nx"]
star3: [first_try]
hints:
  - "Прочитай ошибку и раздел «Сравнения и bool»."
  - "В строке с if две ошибки: сравнение и знак в конце строки."
  - "Сравнение — ==, строка с if заканчивается двоеточием."
  - "if p1 ___ p2___"
  - "= присваивает, а == сравнивает. После условия обязательно двоеточие, иначе Python не понимает, где начинается блок. Обрати внимание: «пароль» и «пароль » с пробелом — разные строки."
