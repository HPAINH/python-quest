id: C1-05-predict-logic
type: predict
title: Логика без запуска
difficulty: 2
lesson_section: logic
statement: |
  Впиши, что выведет программа.
code: |
  a, b, c = 3, 0, -2
  print(a > 0 and b > 0)
  print(a > 0 or b > 0)
  print(not (c < 0))
  print(a > b > c)
  if b:
      print("b")
  else:
      print("нет b")
hints:
  - "Разбери and, or, not и цепочки сравнений — раздел «and, or, not»."
  - "and истинно, если обе части истинны. or — если хоть одна. a > b > c означает a > b и b > c. Число 0 в условии считается ложью."
  - "Посчитай пять строк по очереди, подставляя a = 3, b = 0, c = -2."
  - "Ответ — четыре строки True/False и одна строка с текстом."
  - "Ответ: False, True, False, True, «нет b». 3 > 0 и 0 > 0 — второе ложно. 3 > 0 или 0 > 0 — первое истинно. c < 0 истинно, not делает False. 3 > 0 > -2 — оба сравнения верны. if b при b = 0 идёт в else."
