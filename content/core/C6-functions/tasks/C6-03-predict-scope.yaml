id: C6-03-predict-scope
type: predict
title: Чья переменная
difficulty: 2
lesson_section: scope
statement: |
  Впиши, что выведет программа.
code: |
  total = 100

  def add(x):
      total = x + 1
      return total

  def show(total=5):
      return total * 2

  print(add(10))
  print(total)
  print(show(), show(total))
hints:
  - "Разберись, какие переменные локальные — раздел «Области видимости»."
  - "Присваивание внутри функции создаёт новую локальную переменную, глобальная total не меняется. Параметр total функции show — тоже отдельная локальная переменная."
  - "Посчитай add(10), потом глобальную total, потом show() со значением по умолчанию и show(100)."
  - "Три строки: результат add, глобальная переменная, два результата show через пробел."
  - "Ответ: 11, 100, «10 200». add создаёт локальную total = 11 и возвращает её. Глобальная total осталась 100. show() берёт total=5 по умолчанию → 10, show(total) получает глобальные 100 → 200."
