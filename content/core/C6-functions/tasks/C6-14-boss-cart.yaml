id: C6-14-boss-cart
type: function
title: "Босс: калькулятор корзины"
difficulty: 3
boss: true
lesson_section: return
statement: |
  Собери калькулятор корзины ShopData из трёх функций. Каждая проверяется отдельным шагом.

  **Шаг 1.** `parse_price(text)` — превращает цену из выгрузки в число. Текст может содержать пробелы между разрядами, запятую вместо точки и знак `₽`: `"1 290,50 ₽"` → `1290.5`, `"990"` → `990.0`.

  **Шаг 2.** `apply_discount(price, percent=0)` — возвращает цену со скидкой, округлённую до 2 знаков. Если `percent` меньше 0 или больше 100, функция возвращает цену без изменений.

  **Шаг 3.** `cart_total(items, promo=None)` — `items` — список пар `(текст_цены, количество)`. Функция возвращает итог корзины, округлённый до 2 знаков:
  - сумма `parse_price(текст) × количество` по всем позициям;
  - промокод `"SALE10"` даёт скидку 10% на итог, `"WELCOME"` — 15%, но только если итог от 1000 ₽;
  - любой другой промокод или `None` — без скидки.

  Используй функции из шагов 1 и 2 внутри шага 3.
starter: |
  def parse_price(text):
      pass

  def apply_discount(price, percent=0):
      pass

  def cart_total(items, promo=None):
      pass
reference: |
  def parse_price(text):
      clean = text.replace("₽", "").replace(" ", "").replace(",", ".")
      return float(clean)

  def apply_discount(price, percent=0):
      if percent < 0 or percent > 100:
          return price
      return round(price * (100 - percent) / 100, 2)

  def cart_total(items, promo=None):
      total = sum(parse_price(p) * q for p, q in items)
      if promo == "SALE10":
          total = apply_discount(total, 10)
      elif promo == "WELCOME" and total >= 1000:
          total = apply_discount(total, 15)
      return round(total, 2)
steps:
  - title: Разобрать цену из текста
    function: parse_price
    tests:
      visible: ["parse_price('1 290,50 ₽')", "parse_price('990')"]
      hidden: ["parse_price('0,99')", "parse_price('12 345 678,1 ₽')", "parse_price('  55 ₽ ')"]
    random: {count: 10, gen: "'parse_price(' + repr(f'{random.randint(0, 99999):,}'.replace(',', ' ') + ',' + str(random.randint(0, 99)) + random.choice(['', ' ₽'])) + ')'"}
  - title: Применить скидку
    function: apply_discount
    tests:
      visible: ["apply_discount(1000, 15)", "apply_discount(500)"]
      hidden: ["apply_discount(99.99, 33)", "apply_discount(1000, 150)", "apply_discount(1000, -5)", "apply_discount(1000, 100)"]
    random: {count: 10, gen: "f'apply_discount({random.randint(0, 99999) / 100}, {random.randint(-10, 110)})'"}
  - title: Итог корзины с промокодом
    function: cart_total
    tests:
      visible: ["cart_total([('1 290,50 ₽', 2), ('99', 3)], 'SALE10')", "cart_total([('450', 1)], 'WELCOME')"]
      hidden: ["cart_total([])", "cart_total([('1 000', 1)], 'WELCOME')", "cart_total([('999,99', 1)], 'WELCOME')", "cart_total([('100', 5)], 'sale10')", "cart_total([('333,33 ₽', 3)], 'SALE10')"]
    random: {count: 15, gen: "f'cart_total({[(str(random.randint(1, 3000)) + random.choice([\",50\", \"\", \",99 ₽\"]), random.randint(1, 4)) for _ in range(random.randint(0, 4))]}, {random.choice([None, \"SALE10\", \"WELCOME\", \"OTHER\"])!r})'"}
star3: [first_try]
