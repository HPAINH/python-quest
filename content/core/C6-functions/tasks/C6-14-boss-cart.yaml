hints:
  - "Это три небольшие функции: разбор строки (методы строк из C3), функция со значением по умолчанию (раздел «Параметры и аргументы») и функция, которая вызывает две первые."
  - "parse_price: убери знак валюты и пробелы, замени запятую на точку, переведи в float. apply_discount: сначала проверь некорректный процент и верни цену как есть, иначе посчитай и округли. cart_total: сложи цену × количество по позициям, затем примени скидку по промокоду с проверкой порога для WELCOME."
  - "str.replace, float, round(x, 2), sum(... for p, q in items), if / elif по промокоду, вызовы parse_price и apply_discount."
  - "def parse_price(text):\n    clean = text.replace(\"₽\", \"\").replace(___, \"\").replace(\",\", ___)\n    return float(clean)\n\ndef apply_discount(price, percent=0):\n    if percent < 0 or percent > ___:\n        return price\n    return round(price * (100 - percent) / 100, ___)\n\ndef cart_total(items, promo=None):\n    total = sum(parse_price(p) * q for p, q in ___)\n    if promo == \"SALE10\":\n        total = apply_discount(total, 10)\n    elif promo == \"WELCOME\" and total >= ___:\n        total = apply_discount(total, 15)\n    return round(total, 2)"
  - "«1 290,50 ₽» → убираем ₽ и пробелы → «1290,50» → запятую на точку → 1290.5. Для корзины из примера: 1290.5 × 2 + 99 × 3 = 2878, скидка 10% → 2590.2. WELCOME при итоге 450 не работает — порог 1000. Промокоды сравниваются точно, поэтому «sale10» не даёт скидки. Шаги проверяются по отдельности, и при ошибке видно, какая функция сломана."
