id: C6-11-compose
type: function
function: compose
title: Композиция функций
difficulty: 2
lesson_section: lambda
statement: |
  Напиши функцию `compose(f, g)`, которая возвращает **новую функцию** от одного аргумента: она применяет к нему сначала `g`, потом `f`. То есть `compose(f, g)(x)` равно `f(g(x))`.
starter: |
  def compose(f, g):
      pass
reference: |
  def compose(f, g):
      return lambda x: f(g(x))
tests:
  visible: ["compose(abs, lambda x: x - 10)(3)", "compose(str.upper, str.strip)('  sql ')"]
  hidden: ["compose(len, str)(12345)", "compose(lambda x: x * 2, lambda x: x + 1)(5)", "compose(lambda x: x + 1, lambda x: x * 2)(5)", "h = compose(sorted, set)\nh([3, 1, 3, 2])"]
star3: [first_try, "max_lines:2"]
buggy_variants:
  - code: "def compose(f, g):\n    return lambda x: g(f(x))"
  - code: "def compose(f, g):\n    return f(g)"
hints:
  - "Функцию можно вернуть из функции — раздел «lambda и функции как значения»."
  - "compose не вычисляет ничего сама: она возвращает функцию, которая потом получит x и вернёт f(g(x))."
  - "return lambda x: f(g(x)) — или вложенная def с return."
  - "def compose(f, g):\n    return ___ x: ___(___(x))"
  - "Вызов compose(abs, lambda x: x - 10) возвращает функцию. Вторые скобки (3) вызывают её: g(3) = -7, f(-7) = 7. Порядок важен: сначала внутренняя g, потом внешняя f."
