id: C4-02-unique-order
type: stdio
title: Без повторов
difficulty: 2
lesson_section: list-methods
statement: |
  В строке через пробел даны целые числа. Выведи их без повторов, сохранив порядок первого появления.
reference: |
  seen = []
  for x in input().split():
      if x not in seen:
          seen.append(x)
  print(" ".join(seen))
tests:
  visible: ["1 3 1 2 3 4", "7 7 7"]
  hidden: ["5", "1 2 3", "-1 1 -1 1", "10 9 8 9 10"]
random: {count: 20, gen: "' '.join(str(random.randint(-4, 4)) for _ in range(random.randint(1, 20)))"}
star3: [first_try]
buggy_variants:
  - code: "nums = input().split()\nprint(' '.join(sorted(set(nums))))"
hints:
  - "Новый список строится в цикле с append — раздел «Методы списков»."
  - "Иди по числам и добавляй число в новый список, только если его там ещё нет."
  - "Пустой список seen, оператор not in, append, join или print(*seen)."
  - "seen = []\nfor x in input().split():\n    if x ___ seen:\n        seen.append(___)\nprint(\" \".join(seen))"
  - "x not in seen проверяет, встречалось ли значение раньше. Множество set тоже убирает повторы, но не сохраняет порядок — поэтому здесь список. Числа можно не переводить в int: для сравнения на равенство подходят и строки."
