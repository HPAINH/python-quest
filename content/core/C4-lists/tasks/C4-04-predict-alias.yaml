id: C4-04-predict-alias
type: predict
title: Ссылки на список
difficulty: 2
lesson_section: list-methods
statement: |
  Впиши, что выведет программа.
code: |
  a = [3, 1, 2]
  b = a
  c = sorted(a)
  b.append(0)
  print(a)
  print(c)
  print(a.pop(), len(b))
hints:
  - "Разберись, какие операции меняют список, а какие создают новый — разделы «Методы списков» и «Сортировка»."
  - "b = a — это второе имя для того же списка. sorted создаёт новый список. pop удаляет последний элемент и возвращает его."
  - "После append(0) список a тоже изменится, потому что a и b — один объект."
  - "Первая строка — список из четырёх элементов, вторая — отсортированная копия исходных трёх, третья — два числа."
  - "Ответ: [3, 1, 2, 0], [1, 2, 3], «0 3». c отсортирован до append, поэтому нуля в нём нет. pop() возвращает 0 и укорачивает общий список до 3 элементов."
