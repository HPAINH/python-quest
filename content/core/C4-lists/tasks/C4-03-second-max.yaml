id: C4-03-second-max
type: function
function: second_max
title: Второй максимум
difficulty: 2
lesson_section: def-basics
statement: |
  Напиши функцию `second_max(nums)`, которая получает список целых чисел (в нём минимум два **разных** значения) и **возвращает** второе по величине различное значение.

  Не используй `sort` и `sorted`.
starter: |
  def second_max(nums):
      pass
reference: |
  def second_max(nums):
      first = max(nums)
      second = None
      for x in nums:
          if x != first and (second is None or x > second):
              second = x
      return second
requires: ["no_call:sort", "no_call:sorted"]
tests:
  visible: ["second_max([1, 5, 3])", "second_max([4, 9, 9, 2])"]
  hidden: ["second_max([1, 2])", "second_max([2, 1])", "second_max([-5, -1, -3])", "second_max([7, 7, 7, 6])", "second_max([0, 100, 50, 100, 99])"]
random: {count: 30, gen: "'second_max(' + str([random.randint(-20, 20) for _ in range(random.randint(2, 12))] + [21, 22]) + ')'"}
star3: [first_try]
buggy_variants:
  - code: "def second_max(nums):\n    first = max(nums)\n    second = 0\n    for x in nums:\n        if x != first and x > second:\n            second = x\n    return second"
  - code: "def second_max(nums):\n    first = max(nums)\n    second = min(nums)\n    for x in nums:\n        if x != first and x > second:\n            second = x\n    print(second)"
    expect_detector: print_instead_of_return
hints:
  - "Это поиск максимума из уровня C2 плюс функция с return — разделы «Списки» и «Функции: def и return»."
  - "Найди максимум. Потом пройди по списку ещё раз и найди наибольшее среди чисел, которые не равны максимуму."
  - "max(nums), переменная second = None, условие x != first, return second."
  - "def second_max(nums):\n    first = max(nums)\n    second = ___\n    for x in nums:\n        if x != first and (second is None or x ___ second):\n            second = x\n    return ___"
  - "Для [4, 9, 9, 2] максимум 9 встречается дважды, но второе различное значение — 4. Начальное second = None означает «ещё не нашли»; если начать с 0, на списке из отрицательных чисел ответ будет неверным."
