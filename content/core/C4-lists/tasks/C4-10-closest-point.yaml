id: C4-10-closest-point
type: stdio
title: Ближайшая точка
difficulty: 2
lesson_section: tuples
statement: |
  В первой строке дано число точек `n`, дальше `n` строк с целыми координатами `x y`. Выведи координаты точки, ближайшей к началу координат. Если таких несколько — ту, что встретилась раньше.
reference: |
  n = int(input())
  points = [tuple(map(int, input().split())) for _ in range(n)]
  best = min(points, key=lambda p: p[0] ** 2 + p[1] ** 2)
  print(best[0], best[1])
tests:
  visible: ["3\n3 4\n-1 1\n5 0", "1\n7 -7"]
  hidden: ["2\n1 0\n0 1", "3\n10 10\n-10 -10\n0 15", "2\n0 0\n0 0", "4\n-2 0\n0 -2\n2 0\n1 1"]
random: {count: 25, gen: "(lambda k: str(k) + '\\n' + '\\n'.join(f'{random.randint(-9, 9)} {random.randint(-9, 9)}' for _ in range(k)))(random.randint(1, 10))"}
star3: [first_try]
buggy_variants:
  - code: "n = int(input())\npoints = [tuple(map(int, input().split())) for _ in range(n)]\nbest = min(points, key=lambda p: abs(p[0]) + abs(p[1]))\nprint(best[0], best[1])"
hints:
  - "Точку удобно хранить кортежем — раздел «Кортежи», а выбор лучшей — функцией min с ключом из раздела «Сортировка»."
  - "Прочитай точки в список кортежей. Расстояние до начала координат сравнивай по сумме квадратов координат — корень не нужен. Выбери точку с наименьшим значением."
  - "tuple(map(int, input().split())), min(points, key=lambda p: p[0] ** 2 + p[1] ** 2)."
  - "n = int(input())\npoints = [tuple(map(int, input().split())) for _ in range(___)]\nbest = min(points, key=lambda p: ___)\nprint(best[0], best[1])"
  - "min с ключом возвращает первый элемент с наименьшим ключом — это и даёт «ту, что встретилась раньше». Сумма модулей — другое расстояние: для (1, 1) и (-2, 0) она даёт другой порядок, чем настоящая длина."
