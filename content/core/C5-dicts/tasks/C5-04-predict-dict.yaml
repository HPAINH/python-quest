id: C5-04-predict-dict
type: predict
title: Словарь без запуска
difficulty: 2
lesson_section: dict-methods
statement: |
  Впиши, что выведет программа.
code: |
  stock = {"кофе": 5, "чай": 0}
  stock["чай"] += 3
  stock["мёд"] = stock.get("мёд", 0) + 1
  print(stock)
  print(sorted(stock, key=stock.get))
  print(stock.pop("кофе"), len(stock))
hints:
  - "Повтори get, sorted по значению и pop — раздел «Методы словарей»."
  - "Проследи словарь по шагам: что станет с чаем, появится ли мёд, в каком порядке ключи после сортировки по значению."
  - "Словарь печатается в порядке добавления ключей. sorted(stock, key=stock.get) сортирует ключи по значениям."
  - "Первая строка — словарь из трёх пар. Вторая — список из трёх ключей по возрастанию значений. Третья — два числа."
  - "Ответ: {'кофе': 5, 'чай': 3, 'мёд': 1}, ['мёд', 'чай', 'кофе'], «5 2». У мёда значение 1, у чая 3, у кофе 5. pop удаляет кофе, возвращает 5, остаётся 2 ключа."
