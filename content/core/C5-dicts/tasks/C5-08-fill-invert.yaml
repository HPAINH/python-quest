id: C5-08-fill-invert
type: fill_gaps
base: function
function: invert
title: Перевернуть словарь
difficulty: 2
lesson_section: dict-methods
statement: |
  Функция `invert(d)` получает словарь «товар → категория» и возвращает словарь «категория → отсортированный список товаров».

  Заполни пропуски.
template: |
  def invert(d):
      out = {}
      for item, cat in d.___():
          out.setdefault(cat, ___).append(item)
      return {c: ___(items) for c, items in out.items()}
reference: |
  def invert(d):
      out = {}
      for item, cat in d.items():
          out.setdefault(cat, []).append(item)
      return {c: sorted(items) for c, items in out.items()}
tests:
  visible: ["invert({'кофе': 'напитки', 'сыр': 'молочка', 'чай': 'напитки'})", "invert({})"]
  hidden: ["invert({'a': 'x'})", "invert({'b': 'x', 'a': 'x', 'c': 'y'})", "invert({'z': 1, 'y': 1, 'x': 2})"]
star3: [first_try]
hints:
  - "Группировка через setdefault — раздел «Вложенные структуры», перебор пар — раздел «Методы словарей»."
  - "Пройди по парам «товар, категория». Для категории возьми её список (создав пустой, если его нет) и добавь товар. В конце отсортируй каждый список."
  - "Метод items, пустой список [], функция sorted."
  - "Первый пропуск — метод, который даёт пары ключ–значение. Второй — значение по умолчанию для новой категории. Третий — функция сортировки, возвращающая новый список."
  - "setdefault(cat, []) создаёт пустой список для новой категории и возвращает список — к нему сразу добавляется товар. Последняя строка — генератор словаря: он строит новый словарь с теми же ключами и отсортированными списками."
