id: C5-03-unique
type: stdio
title: Уникальные клиенты
difficulty: 1
lesson_section: sets
statement: |
  В строке через пробел даны ID клиентов из лога заказов. Выведи, сколько среди них разных клиентов.
reference: |
  print(len(set(input().split())))
tests:
  visible: ["5 3 5 1 3", "7"]
  hidden: ["1 1 1 1", "1 2 3 4 5", "10 01 1"]
random: {count: 20, gen: "' '.join(str(random.randint(1, 15)) for _ in range(random.randint(1, 30)))"}
star3: [first_try, "max_lines:1"]
hints:
  - "Уникальные значения хранит множество — раздел «Множества»."
  - "Преврати список ID во множество и посчитай его размер."
  - "set(...) и len(...)."
  - "ids = input().split()\nprint(len(___(ids)))"
  - "Множество автоматически отбрасывает повторы, поэтому его длина — число разных значений. Обрати внимание: «10» и «01» — разные строки. Если ID — номера, «01» и «1» совпадут только после int()."
