  - code: "by_cat = {}\nusers = []\nfor _ in range(int(input())):\n    order_id, user, cat, amount = input().split()\n    by_cat[cat] = by_cat.get(cat, 0) + float(amount)\n    users.append(user)\nfor cat, rev in sorted(by_cat.items(), key=lambda p: (-p[1], p[0])):\n    print(f'{cat}: {rev:.2f}')\nprint(f'Клиентов: {len(users)}')\nprint('Лучший клиент: 0 (0.00)')"
hints:
  - "Нужны два счётчика-сумматора из раздела «Подсчёт частот» и сортировка пар из раздела «Методы словарей»."
  - "Заведи два словаря: выручка по категории и сумма по клиенту. Для каждой строки прибавь сумму в оба. Категории отсортируй по убыванию выручки и алфавиту. Число клиентов — размер второго словаря. Лучший клиент — ключ с наибольшей суммой, при равенстве — с наименьшим ID, поэтому ID переведи в int."
  - "by_cat.get(cat, 0) + amount, by_user[int(user)], sorted(by_cat.items(), key=lambda p: (-p[1], p[0])), min(by_user, key=lambda u: (-by_user[u], u))."
  - "by_cat = {}\nby_user = {}\nfor _ in range(int(input())):\n    order_id, user, cat, amount = input().split()\n    amount = ___(amount)\n    user = ___(user)\n    by_cat[cat] = by_cat.get(cat, 0) + amount\n    by_user[user] = by_user.get(user, ___) + amount\nfor cat, rev in sorted(by_cat.items(), key=lambda p: (___, p[0])):\n    print(f\"{cat}: {rev:.2f}\")\nprint(f\"Клиентов: {len(___)}\")\nbest = min(by_user, key=lambda u: (-by_user[u], ___))\nprint(f\"Лучший клиент: {best} ({by_user[best]:.2f})\")"
  - "Это ручной groupby: в pandas та же сводка — df.groupby('category')['amount'].sum(). ID переводится в int, иначе «10» окажется «меньше» «9» при сравнении строк. Суммы дробных чисел могут отличаться в последних знаках (0.1 + 0.2), поэтому при сравнении сумм эталон округляет их до копеек: round(x, 2)."
