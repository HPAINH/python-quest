id: C3-07-initials
type: stdio
title: Фамилия и инициалы
difficulty: 2
lesson_section: split-join
statement: |
  Дано полное имя клиента: фамилия, имя и отчество через пробел, возможно в разном регистре. Выведи `Фамилия И. О.`: фамилия с заглавной буквы, остальные буквы строчные, инициалы — заглавные.
reference: |
  last, first, middle = input().split()
  print(f"{last.capitalize()} {first[0].upper()}. {middle[0].upper()}.")
tests:
  visible: ["иванов иван иванович", "ПЕТРОВА анна СЕРГЕЕВНА"]
  hidden: ["a b c", "Смирнов Пётр Ильич", "o'brien mary jane"]
star3: [first_try, "uses:fstring"]
hints:
  - "Разбить имя на части поможет split, а регистр — методы из раздела «Методы строк»."
  - "Раздели строку на три слова. Для фамилии сделай первую букву заглавной, остальные строчными. От имени и отчества возьми первую букву в верхнем регистре."
  - "last, first, middle = input().split(); метод capitalize(); first[0].upper()."
  - "last, first, middle = input().split()\nprint(f\"{last.___()} {first[___].upper()}. {middle[0].___()}.\")"
  - "capitalize() делает первую букву заглавной, а остальные строчными: «ПЕТРОВА» → «Петрова». first[0] — первая буква имени. Распаковка a, b, c = список работает, когда в списке ровно три элемента."
