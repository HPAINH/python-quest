id: C3-05-predict-slices
type: predict
title: Срезы без запуска
difficulty: 2
lesson_section: slices
statement: |
  Впиши, что выведет программа.
code: |
  s = "2026-10-17"
  print(s[:4])
  print(s[5:7] + s[8:])
  print(s[::5])
  print(s[-2:], s[100:], "end")
  print(s.split("-")[1])
hints:
  - "Повтори срезы и split — разделы «Срезы» и «split и join»."
  - "Выпиши индексы: 2 0 2 6 - 1 0 - 1 7 → индексы 0…9."
  - "s[::5] — символы с индексами 0 и 5. s[100:] — пустая строка, но print всё равно разделит значения пробелами."
  - "Пять строк: год, месяц и день вместе, два символа, строка с пустым значением в середине, месяц."
  - "Ответ: «2026», «1017», «21», «17  end» (два пробела: между 17 и пустой строкой и между пустой строкой и end), «10». s[::5] — s[0] = 2 и s[5] = 1."
