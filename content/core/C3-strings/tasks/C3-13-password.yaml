id: C3-13-password
type: stdio
title: Надёжный пароль
difficulty: 2
lesson_section: methods
statement: |
  Дан пароль. Он надёжный, если в нём не меньше 8 символов и есть хотя бы одна цифра, одна заглавная и одна строчная буква. Выведи `надёжный` или `слабый`.
reference: |
  p = input()
  has_digit = has_up = has_low = False
  for ch in p:
      if ch.isdigit():
          has_digit = True
      if ch.isupper():
          has_up = True
      if ch.islower():
          has_low = True
  if len(p) >= 8 and has_digit and has_up and has_low:
      print("надёжный")
  else:
      print("слабый")
tests:
  visible: ["Qwerty123", "qwerty123"]
  hidden: ["Ab1", "ABCDEFG1", "abcdefgH", "Пароль2026", "        ", "aB3aB3aB"]
star3: [first_try]
buggy_variants:
  - code: "p = input()\nif len(p) > 8 and any(c.isdigit() for c in p) and any(c.isupper() for c in p) and any(c.islower() for c in p):\n    print('надёжный')\nelse:\n    print('слабый')"
hints:
  - "Проверка символов по одному — разделы «Методы строк» и «Обход строки»."
  - "Заведи три флага: есть цифра, есть заглавная, есть строчная. Пройди по символам и включай нужные флаги. В конце проверь длину и все три флага."
  - "isdigit(), isupper(), islower(), len(p) >= 8, and."
  - "p = input()\nhas_digit = has_up = has_low = ___\nfor ch in p:\n    if ch.isdigit():\n        has_digit = True\n    if ch.___():\n        has_up = True\n    if ch.___():\n        has_low = True\nif len(p) >= ___ and has_digit and has_up and has_low:\n    print(\"надёжный\")\nelse:\n    print(\"слабый\")"
  - "Флаги стартуют с False и становятся True, как только встретится подходящий символ. Важна граница: ровно 8 символов уже достаточно, поэтому >= 8. Методы isupper и islower работают и для русских букв."
