id: C3-08-fix-capital
type: fix_bug
base: stdio
title: Исправь заглавную букву
difficulty: 1
lesson_section: indexes
statement: |
  Программа должна делать первую букву строки заглавной, не трогая остальные. Сейчас она падает с ошибкой. Исправь её.
starter: |
  s = input()
  s[0] = s[0].upper()
  print(s)
reference: |
  s = input()
  s = s[0].upper() + s[1:]
  print(s)
tests:
  visible: ["python", "dataFrame"]
  hidden: ["a", "Уже", "123abc"]
star3: [first_try]
hints:
  - "Прочитай ошибку: строки неизменяемы — раздел «Индексы»."
  - "Изменить символ строки нельзя, но можно собрать новую строку из нового первого символа и остатка старой."
  - "s[0].upper() + s[1:]."
  - "s = input()\ns = s[0].upper() + s[___]\nprint(s)"
  - "s[1:] — всё, кроме первого символа. Склеиваем новую первую букву с остатком и записываем результат в s. Метод capitalize() не подходит: он сделал бы остальные буквы строчными и испортил «dataFrame»."
