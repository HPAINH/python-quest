id: C2-02-table
type: stdio
title: Таблица умножения
difficulty: 1
lesson_section: for-range
statement: |
  Дано число `n`. Выведи таблицу умножения на `n` от 1 до 10 в формате `n x i = результат`, по одной строке на множитель.
reference: |
  n = int(input())
  for i in range(1, 11):
      print(f"{n} x {i} = {n * i}")
tests:
  visible: ["7", "1"]
  hidden: ["0", "12", "-3"]
random: {count: 10, gen: "str(random.randint(-50, 99))"}
star3: [first_try, "uses:fstring"]
hints:
  - "Цикл по множителям от 1 до 10 — раздел «for и range», формат строки — f-строка из уровня C0."
  - "Для каждого i от 1 до 10 выведи строку из n, знака x, i, знака = и произведения."
  - "for i in range(1, 11) и print(f\"{n} x {i} = {n * i}\")."
  - "n = int(input())\nfor i in range(1, ___):\n    print(f\"{n} x {___} = {___}\")"
  - "range(1, 11) — это множители 1…10. В f-строке подставляются n, i и выражение n * i. Пробелы вокруг x и = должны быть точно как в примере."
