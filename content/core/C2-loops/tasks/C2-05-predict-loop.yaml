id: C2-05-predict-loop
type: predict
title: Сколько раз и что
difficulty: 2
lesson_section: break-continue
statement: |
  Впиши, что выведет программа.
code: |
  s = 0
  for i in range(1, 8):
      if i % 3 == 0:
          continue
      if i == 7:
          break
      s += i
  print(s)
  n = 20
  while n > 5:
      n -= 6
  print(n)
hints:
  - "Проследи цикл по шагам — раздел «break и continue» и «Цикл while»."
  - "continue пропускает 3 и 6. break сработает на 7 до прибавления. while уменьшает n на 6, пока n больше 5."
  - "Выпиши значения i от 1 до 7 и отметь, какие попадут в сумму."
  - "В сумму попадут 1, 2, 4, 5. Во втором цикле посчитай 20, 14, 8…"
  - "Ответ: 12 и 2. Сумма 1 + 2 + 4 + 5 = 12: 3 и 6 пропущены, на 7 цикл прервался. n: 20 → 14 → 8 → 2, и 2 > 5 ложно."
