id: C2-12-triangle
type: stdio
title: Лесенка
difficulty: 2
lesson_section: nested-loops
statement: |
  Дано `n`. Нарисуй лесенку из `n` ступеней: в строке `i` стоят числа от 1 до `i` через пробел.
reference: |
  n = int(input())
  for i in range(1, n + 1):
      for j in range(1, i + 1):
          print(j, end=" ")
      print()
tests:
  visible: ["3", "1"]
  hidden: ["2", "5", "9"]
star3: [first_try]
hints:
  - "Это вложенные циклы — раздел «Вложенные циклы»."
  - "Внешний цикл — номер строки i. Внутренний — числа от 1 до i в этой строке. После внутреннего цикла нужен перевод строки."
  - "Два for, print(j, end=\" \") внутри, print() после внутреннего цикла."
  - "n = int(input())\nfor i in range(1, n + 1):\n    for j in range(1, ___):\n        print(j, end=___)\n    ___"
  - "Внутренний цикл зависит от i: в первой строке одно число, во второй два. end=\" \" ставит пробел вместо перевода строки, а пробел в конце строки проверка не учитывает. print() завершает ряд."
