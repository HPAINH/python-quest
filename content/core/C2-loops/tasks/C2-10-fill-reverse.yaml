id: C2-10-fill-reverse
type: fill_gaps
base: stdio
title: Цифры задом наперёд
difficulty: 2
lesson_section: while
statement: |
  Дано натуральное число. Выведи его цифры в обратном порядке одной строкой без пробелов. Нули в конце исходного числа становятся ведущими нулями ответа: для `1200` ответ `0021`.

  Заполни пропуски.
template: |
  n = int(input())
  while n ___ 0:
      print(n ___ 10, end="")
      n ___ 10
  print()
reference: |
  n = int(input())
  while n > 0:
      print(n % 10, end="")
      n //= 10
  print()
tests:
  visible: ["1234", "1200"]
  hidden: ["7", "10", "908070"]
random: {count: 20, gen: "str(random.randint(1, 10**9))"}
star3: [first_try]
hints:
  - "Последняя цифра и отрезание цифры — разделы «Цикл while» и «Арифметика» из C0."
  - "Пока число больше нуля: выведи последнюю цифру без перевода строки и отрежь её."
  - "Сравнение >, остаток %, деление с присваиванием //=."
  - "Первый пропуск — сравнение «больше». Второй — оператор остатка. Третий — оператор, который делит нацело и записывает результат обратно в n."
  - "n % 10 — последняя цифра, end=\"\" печатает её без перевода строки. n //= 10 отрезает цифру. Цикл заканчивается, когда цифр не осталось. Последний print() переводит строку."
