id: C8-06-shapes
type: function
function: total_area
title: Площадь витрины
difficulty: 2
lesson_section: inheritance
statement: |
  Напиши иерархию фигур и функцию подсчёта:
  - `Shape` с методом `area()`, который выбрасывает `NotImplementedError`;
  - `Rect(w, h)` и `Circle(r)` наследуют `Shape` и считают площадь (для круга используй `math.pi`);
  - `Square(side)` наследует `Rect`;
  - функция `total_area(shapes)` возвращает сумму площадей, округлённую до 2 знаков.
starter: |
  import math

  class Shape:
      def area(self):
          raise NotImplementedError

  def total_area(shapes):
      pass
reference: |
  import math

  class Shape:
      def area(self):
          raise NotImplementedError

  class Rect(Shape):
      def __init__(self, w, h):
          self.w, self.h = w, h

      def area(self):
          return self.w * self.h

  class Circle(Shape):
      def __init__(self, r):
          self.r = r

      def area(self):
          return math.pi * self.r ** 2

  class Square(Rect):
      def __init__(self, side):
          super().__init__(side, side)

  def total_area(shapes):
      return round(sum(s.area() for s in shapes), 2)
tests:
  visible: ["total_area([Rect(2, 3), Square(4)])", "total_area([Circle(1)])"]
  hidden: ["total_area([])", "isinstance(Square(2), Rect)", "raises(lambda: Shape().area())", "total_area([Square(1), Circle(2), Rect(0.5, 0.5)])", "[round(s.area(), 2) for s in [Circle(0.5), Square(3)]]"]
star3: [first_try]
buggy_variants:
  - code: "import math\n\nclass Shape:\n    def area(self):\n        return 0\n\nclass Rect(Shape):\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        return 3.14 * self.r ** 2\n\nclass Square(Rect):\n    def __init__(self, side):\n        super().__init__(side, side)\n\ndef total_area(shapes):\n    return round(sum(s.area() for s in shapes), 2)"
hints:
  - "Наследование и super() — раздел «Наследование»."
  - "Rect хранит ширину и высоту, Circle — радиус, у каждого своя area. Square — это Rect с равными сторонами: передай side дважды в конструктор родителя. total_area просто вызывает area() у каждой фигуры."
  - "class Rect(Shape), class Square(Rect), super().__init__(side, side), math.pi * r ** 2, sum(s.area() for s in shapes)."
  - "class Rect(Shape):\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n\n    def area(self):\n        return self.w * ___\n\nclass Circle(___):\n    def __init__(self, r):\n        self.r = r\n\n    def area(self):\n        return math.pi * self.r ** ___\n\nclass Square(Rect):\n    def __init__(self, side):\n        super().__init__(___, side)\n\ndef total_area(shapes):\n    return round(sum(s.area() for s in shapes), 2)"
  - "total_area не знает, какие фигуры ей передали, — она просто вызывает area(). Это и есть смысл наследования. Square не нужен свой area: его даёт Rect. 3.14 вместо math.pi даёт заметную ошибку уже во втором знаке."
