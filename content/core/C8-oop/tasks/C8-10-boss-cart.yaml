hints:
  - "Нужны dataclass (раздел «dataclass»), класс с методами и __len__ (разделы «Методы» и «Специальные методы»), raise из C7."
  - "Храни позиции в словаре sku → Item, тогда повторное добавление легко находит товар. remove уменьшает количество и удаляет позицию при нуле. items сортирует значения словаря по sku. total: пустая корзина — 0; иначе возьми subtotal, примени промокод, затем добавь доставку, если сумма меньше 3000."
  - "self._items = {}, Item(sku, price, old.qty + qty), del self._items[sku], raise KeyError, sorted(..., key=lambda it: it.sku), sum(it.qty ...), min(it.price ...)."
  - "    def total(self, promo=None):\n        if not self._items:\n            return ___\n        amount = self.subtotal()\n        if promo == \"SALE10\":\n            amount = amount * ___\n        elif promo == \"BUY3\" and sum(it.qty for it in self._items.values()) >= ___:\n            amount -= min(it.price for it in self._items.values())\n        if amount < ___:\n            amount += 299\n        return round(amount, 2)"
  - "Корзина из примера: чай 2 × 450 и кофе 990, subtotal 1890. Без промокода 1890 + 299 = 2189. SALE10: 1701 + 299 = 2000. BUY3: штук 3, самый дешёвый товар — чай за 450, 1440 + 299 = 1739. Доставка считается после скидки, поэтому 3000 со скидкой 10% (2700) снова платит 299. Словарь даёт быстрый поиск по sku, а dataclass — готовые __repr__ и __eq__ для вывода и тестов."
