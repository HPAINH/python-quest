id: C8-10-boss-cart
type: function
title: "Босс: корзина ShopData"
difficulty: 3
boss: true
lesson_section: dataclass
statement: |
  Собери модель корзины. Каждая часть проверяется отдельным шагом.

  **Шаг 1.** `Item` — `@dataclass` с полями `sku` (str), `price` (float), `qty` (int, по умолчанию 1) и методом `total()` → `price × qty`, округлённая до 2 знаков.

  **Шаг 2.** `Cart` — класс корзины:
  - `add(sku, price, qty=1)` добавляет товар. Если такой `sku` уже есть, увеличивает его количество, а цену берёт новую;
  - `remove(sku, qty=1)` уменьшает количество и удаляет позицию при нуле. Если товара нет, выбрасывает `KeyError`;
  - `len(cart)` — число **разных** товаров;
  - `items()` — список `Item`, отсортированный по `sku`;
  - `subtotal()` — сумма `total()` всех позиций, округлённая до 2 знаков.

  **Шаг 3.** `Cart.total(promo=None)` — итог к оплате, округлённый до 2 знаков:
  - `"SALE10"` — скидка 10% на `subtotal`;
  - `"BUY3"` — самый дешёвый товар в корзине бесплатно (одна штука), если всего штук в корзине от 3;
  - доставка 299 ₽ добавляется, если сумма после скидки меньше 3000 ₽. Пустая корзина стоит 0.
reference: |
  from dataclasses import dataclass

  @dataclass
  class Item:
      sku: str
      price: float
      qty: int = 1

      def total(self):
          return round(self.price * self.qty, 2)

  class Cart:
      def __init__(self):
          self._items = {}

      def add(self, sku, price, qty=1):
          if sku in self._items:
              old = self._items[sku]
              self._items[sku] = Item(sku, price, old.qty + qty)
          else:
              self._items[sku] = Item(sku, price, qty)

      def remove(self, sku, qty=1):
          if sku not in self._items:
              raise KeyError(sku)
          item = self._items[sku]
          item.qty -= qty
          if item.qty <= 0:
              del self._items[sku]

      def __len__(self):
          return len(self._items)

      def items(self):
          return sorted(self._items.values(), key=lambda it: it.sku)

      def subtotal(self):
          return round(sum(it.total() for it in self._items.values()), 2)

      def total(self, promo=None):
          if not self._items:
              return 0
          amount = self.subtotal()
          if promo == "SALE10":
              amount = amount * 0.9
          elif promo == "BUY3" and sum(it.qty for it in self._items.values()) >= 3:
              amount -= min(it.price for it in self._items.values())
          if amount < 3000:
              amount += 299
          return round(amount, 2)
