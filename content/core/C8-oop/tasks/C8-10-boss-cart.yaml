  - title: Позиция корзины
    function: Item
    tests:
      visible: ["Item('TEA', 450.0, 2).total()", "Item('X', 9.99)"]
      hidden: ["Item('A', 0.1, 3).total()", "Item('A', 1.0) == Item('A', 1.0, 1)", "Item('Q', 5.0, 0).total()"]
  - title: Корзина
    function: Cart
    tests:
      visible: ["c = Cart()\nc.add('TEA', 450, 2)\nc.add('COF', 990)\nc.add('TEA', 460)\n(len(c), c.items(), c.subtotal())", "c = Cart()\nraises(lambda: c.remove('X'))"]
      hidden: ["c = Cart()\nc.add('A', 10, 2)\nc.remove('A')\nc.remove('A')\n(len(c), c.subtotal())", "c = Cart()\nc.add('B', 1)\nc.add('A', 2)\n[i.sku for i in c.items()]", "Cart().subtotal()", "a, b = Cart(), Cart()\na.add('X', 1)\n(len(a), len(b))", "c = Cart()\nc.add('A', 100, 3)\nc.remove('A', 5)\nlen(c)"]
  - title: Итог с промокодом и доставкой
    function: Cart
    tests:
      visible: ["c = Cart()\nc.add('TEA', 450, 2)\nc.add('COF', 990)\n[c.total(), c.total('SALE10'), c.total('BUY3')]", "Cart().total('SALE10')"]
      hidden: ["c = Cart()\nc.add('A', 3000)\n[c.total(), c.total('SALE10')]", "c = Cart()\nc.add('A', 1000, 2)\n[c.total('BUY3'), c.total('sale10')]", "c = Cart()\nc.add('A', 2000)\nc.add('B', 100)\nc.add('C', 1500)\nc.total('BUY3')", "c = Cart()\nc.add('A', 3333.33)\nc.total('SALE10')"]
