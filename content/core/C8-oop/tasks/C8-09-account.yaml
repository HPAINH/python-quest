id: C8-09-account
type: function
function: Account
title: Счёт с историей
difficulty: 3
lesson_section: methods
statement: |
  Напиши класс `Account(owner, limit=0)` — счёт клиента с возможным кредитным лимитом:
  - `balance` — текущий баланс, сначала 0;
  - `deposit(amount)` и `withdraw(amount)` возвращают новый баланс. Сумма должна быть больше нуля, иначе `ValueError`. Снять можно, только если баланс не опустится ниже `-limit`, иначе `ValueError`, а баланс не меняется;
  - `history()` возвращает список успешных операций в виде пар `("+", сумма)` и `("-", сумма)`.
starter: |
  class Account:
      def __init__(self, owner, limit=0):
          self.owner = owner
reference: |
  class Account:
      def __init__(self, owner, limit=0):
          self.owner = owner
          self.limit = limit
          self.balance = 0
          self._log = []

      def deposit(self, amount):
          if amount <= 0:
              raise ValueError("сумма должна быть больше нуля")
          self.balance += amount
          self._log.append(("+", amount))
          return self.balance

      def withdraw(self, amount):
          if amount <= 0:
              raise ValueError("сумма должна быть больше нуля")
          if self.balance - amount < -self.limit:
              raise ValueError("недостаточно средств")
          self.balance -= amount
          self._log.append(("-", amount))
          return self.balance

      def history(self):
          return list(self._log)
tests:
  visible: ["a = Account('Аня')\na.deposit(1000)\na.withdraw(300)\n(a.balance, a.history())", "a = Account('Борис')\nraises(lambda: a.withdraw(1))"]
  hidden: ["a = Account('В', limit=500)\na.withdraw(500)\n(a.balance, raises(lambda: a.withdraw(1)), a.balance)", "a = Account('Г')\n[raises(lambda: a.deposit(0)), raises(lambda: a.deposit(-5)), a.history()]", "a = Account('Д')\na.deposit(100)\nraises(lambda: a.withdraw(101))\n(a.balance, a.history())", "a = Account('Е')\nh = a.history()\nh.append('x')\na.history()"]
