hints:
  - "Методы меняют атрибуты объекта, а ошибки выбрасываются через raise — разделы «Методы» и «raise» из C7."
  - "В __init__ заведи limit, balance = 0 и пустой список операций. В deposit и withdraw сначала проверь сумму, в withdraw — ещё и лимит, и только потом меняй баланс и пиши в историю. history возвращает копию списка, чтобы снаружи его нельзя было испортить."
  - "self.balance = 0, self._log = [], raise ValueError, if self.balance - amount < -self.limit, return list(self._log)."
  - "    def withdraw(self, amount):\n        if amount <= 0:\n            raise ValueError(\"сумма\")\n        if self.balance - amount < ___:\n            raise ValueError(\"недостаточно средств\")\n        self.balance -= amount\n        self._log.append((___, amount))\n        return self.balance\n\n    def history(self):\n        return ___(self._log)"
  - "Порядок важен: сначала проверить, потом менять. Если сначала вычесть, а потом выбросить ошибку, баланс останется испорченным. Копия list(self._log) защищает внутренний список: изменение полученного списка не трогает историю счёта."
