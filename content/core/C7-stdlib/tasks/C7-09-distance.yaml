id: C7-09-distance
type: function
function: distance_km
title: Расстояние доставки
difficulty: 2
lesson_section: itertools-math
statement: |
  Напиши функцию `distance_km(lat1, lon1, lat2, lon2)`, которая возвращает расстояние между двумя точками на Земле по формуле гаверсинуса, округлённое до 1 км. Радиус Земли — 6371 км, координаты даны в градусах.

  Формула: `a = sin²(Δφ/2) + cos φ1 · cos φ2 · sin²(Δλ/2)`, расстояние `= 2R · asin(√a)`, где φ — широта и λ — долгота в радианах.
starter: |
  import math

  def distance_km(lat1, lon1, lat2, lon2):
      pass
reference: |
  import math

  def distance_km(lat1, lon1, lat2, lon2):
      p1, p2 = math.radians(lat1), math.radians(lat2)
      dp = p2 - p1
      dl = math.radians(lon2 - lon1)
      a = math.sin(dp / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(dl / 2) ** 2
      return round(2 * 6371 * math.asin(math.sqrt(a)))
tests:
  visible: ["distance_km(55.7558, 37.6173, 59.9343, 30.3351)", "distance_km(55.75, 37.62, 55.75, 37.62)"]
