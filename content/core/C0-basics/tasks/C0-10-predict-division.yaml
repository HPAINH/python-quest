id: C0-10-predict-division
type: predict
title: Деление и остатки
difficulty: 2
lesson_section: arithmetic
statement: |
  Впиши, что выведет программа, не запуская её.
code: |
  x = 17
  print(x // 4, x % 4)
  print(x / 4)
  print(-x // 4)
  print(2 ** 3 * 2)
hints:
  - "Повтори операторы из раздела «Арифметика»."
  - "// округляет вниз (к минус бесконечности), а не к нулю. / всегда даёт float. ** выполняется раньше *."
  - "Посчитай каждое выражение отдельно: 17 // 4, 17 % 4, 17 / 4, -17 // 4, 2 ** 3 * 2."
  - "Первая строка — два числа через пробел. Вторая — дробь. Третья — отрицательное число на 1 меньше, чем -4."
  - "Ответ: «4 1», «4.25», «-5», «16». -17 / 4 = -4.25, а // округляет вниз, то есть к -5. 2 ** 3 = 8, 8 * 2 = 16."
