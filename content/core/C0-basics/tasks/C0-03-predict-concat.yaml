id: C0-03-predict-concat
type: predict
title: Что выведет программа
difficulty: 1
lesson_section: types
statement: |
  Не запуская код, впиши, что он выведет. Каждая строка вывода — на своей строке ответа.
code: |
  a = "5"
  b = 2
  print(a * b)
  print(int(a) * b)
  print(a + str(b))
hints:
  - "Смотри, какого типа каждое значение — раздел «Типы данных»."
  - "Строка, умноженная на число, повторяется. Число, умноженное на число, — обычное умножение. Строки при + склеиваются."
  - "Посчитай три print по очереди: тип a — str, тип b — int."
  - "Первая строка — строка «5», повторённая 2 раза; вторая — 5 * 2; третья — склейка «5» и «2»."
  - "Ответ: 55, 10, 52. \"5\" * 2 = \"55\" (повтор строки), int(\"5\") * 2 = 10, \"5\" + \"2\" = \"52\" (склейка)."
