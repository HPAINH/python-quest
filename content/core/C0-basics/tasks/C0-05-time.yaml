id: C0-05-time
type: stdio
title: Секунды в часы
difficulty: 2
lesson_section: arithmetic
statement: |
  Дана длительность сессии пользователя в секундах. Выведи её в формате `ч:мм:сс`: часы без ведущего нуля, минуты и секунды — всегда двумя цифрами.
reference: |
  s = int(input())
  print(f"{s // 3600}:{s % 3600 // 60:02d}:{s % 60:02d}")
tests:
  visible: ["3725", "59"]
  hidden: ["0", "3600", "86399", "360000"]
random: {count: 25, gen: "str(random.randint(0, 200000))"}
star3: [first_try, "uses:fstring"]
buggy_variants:
  - code: "s = int(input())\nprint(s // 3600, s % 3600 // 60, s % 60, sep=':')"
hints:
  - "Нужны // и % из раздела «Арифметика» и формат :02d из раздела «Вывод: print»."
  - "Часы — целое число часов в секундах. Минуты — сколько целых минут в остатке после часов. Секунды — остаток от деления на 60."
  - "s // 3600, s % 3600 // 60, s % 60 и f-строка с форматом :02d."
  - "s = int(input())\nh = s // ___\nm = s % 3600 // ___\nsec = s % ___\nprint(f\"{h}:{m:___}:{sec:___}\")"
  - "3725 // 3600 = 1 час. Остаток 3725 % 3600 = 125 секунд, из них 125 // 60 = 2 минуты. 3725 % 60 = 5 секунд. Формат :02d печатает 2 как «02», поэтому выйдет 1:02:05."
