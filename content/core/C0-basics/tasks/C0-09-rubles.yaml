id: C0-09-rubles
type: stdio
title: Рубли и копейки
difficulty: 2
lesson_section: arithmetic
statement: |
  Дана сумма покупки в копейках — целое неотрицательное число. Выведи её в виде `R руб. K коп.`, где `K` — от 0 до 99 без ведущего нуля.
reference: |
  k = int(input())
  print(f"{k // 100} руб. {k % 100} коп.")
tests:
  visible: ["1234", "99"]
  hidden: ["0", "100", "100001"]
random: {count: 20, gen: "str(random.randint(0, 10**6))"}
star3: [first_try, "uses:fstring"]
hints:
  - "В рубле 100 копеек — нужны // и % из раздела «Арифметика»."
  - "Целая часть от деления на 100 — рубли, остаток — копейки. Собери строку из двух чисел и слов."
  - "k // 100, k % 100 и f-строка."
  - "k = int(input())\nprint(f\"{k // ___} руб. {k ___ 100} коп.\")"
  - "1234 // 100 = 12 рублей, 1234 % 100 = 34 копейки. f-строка подставляет оба числа между словами, пробелы стоят точно как в условии."
