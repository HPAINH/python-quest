id: C0-07-fill-average
type: fill_gaps
base: stdio
title: Среднее трёх
difficulty: 1
lesson_section: print
statement: |
  Даны три целых числа в одной строке через пробел. Выведи их среднее арифметическое ровно с двумя знаками после запятой.

  Заполни пропуски `___`, остальной код менять нельзя.
template: |
  a, b, c = map(___, input().split())
  avg = (a + b + c) ___ 3
  print(f"{avg:___}")
reference: |
  a, b, c = map(int, input().split())
  avg = (a + b + c) / 3
  print(f"{avg:.2f}")
tests:
  visible: ["1 2 4", "10 20 30"]
  hidden: ["0 0 0", "-1 -2 -2", "100 0 1"]
random: {count: 20, gen: "' '.join(str(random.randint(-100, 100)) for _ in range(3))"}
star3: [first_try]
hints:
  - "Формат вывода с двумя знаками — раздел «Вывод: print»."
  - "Числа нужно перевести в int, сумму поделить на 3 обычным делением, а вывести с форматом на 2 знака после запятой."
  - "int, оператор /, формат .2f."
  - "Первый пропуск — функция перевода в целое, второй — оператор деления с дробным результатом, третий — формат «2 знака после точки, тип f»."
  - "map(int, ...) переводит все три числа. Деление / нужно, чтобы не потерять дробную часть: 7 / 3 = 2.333…, а 7 // 3 = 2. Формат .2f округляет до двух знаков: 2.33."
