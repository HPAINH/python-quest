id: C0-12-boss-session
type: stdio
title: "Босс: конец сессии"
difficulty: 3
boss: true
lesson_section: arithmetic
statement: |
  Аналитик ShopData считает, когда закончилась сессия пользователя.

  В первой строке через пробел даны часы и минуты начала сессии (`0 ≤ ч ≤ 23`, `0 ≤ м ≤ 59`). Во второй строке — длительность сессии в минутах (целое неотрицательное число, может быть больше суток).

  Выведи время окончания в формате `чч:мм` — часы и минуты всегда двумя цифрами. Время идёт по кругу: после `23:59` наступает `00:00`.
reference: |
  h, m = map(int, input().split())
  d = int(input())
  total = (h * 60 + m + d) % (24 * 60)
  print(f"{total // 60:02d}:{total % 60:02d}")
tests:
  visible: ["9 30\n45", "23 50\n20"]
  hidden: ["0 0\n0", "23 59\n1", "12 0\n1440", "7 5\n3000", "0 1\n1439"]
random: {count: 30, gen: "f'{random.randint(0, 23)} {random.randint(0, 59)}\\n{random.randint(0, 5000)}'"}
star3: [first_try, "max_lines:4"]
buggy_variants:
  - code: "h, m = map(int, input().split())\nd = int(input())\nt = h * 60 + m + d\nprint(f'{t // 60:02d}:{t % 60:02d}')"
hints:
  - "Нужно всё из уровня: ввод через split, // и %, формат :02d. Главное — раздел «Арифметика»."
  - "Переведи время начала в минуты от полуночи, прибавь длительность и возьми остаток от деления на число минут в сутках. Из результата снова получи часы и минуты."
  - "map(int, input().split()), h * 60 + m, % (24 * 60), // 60, % 60, f-строка с :02d."
  - "h, m = map(int, input().split())\nd = int(input())\ntotal = (h * 60 + m + d) % ___\nprint(f\"{total // ___:02d}:{total % ___:___}\")"
  - "9:30 — это 570 минут от полуночи. 570 + 45 = 615. Остаток от деления на 1440 (минут в сутках) убирает лишние сутки. 615 // 60 = 10 часов, 615 % 60 = 15 минут → 10:15. Для 23:50 + 20: 1430 + 20 = 1450, 1450 % 1440 = 10 → 00:10."
