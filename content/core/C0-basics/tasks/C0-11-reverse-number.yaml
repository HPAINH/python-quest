id: C0-11-reverse-number
type: stdio
title: Число задом наперёд
difficulty: 3
lesson_section: arithmetic
statement: |
  Дано четырёхзначное число. Выведи число, записанное теми же цифрами в обратном порядке. Ведущие нули в ответе пропадают: для `1200` ответ `21`.

  Реши только арифметикой — без индексов и срезов строк.
reference: |
  n = int(input())
  a, b, c, d = n // 1000, n // 100 % 10, n // 10 % 10, n % 10
  print(d * 1000 + c * 100 + b * 10 + a)
requires: [no_subscript]
tests:
  visible: ["1234", "1200"]
  hidden: ["1000", "9999", "4071", "8810"]
random: {count: 25, gen: "str(random.randint(1000, 9999))"}
star3: [first_try, "max_lines:3"]
buggy_variants:
  - code: "n = int(input())\nprint(n % 10, n // 10 % 10, n // 100 % 10, n // 1000, sep='')"
hints:
  - "Цифры достаются как в задаче «Сумма цифр» — раздел «Арифметика»."
  - "Достань четыре цифры, а потом собери новое число: последняя цифра становится тысячами, предпоследняя — сотнями и так далее."
  - "n // 1000, n // 100 % 10, n // 10 % 10, n % 10; сборка через умножение на 1000, 100, 10."
  - "n = int(input())\na = n // 1000\nb = n // 100 % ___\nc = n // 10 % ___\nd = n % ___\nprint(d * ___ + c * 100 + b * ___ + a)"
  - "Для 1200: a=1, b=2, c=0, d=0. Новое число 0*1000 + 0*100 + 2*10 + 1 = 21. Если склеить цифры строкой, получится «0021» — именно поэтому собираем число арифметикой."
