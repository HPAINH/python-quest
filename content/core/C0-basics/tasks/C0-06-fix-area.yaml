id: C0-06-fix-area
type: fix_bug
base: stdio
title: Исправь площадь
difficulty: 1
lesson_section: input
statement: |
  Программа должна читать ширину и высоту прямоугольника (каждое число на своей строке) и выводить его площадь. Но она падает с ошибкой. Найди и исправь баг.
starter: |
  w = input()
  h = input()
  print(w * h)
reference: |
  w = int(input())
  h = int(input())
  print(w * h)
tests:
  visible: ["3\n4", "10\n10"]
  hidden: ["1\n1", "0\n5", "123\n456"]
random: {count: 20, gen: "f'{random.randint(0, 999)}\\n{random.randint(0, 999)}'"}
star3: [first_try]
hints:
  - "Запусти код и прочитай ошибку. Подумай, какого типа значения возвращает input() — раздел «Ввод: input»."
  - "Нельзя умножить строку на строку. Значения нужно перевести в числа сразу после чтения."
  - "Нужна функция int()."
  - "w = int(___)\nh = ___(input())\nprint(w * h)"
  - "input() вернул строки «3» и «4». Строку можно умножить на число (повтор), но не на строку — отсюда TypeError. int(input()) делает из ввода число, и w * h считает площадь."
