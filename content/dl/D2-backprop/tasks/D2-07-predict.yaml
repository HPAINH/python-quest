id: D2-07-predict
type: predict
title: Градиенты в цифрах
difficulty: 2
lesson_section: layer-grads
statement: 'Впиши, что выведет программа.

  '
code: 'import numpy as np

  X = np.array([[1.0, 2.0], [3.0, 4.0]])

  W = np.array([[1.0], [-1.0]])

  dZ = np.array([[1.0], [2.0]])

  print((X.T @ dZ).ravel().tolist(), dZ.sum(axis=0).tolist())

  print((dZ @ W.T).tolist())

  Z = np.array([-1.0, 0.5])

  print((np.array([3.0, 3.0]) * (Z > 0)).tolist())

  f = lambda v: v ** 2

  print(round((f(3 + 1e-3) - f(3 - 1e-3)) / 2e-3, 6))

  '
hints:
- Повтори разделы «Градиенты слоя», «Производные активаций» и «Численная проверка».
- 'X.T @ dZ: первая строка X.T — [1, 3], вторая — [2, 4]; умножаем на [1, 2].'
- 'dZ @ W.T: каждая строка — dZ[i] · [1, −1]. ReLU пропускает градиент только для положительного входа 0.5.'
- 'Четыре строки: два списка, список списков, список, число.'
- 'Ответ: «[7.0, 10.0] [3.0]», «[[1.0, -1.0], [2.0, -2.0]]», «[0.0, 3.0]», «6.0».'
