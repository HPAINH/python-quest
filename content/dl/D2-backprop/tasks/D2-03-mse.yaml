id: D2-03-mse
type: function
function: mse
title: MSE и её градиент
difficulty: 1
lesson_section: loss-grads
tol: 1.0e-09
statement: 'Напиши функцию `mse(p, y)`, которая для массивов прогнозов `p` и ответов `y` одной формы возвращает кортеж `(loss, grad)`: `loss` — среднее `(p − y)²` по всем элементам, `grad` — градиент `loss` по `p`.

  '
setup: "import numpy as np\n\ndef rnd(*shape, seed=0):\n    return np.random.default_rng(seed).normal(size=shape).round(3)\n\ndef labels(n, k, seed=0):\n    return np.random.default_rng(seed).integers(0, k, n)\n"
starter: "def mse(p, y):\n    pass\n"
reference: "def mse(p, y):\n    n = p.size\n    loss = ((p - y) ** 2).mean()\n    grad = 2 * (p - y) / n\n    return loss, grad\n"
tests:
  visible:
  - mse(np.array([1.0, 2.0, 4.0]), np.array([1.0, 3.0, 2.0]))
  hidden:
  - mse(rnd(5, seed=1), rnd(5, seed=2))
  - mse(rnd(2, 3, seed=3), np.zeros((2, 3)))
  - mse(np.ones(4), np.ones(4))
random:
  count: 15
  gen: '(lambda a, b, s: f''mse(rnd({a}, {b}, seed={s}), rnd({a}, {b}, seed={s + 1}))'')(random.randint(1, 5), random.randint(1, 4), random.randint(0, 999))'
star3:
- first_try
- max_lines:5
buggy_variants:
- code: "def mse(p, y):\n    loss = ((p - y) ** 2).mean()\n    return loss, 2 * (p - y)"
- code: "def mse(p, y):\n    loss = ((p - y) ** 2).mean()\n    return loss, 2 * (y - p) / p.size"
hints:
- Градиенты потерь — раздел «Градиенты потерь».
- Потеря — среднее квадратов разностей. Производная одного слагаемого (p − y)² — 2(p − y), и не забудь деление на число элементов от среднего.
- loss = ((p - y) ** 2).mean(); grad = 2 * (p - y) / p.size.
- "def mse(p, y):\n    n = p.___\n    loss = ((p - y) ** 2).mean()\n    grad = 2 * (p - ___) / n\n    return loss, grad"
- 'Без деления на n шаг обучения зависел бы от размера пакета. Знак важен: градиент указывает, куда потеря растёт, а обновление идёт в обратную сторону.'
