- code: "def softmax_ce(Z, y):\n    n = Z.shape[0]\n    e = np.exp(Z)\n    P = e / e.sum(axis=1, keepdims=True)\n    loss = -np.log(P[np.arange(n), y]).mean()\n    Y = np.eye(Z.shape[1])[y]\n    return loss, (P - Y) / n"
hints:
- Кросс-энтропия и её градиент — раздел «Градиенты потерь».
- Посчитай устойчивый softmax, выбери вероятность правильного класса в каждой строке через P[np.arange(n), y], усредни −log. Градиент — (P − one-hot) / n.
- P[np.arange(n), y], np.eye(k)[y], (P - Y) / n.
- "def softmax_ce(Z, y):\n    n = Z.shape[0]\n    e = np.exp(Z - Z.max(axis=1, keepdims=True))\n    P = e / e.sum(axis=1, keepdims=True)\n    loss = -np.log(P[np.arange(n), ___]).mean()\n    Y = np.eye(Z.shape[1])[___]\n    return loss, (P - Y) / ___"
- Простота (P − Y) / n — причина, по которой softmax и кросс-энтропию всегда считают вместе. Логиты, умноженные на 400, без вычитания максимума дадут nan.
