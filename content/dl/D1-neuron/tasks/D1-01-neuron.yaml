id: D1-01-neuron
type: function
function: neuron
title: Один нейрон
difficulty: 1
lesson_section: neuron
tol: 1.0e-09
statement: 'Напиши функцию `neuron(x, w, b)`: `x` и `w` — массивы одной длины, `b` — число. Функция возвращает взвешенную сумму `w·x + b` числом.

  '
setup: "import numpy as np\n\ndef rnd(*shape, seed=0):\n    return np.random.default_rng(seed).normal(size=shape).round(3)\n"
starter: "def neuron(x, w, b):\n    pass\n"
reference: "def neuron(x, w, b):\n    return float(np.dot(x, w) + b)\n"
tests:
  visible:
  - neuron(np.array([2.0, 0.5, -1.0]), np.array([0.4, -0.2, 0.3]), 0.1)
  - neuron(np.array([1.0]), np.array([3.0]), -3.0)
  hidden:
  - neuron(np.zeros(4), np.ones(4), 2.5)
  - neuron(rnd(5, seed=1), rnd(5, seed=2), 0.0)
  - neuron(np.array([1e3, -1e3]), np.array([1.0, 1.0]), 0.0)
random:
  count: 20
  gen: '(lambda n, s: f''neuron(rnd({n}, seed={s}), rnd({n}, seed={s + 1}), {round(random.uniform(-2, 2), 3)})'')(random.randint(1, 8), random.randint(0, 999))'
star3:
- first_try
- max_lines:2
buggy_variants:
- code: "def neuron(x, w, b):\n    return float(np.sum(x + w) + b)"
- code: "def neuron(x, w, b):\n    return float(np.dot(x, w))"
hints:
- Взвешенная сумма — раздел «Нейрон».
- Перемножь входы на веса поэлементно и сложи, потом прибавь сдвиг. Это скалярное произведение.
- np.dot(x, w) + b или x @ w + b.
- "def neuron(x, w, b):\n    return float(np.___(x, w) + ___)"
- float() превращает NumPy-скаляр в обычное число. Без сдвига b нейрон всегда проводит границу через начало координат.
