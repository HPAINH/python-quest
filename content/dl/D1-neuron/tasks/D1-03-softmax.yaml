id: D1-03-softmax
type: function
function: softmax
title: Устойчивый softmax
difficulty: 2
lesson_section: activations
tol: 1.0e-09
statement: 'Напиши функцию `softmax(Z)` для двумерного массива: в каждой строке — вероятности классов, сумма строки равна 1. Функция должна работать и для больших значений, например 1000.

  '
setup: "import numpy as np\n\ndef rnd(*shape, seed=0):\n    return np.random.default_rng(seed).normal(size=shape).round(3)\n"
starter: "def softmax(Z):\n    pass\n"
reference: "def softmax(Z):\n    e = np.exp(Z - Z.max(axis=1, keepdims=True))\n    return e / e.sum(axis=1, keepdims=True)\n"
tests:
  visible:
  - softmax(np.array([[1.0, 2.0, 3.0]]))
  - softmax(np.array([[0.0, 0.0], [1.0, -1.0]]))
  hidden:
  - softmax(np.array([[1000.0, 1001.0], [-1000.0, -999.0]]))
  - softmax(rnd(4, 3, seed=7))
  - softmax(np.zeros((2, 5)))
random:
  count: 20
  gen: f'softmax(rnd({random.randint(1, 5)}, {random.randint(2, 5)}, seed={random.randint(0, 999)}) * {random.choice([1, 10, 100])})'
star3:
- first_try
- max_lines:3
buggy_variants:
- code: "def softmax(Z):\n    e = np.exp(Z)\n    return e / e.sum(axis=1, keepdims=True)"
- code: "def softmax(Z):\n    e = np.exp(Z - Z.max())\n    return e / e.sum()"
hints:
- Softmax и вычитание максимума — разделы «Активации» и «Прямой проход».
- Вычти из каждой строки её максимум, возьми exp и раздели на сумму строки. keepdims=True сохраняет форму для деления по строкам.
- e = np.exp(Z - Z.max(axis=1, keepdims=True)); e / e.sum(axis=1, keepdims=True).
- "def softmax(Z):\n    e = np.exp(Z - Z.max(axis=___, keepdims=True))\n    return e / e.sum(axis=1, keepdims=___)"
- np.exp(1000) — бесконечность, а inf / inf — nan. Вычитание максимума строки ничего не меняет в ответе, но держит exp в пределах 1. Деление на сумму всей матрицы даёт строки, которые не складываются в 1.
