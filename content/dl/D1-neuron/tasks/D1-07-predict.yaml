id: D1-07-predict
type: predict
title: Формы и активации
difficulty: 2
lesson_section: layer
statement: 'Впиши, что выведет программа.

  '
code: 'import numpy as np

  X = np.ones((3, 2))

  W = np.array([[1.0, -1.0, 0.0], [2.0, 0.0, -3.0]])

  b = np.array([0.0, 0.5, 1.0])

  Z = X @ W + b

  print(Z.shape, Z[0].tolist())

  print(np.maximum(0, Z[0]).tolist())

  e = np.exp(np.array([0.0, np.log(3.0)]))

  print((e / e.sum()).round(2).tolist())

  print(int(np.array([0.2, 0.9]) @ np.array([1.0, 1.0]) >= 1))

  '
hints:
- Повтори разделы «Слой», «Активации» и «Перцептрон».
- 'Каждая строка X — [1, 1], поэтому строка Z — сумма строк W плюс b: [3, −1, −3] + [0, 0.5, 1].'
- ReLU оставляет только положительное. exp(ln 3) = 3, поэтому softmax от [0, ln 3] — [1/4, 3/4].
- 'Четыре строки: форма и список, список, список, число.'
- 'Ответ: «(3, 3) [3.0, -0.5, -2.0]», «[3.0, 0.0, 0.0]», «[0.25, 0.75]», «1».'
