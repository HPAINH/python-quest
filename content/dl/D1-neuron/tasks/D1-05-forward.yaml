id: D1-05-forward
type: function
function: forward
title: Двухслойная сеть
difficulty: 2
lesson_section: forward
tol: 1.0e-09
statement: 'Напиши функцию `forward(X, W1, b1, W2, b2)` — прямой проход сети: скрытый слой `X @ W1 + b1` с ReLU, затем выходной слой `… @ W2 + b2` и softmax по строкам. Функция возвращает матрицу вероятностей. Вспомогательные функции можно объявить в коде.

  '
setup: "import numpy as np\n\ndef rnd(*shape, seed=0):\n    return np.random.default_rng(seed).normal(size=shape).round(3)\n"
starter: "def forward(X, W1, b1, W2, b2):\n    pass\n"
reference: "def relu(z):\n    return np.maximum(0, z)\n\ndef softmax(z):\n    e = np.exp(z - z.max(axis=1, keepdims=True))\n    return e / e.sum(axis=1, keepdims=True)\n\ndef forward(X, W1, b1, W2, b2):\n    H = relu(X @ W1 + b1)\n    return softmax(H @ W2 + b2)\n"
tests:
  visible:
  - forward(rnd(2, 3, seed=1), rnd(3, 4, seed=2), np.zeros(4), rnd(4, 2, seed=3), np.zeros(2))
  hidden:
  - forward(rnd(5, 4, seed=4), rnd(4, 8, seed=5), rnd(8, seed=6), rnd(8, 3, seed=7), rnd(3, seed=8))
  - forward(np.zeros((1, 2)), np.ones((2, 2)), np.zeros(2), np.ones((2, 3)), np.array([0.0, 1.0, 2.0]))
  - forward(rnd(3, 2, seed=9) * 50, rnd(2, 5, seed=10), np.zeros(5), rnd(5, 4, seed=11), np.zeros(4))
random:
  count: 12
  gen: '(lambda n, i, h, o, s: f''forward(rnd({n}, {i}, seed={s}), rnd({i}, {h}, seed={s + 1}), rnd({h}, seed={s + 2}), rnd({h}, {o}, seed={s + 3}), rnd({o}, seed={s + 4}))'')(random.randint(1, 5), random.randint(1, 4), random.randint(2, 6), random.randint(2, 4), random.randint(0, 999))'
star3:
- first_try
buggy_variants:
- code: "def softmax(z):\n    e = np.exp(z - z.max(axis=1, keepdims=True))\n    return e / e.sum(axis=1, keepdims=True)\n\ndef forward(X, W1, b1, W2, b2):\n    return softmax((X @ W1 + b1) @ W2 + b2)"
- code: "def relu(z):\n    return np.maximum(0, z)\n\ndef forward(X, W1, b1, W2, b2):\n    H = relu(X @ W1 + b1)\n    return relu(H @ W2 + b2)"
hints:
- Прямой проход — раздел «Прямой проход».
- Посчитай скрытый слой и примени ReLU, затем выходной слой и softmax по строкам.
- H = np.maximum(0, X @ W1 + b1); softmax(H @ W2 + b2) с вычитанием максимума строки.
- "def relu(z):\n    return np.maximum(0, z)\n\ndef softmax(z):\n    e = np.exp(z - z.max(axis=1, keepdims=True))\n    return e / e.sum(axis=1, keepdims=True)\n\ndef forward(X, W1, b1, W2, b2):\n    H = ___(X @ W1 + b1)\n    return ___(H @ W2 + b2)"
- 'Без ReLU два слоя сливаются в один линейный. На выходе нужна именно softmax: ReLU не даёт вероятностей, суммирующихся в 1. Один из скрытых тестов умножает входы на 50 — без устойчивого softmax он даст nan.'
