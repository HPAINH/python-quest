id: D4-06-boss-net
type: model
title: 'Босс: своя сеть против sklearn'
difficulty: 3
boss: true
lesson_section: adam
statement: 'Напиши свою нейросеть на NumPy для оттока и запиши обученный объект в `model`. У него должен быть метод `predict_proba(X)`, который принимает **таблицу** как `X` и возвращает массив `(n, 2)` вероятностей классов. Внутри используй `pre` из `setup` для подготовки признаков (`fit_transform` при обучении, `transform` при прогнозе), инициализацию He, ReLU, softmax, мини-батчи, L2 и Adam. Порог — ROC-AUC не ниже 0.80 на скрытой выборке, как у MLPClassifier. `sklearn.neural_network` не используй.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.neural_network import MLPClassifier\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n], sparse_threshold=0)\n"
model:
  metric: roc_auc
  threshold: 0.8
  data: churn
  target: churned
  drop:
  - customer_id
  - cancel_request
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(X, y)'
reference: "class Net:\n    def __init__(self, pre, n_hidden=32, lr=0.01, lam=1e-4, epochs=20, batch=256, seed=0):\n        self.pre, self.h, self.lr, self.lam = pre, n_hidden, lr, lam\n        self.epochs, self.batch, self.rng = epochs, batch, np.random.default_rng(seed)\n\n    def forward(self, X):\n        self.Z1 = X @ self.W1 + self.b1\n        self.H = np.maximum(0, self.Z1)\n        Z2 = self.H @ self.W2 + self.b2\n        e = np.exp(Z2 - Z2.max(axis=1, keepdims=True))\n        return e / e.sum(axis=1, keepdims=True)\n\n    def fit(self, X, y):\n        Xn = self.pre.fit_transform(X)\n        Y = np.eye(2)[np.asarray(y)]\n        n, d = Xn.shape\n        self.W1 = self.rng.normal(0, np.sqrt(2 / d), (d, self.h))\n        self.b1 = np.zeros(self.h)\n        self.W2 = self.rng.normal(0, np.sqrt(2 / self.h), (self.h, 2))\n        self.b2 = np.zeros(2)\n        names = [\"W1\", \"b1\", \"W2\", \"b2\"]\n        m = {k: 0 for k in names}\n        v = {k: 0 for k in names}\n        t = 0\n        for _ in range(self.epochs):\n            idx = self.rng.permutation(n)\n            for i in range(0, n, self.batch):\n                b = idx[i:i + self.batch]\n                Xb = Xn[b]\n                dZ2 = (self.forward(Xb) - Y[b]) / len(b)\n                dZ1 = (dZ2 @ self.W2.T) * (self.Z1 > 0)\n                g = {\"W1\": Xb.T @ dZ1 + self.lam * self.W1, \"b1\": dZ1.sum(axis=0),\n                     \"W2\": self.H.T @ dZ2 + self.lam * self.W2, \"b2\": dZ2.sum(axis=0)}\n                t += 1\n                for k in names:\n                    m[k] = 0.9 * m[k] + 0.1 * g[k]\n                    v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2\n                    step = self.lr * (m[k] / (1 - 0.9 ** t)) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)\n                    setattr(self, k, getattr(self, k) - step)\n        return self\n\n    def predict_proba(self, X):\n        return self.forward(self.pre.transform(X))\n\nmodel = Net(pre).fit(X, y)\n"
star3:
- first_try
buggy_variants:
- code: "class Net:\n    def __init__(self, pre, n_hidden=32, lr=0.01, lam=1e-4, epochs=20, batch=256, seed=0):\n        self.pre, self.h, self.lr, self.lam = pre, n_hidden, lr, lam\n        self.epochs, self.batch, self.rng = epochs, batch, np.random.default_rng(seed)\n\n    def forward(self, X):\n        self.Z1 = X @ self.W1 + self.b1\n        self.H = np.maximum(0, self.Z1)\n        Z2 = self.H @ self.W2 + self.b2\n        e = np.exp(Z2 - Z2.max(axis=1, keepdims=True))\n        return e / e.sum(axis=1, keepdims=True)\n\n    def fit(self, X, y):\n        Xn = self.pre.fit_transform(X)\n        Y = np.eye(2)[np.asarray(y)]\n        n, d = Xn.shape\n        self.W1 = self.rng.normal(0, np.sqrt(2 / d), (d, self.h))\n        self.b1 = np.zeros(self.h)\n        self.W2 = self.rng.normal(0, np.sqrt(2 / self.h), (self.h, 2))\n        self.b2 = np.zeros(2)\n        names = [\"W1\", \"b1\", \"W2\", \"b2\"]\n        m = {k: 0 for k in names}\n        v = {k: 0 for k in names}\n        t = 0\n        for _ in range(self.epochs):\n            idx = self.rng.permutation(n)\n            for i in range(0, n, self.batch):\n                b = idx[i:i + self.batch]\n                Xb = Xn[b]\n                dZ2 = (self.forward(Xb) - Y[b]) / len(b)\n                dZ1 = (dZ2 @ self.W2.T) * (self.Z1 > 0)\n                g = {\"W1\": Xb.T @ dZ1 + self.lam * self.W1, \"b1\": dZ1.sum(axis=0),\n                     \"W2\": self.H.T @ dZ2 + self.lam * self.W2, \"b2\": dZ2.sum(axis=0)}\n                t += 1\n                for k in names:\n                    m[k] = 0.9 * m[k] + 0.1 * g[k]\n                    v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2\n                    step = self.lr * (m[k] / (1 - 0.9 ** t)) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)\n                    setattr(self, k, getattr(self, k) - step)\n        return self\n\n    def predict_proba(self, X):\n        return self.forward(self.pre.transform(X))\n\nmodel = Net(pre, lr=1e-6, epochs=1).fit(X, y)"
