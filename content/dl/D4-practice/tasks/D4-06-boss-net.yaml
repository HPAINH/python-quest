hints:
- 'Все приёмы уровня: разделы «Инициализация», «Регуляризация L2», «Adam»; сеть и обратный проход — уровни D2 и D3.'
- 'Класс с параметрами pre, n_hidden, lr, lam, epochs, batch. В fit: Xn = pre.fit_transform(X), веса He, цикл по эпохам и мини-батчам, градиенты как в D3 плюс lam·W, шаг Adam для каждого параметра. predict_proba = forward(pre.transform(X)). Хватает 32 нейронов, lr = 0.01, 20 эпох, батч 256.'
- dZ2 = (P - Y[b]) / len(b); dW1 = Xb.T @ dZ1 + lam * W1; m = 0.9 * m + 0.1 * g; v = 0.999 * v + 0.001 * g ** 2; шаг lr · m̂ / (√v̂ + eps).
- "class Net:\n    def __init__(self, pre, n_hidden=32, lr=0.01, lam=1e-4, epochs=20, batch=256, seed=0): ...\n    def forward(self, X): ...\n    def fit(self, X, y):\n        Xn = self.pre.___(X)\n        ...\n        return self\n    def predict_proba(self, X):\n        return self.forward(self.pre.___(X))\n\nmodel = Net(pre).fit(X, y)"
- 'На таблицах своя сеть и MLPClassifier дают около 0.82 — столько же, сколько логистическая регрессия: связи в оттоке почти линейные. Нейросети выигрывают на изображениях, тексте и звуке, а для таблиц стандарт — бустинг. Зато теперь ты знаешь, что происходит внутри fit.'
