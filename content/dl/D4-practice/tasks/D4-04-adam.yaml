- code: "def adam_step(w, g, m, v, t, lr=0.001, b1=0.9, b2=0.999, eps=1e-8):\n    m = b1 * m + (1 - b1) * g\n    v = b2 * v + (1 - b2) * g\n    m_hat = m / (1 - b1 ** t)\n    v_hat = v / (1 - b2 ** t)\n    return w - lr * m_hat / (np.sqrt(v_hat) + eps), m, v"
hints:
- Adam — раздел «Adam».
- 'Четыре строки: новое m, новое v (по квадрату градиента), поправленные m̂ и v̂, шаг w − lr·m̂/(√v̂ + eps). Возвращай m и v без поправки — её делают заново на каждом шаге.'
- m = b1 * m + (1 - b1) * g; v = b2 * v + (1 - b2) * g ** 2; m / (1 - b1 ** t); v / (1 - b2 ** t).
- "def adam_step(w, g, m, v, t, lr=0.001, b1=0.9, b2=0.999, eps=1e-8):\n    m = b1 * m + (1 - b1) * g\n    v = b2 * v + (1 - b2) * g ** ___\n    m_hat = m / (1 - b1 ** ___)\n    v_hat = v / (1 - b2 ** t)\n    return w - lr * m_hat / (np.sqrt(___) + eps), m, v"
- 'Без поправки на первом шаге m = 0.1·g, v = 0.001·g², и шаг получается в √0.001/0.1 ≈ 0.32 раза меньше задуманного. Поправка исчезает сама: при больших t знаменатели близки к 1.'
