- code: "def train_logreg(X, y, lr=0.5, epochs=100):\n    n, d = X.shape\n    w = np.zeros(d)\n    b = 0.0\n    for _ in range(epochs):\n        p = 1 / (1 + np.exp(-(X @ w + b)))\n        w = w - lr * X.T @ (p - y) / n\n    return np.append(w, b)"
hints:
- Цикл обучения — раздел «Цикл обучения».
- 'В каждой эпохе: вероятности через сигмоиду, градиенты по формулам из условия, шаг против градиента. Сдвиг обновляется тоже.'
- p = 1 / (1 + np.exp(-(X @ w + b))); w = w - lr * X.T @ (p - y) / n; b = b - lr * (p - y).mean().
- "def train_logreg(X, y, lr=0.5, epochs=100):\n    n, d = X.shape\n    w = np.zeros(d)\n    b = 0.0\n    for _ in range(epochs):\n        p = 1 / (1 + np.exp(-(X @ w + ___)))\n        w = w - lr * X.T @ (p - y) / ___\n        b = b - lr * (p - y).___()\n    return np.append(w, b)"
- Это та же логистическая регрессия, что в sklearn, только без регуляризации и с простым спуском. Без деления на n шаг растёт вместе с выборкой, и обучение может разойтись.
