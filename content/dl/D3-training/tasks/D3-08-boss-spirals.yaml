id: D3-08-boss-spirals
type: model
title: 'Босс: три спирали'
difficulty: 3
boss: true
lesson_section: loop
data: false
statement: 'Точки `X`, `y` из `setup` — три закрученные спирали, по 100 точек в классе. Обучи на них сеть с нуля на NumPy и запиши в `model` объект с методом `predict(X)`, возвращающим номер класса 0, 1 или 2. Порог — accuracy не ниже 0.9 на скрытой выборке спиралей с другим шумом. Проверка также обучит модель на перемешанных метках — она не должна пройти порог.

  '
setup: "import numpy as np\n\ndef rnd(*shape, seed=0):\n    return np.random.default_rng(seed).normal(size=shape).round(3)\n\ndef labels(n, k, seed=0):\n    return np.random.default_rng(seed).integers(0, k, n)\n\ndef make_spirals(n_per, k, seed):\n    rng = np.random.default_rng(seed)\n    X, y = [], []\n    for c in range(k):\n        r = np.linspace(0.05, 1, n_per)\n        t = np.linspace(c * 4, (c + 1) * 4, n_per) + rng.normal(0, 0.2, n_per)\n        X.append(np.c_[r * np.sin(t), r * np.cos(t)])\n        y.append(np.full(n_per, c))\n    return np.vstack(X), np.concatenate(y)\n\nX, y = make_spirals(100, 3, 1)\nif SHUFFLE:\n    y = np.random.default_rng(5).permutation(y)\n"
model:
  metric: accuracy
  threshold: 0.9
  proba: false
  leak_check: true
  test_setup: "import numpy as np\n\ndef make_spirals(n_per, k, seed):\n    rng = np.random.default_rng(seed)\n    X, y = [], []\n    for c in range(k):\n        r = np.linspace(0.05, 1, n_per)\n        t = np.linspace(c * 4, (c + 1) * 4, n_per) + rng.normal(0, 0.2, n_per)\n        X.append(np.c_[r * np.sin(t), r * np.cos(t)])\n        y.append(np.full(n_per, c))\n    return np.vstack(X), np.concatenate(y)\n\nX_test, y_test = make_spirals(150, 3, 777)\n"
reference: "class MLP:\n    def __init__(self, n_in, n_hidden, n_out, seed=0):\n        rng = np.random.default_rng(seed)\n        self.W1 = rng.normal(0, np.sqrt(2 / n_in), (n_in, n_hidden))\n        self.b1 = np.zeros(n_hidden)\n        self.W2 = rng.normal(0, np.sqrt(2 / n_hidden), (n_hidden, n_out))\n        self.b2 = np.zeros(n_out)\n\n    def forward(self, X):\n        self.Z1 = X @ self.W1 + self.b1\n        self.H = np.maximum(0, self.Z1)\n        Z2 = self.H @ self.W2 + self.b2\n        e = np.exp(Z2 - Z2.max(axis=1, keepdims=True))\n        return e / e.sum(axis=1, keepdims=True)\n\n    def fit(self, X, y, lr=0.5, epochs=1000):\n        n = len(X)\n        Y = np.eye(self.W2.shape[1])[y]\n        for _ in range(epochs):\n            P = self.forward(X)\n            dZ2 = (P - Y) / n\n            dW2 = self.H.T @ dZ2\n            db2 = dZ2.sum(axis=0)\n            dZ1 = (dZ2 @ self.W2.T) * (self.Z1 > 0)\n            dW1 = X.T @ dZ1\n            db1 = dZ1.sum(axis=0)\n            self.W1 -= lr * dW1\n            self.b1 -= lr * db1\n            self.W2 -= lr * dW2\n            self.b2 -= lr * db2\n        return self\n\n    def predict(self, X):\n        return self.forward(X).argmax(axis=1)\n\nmodel = MLP(2, 32, 3, seed=0).fit(X, y, lr=1.0, epochs=2000)\n"
