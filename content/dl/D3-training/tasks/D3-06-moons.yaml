hints:
- Цикл обучения — раздел «Цикл обучения»; градиенты — уровень D2.
- 'Класс с весами двух слоёв: forward — ReLU и softmax, fit — цикл полного градиентного спуска, predict — argmax вероятностей. 16 скрытых нейронов, lr = 0.5 и около 1000 эпох хватает.'
- 'dZ2 = (P - Y) / n; dZ1 = (dZ2 @ W2.T) * (Z1 > 0); W -= lr * dW; predict: forward(X).argmax(axis=1).'
- "class MLP:\n    def __init__(self, n_in, n_hidden, n_out, seed=0): ...\n    def forward(self, X): ...\n    def fit(self, X, y, lr=0.5, epochs=1000):\n        ...\n        for _ in range(epochs):\n            P = self.forward(X)\n            dZ2 = (P - Y) / n\n            ...\n        return self\n    def predict(self, X):\n        return self.forward(X).___(axis=1)\n\nmodel = MLP(2, 16, 2, seed=0).fit(X, y, lr=0.5, epochs=___)"
- fit возвращает self, поэтому создание и обучение умещаются в одну строку. Пять эпох — сеть почти не сдвинулась от случайных весов; кривая граница появляется после сотен шагов.
