  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      X = np.array([[1.0], [2.0]])
      y = np.array([0, 1])
      p = np.array([0.5, 0.5])
      print((X.T @ (p - y) / 2).tolist(), (p - y).mean())
    answer: "[-0.25] 0.0"
