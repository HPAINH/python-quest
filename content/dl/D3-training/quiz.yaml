quiz:
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      y = np.array([1, 0])
      p = np.array([0.5, 0.5])
      print(round(-np.mean(y * np.log(p) + (1 - y) * np.log(1 - p)), 4))
    answer: "0.6931"
    explain: Неуверенный прогноз 0.5 даёт потерю ln 2.
    section: losses
  - type: predict
    q: Что выведет программа?
    code: |
      w, lr = 0.0, 0.5
      for _ in range(3):
          w -= lr * 2 * (w - 4)
      print(w)
    answer: "4.0"
    explain: При lr = 0.5 для (w − 4)² минимум достигается за один шаг.
    section: sgd
  - type: choice
    q: Потеря растёт с каждой эпохой и уходит в бесконечность. Что вероятнее всего?
    options: ["Мало эпох", "Слишком большая скорость обучения", "Мало нейронов", "Слишком маленький батч"]
    answer: 1
    explain: Шаги перепрыгивают минимум всё дальше.
    section: sgd
  - type: predict
    q: Что выведет программа?
    code: |
      import numpy as np
      idx = np.arange(7)
      print([idx[i:i + 3].tolist() for i in range(0, 7, 3)])
    answer: "[[0, 1, 2], [3, 4, 5], [6]]"
    explain: Последний пакет короче.
    section: minibatch
  - type: choice
    q: Почему круг внутри квадрата не разделить логистической регрессией?
    options: ["Мало данных", "Граница классов не прямая, а линейная модель проводит только прямую", "Нужна другая потеря", "Можно разделить"]
    answer: 1
    explain: Скрытый слой с нелинейностью позволяет строить кривые границы.
    section: loop

