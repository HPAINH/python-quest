hints:
  - "Всё из уровня: left-соединение, чтобы сохранить всех клиентов, fillna для нулей и цепочка merge до отдела."
  - "Сначала посчитай статистику доставленных заказов по клиентам, потом присоедини её к клиентам через how=\"left\" и замени пропуски нулями. Для отделов: оставь позиции доставленных заказов (merge с их order_id), затем товар → категория → отдел."
