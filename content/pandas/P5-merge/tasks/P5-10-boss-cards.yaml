  - "Статистику выгоднее посчитать до соединения: тогда к клиентам присоединяется одна строка на клиента и размножения нет. merge с delivered[[\"order_id\"]] работает как фильтр «позиции только доставленных заказов» — inner-соединение отбрасывает остальные."
