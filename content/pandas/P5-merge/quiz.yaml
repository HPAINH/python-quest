quiz:
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      a = pd.DataFrame({"k": [1, 2, 3], "x": ["a", "b", "c"]})
      b = pd.DataFrame({"k": [2, 3, 4], "y": [20, 30, 40]})
      print(len(a.merge(b, on="k")), len(a.merge(b, on="k", how="left")), len(a.merge(b, on="k", how="outer")))
    answer: "2 3 4"
    explain: Пары есть у ключей 2 и 3. left сохраняет все три строки a, outer — все ключи 1–4.
    section: how
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      a = pd.DataFrame({"k": [1, 2], "name": ["x", "y"]})
      b = pd.DataFrame({"k": [1, 2], "name": ["p", "q"]})
      print(list(a.merge(b, on="k").columns))
    answer: "['k', 'name_x', 'name_y']"
    explain: Одинаковые имена колонок, кроме ключа, получают суффиксы _x и _y.
    section: merge
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      a = pd.DataFrame({"k": [1, 2], "v": [10, 20]})
      b = pd.DataFrame({"k": [1, 1, 2], "w": ["x", "y", "z"]})
      print(a.merge(b, on="k")["v"].sum())
    answer: "40"
    explain: Ключ 1 дважды встречается в b, поэтому строка с v = 10 размножилась — 10 + 10 + 20.
    section: keys
  - type: fill
    q: Впиши значение how, чтобы сохранить всех клиентов.
    code: |
      import pandas as pd
      c = pd.DataFrame({"id": [1, 2, 3]})
      o = pd.DataFrame({"id": [1, 1], "order": [7, 8]})
      print(len(c.merge(o, on="id", how="___")))
    answer: ["left"]
    expect: "4"
    explain: У клиента 1 два заказа, у 2 и 3 — ни одного, но они остаются с NaN.
    section: how
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      a = pd.DataFrame({"x": [1, 2]})
      b = pd.DataFrame({"x": [3]})
      print(pd.concat([a, b]).index.tolist(), pd.concat([a, b], ignore_index=True).index.tolist())
    answer: "[0, 1, 0] [0, 1, 2]"
    explain: Без ignore_index подписи строк сохраняются и могут повторяться.
    section: concat

express:
  - type: choice
    q: Чем опасен merge, если ключ в правой таблице повторяется?
    options: ["merge упадёт", "Строки левой таблицы размножатся, суммы вырастут", "Повторы удалятся сами", "Ничем"]
    answer: 1
    explain: Проверяй is_unique или передавай validate="many_to_one".
    section: keys
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      c = pd.DataFrame({"id": [1, 2, 3]})
      o = pd.DataFrame({"id": [1, 3, 3], "n": [1, 1, 1]})
      t = c.merge(o, on="id", how="left")
      print(t.groupby("id")["n"].count().tolist())
    answer: "[1, 0, 2]"
    explain: У клиента 2 пары нет, n = NaN, count его не считает — получается 0.
    section: how
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      a = pd.DataFrame({"pid": [5, 6]})
      b = pd.DataFrame({"id": [6, 7], "t": ["x", "y"]})
      print(a.merge(b, left_on="pid", right_on="id")["t"].tolist())
    answer: "['x']"
    explain: left_on и right_on соединяют ключи с разными именами. Пара есть только у 6.
    section: keys
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      a = pd.DataFrame({"k": [1, 2]})
      b = pd.DataFrame({"k": [2, 3]})
      t = a.merge(b, on="k", how="outer", indicator=True)
      print(t["_merge"].astype(str).tolist())
    answer: "['left_only', 'both', 'right_only']"
    explain: indicator показывает, откуда пришла строка.
    section: how
  - type: choice
    q: Какой аналог UNION ALL в pandas?
    options: ["merge(how='outer')", "pd.concat([a, b])", "a.join(b)", "a.append(b)"]
    answer: 1
    explain: concat ставит таблицы одну под другой.
    section: concat
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      p = pd.DataFrame({"id": [1, 2], "name": ["Сыр", "Чай"], "cat": [10, 20]})
      c = pd.DataFrame({"cat": [10, 20], "name": ["Молочное", "Напитки"]})
      c = c.rename(columns={"name": "category"})
      print(p.merge(c, on="cat")[["name", "category"]].values.tolist())
    answer: "[['Сыр', 'Молочное'], ['Чай', 'Напитки']]"
    explain: Переименование до merge убирает конфликт имён.
    section: merge
