quiz:
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      s = pd.Series([10, 20, 40], index=pd.to_datetime(["2026-01-01", "2026-01-03", "2026-01-04"]))
      print(s.resample("D").sum().tolist())
    answer: "[10, 0, 20, 40]"
    explain: resample создаёт все дни подряд, пустой день 2 января получает сумму 0.
    section: resample
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      s = pd.Series([2, 4, 6, 8])
      print(s.rolling(2).mean().tolist())
    answer: "[nan, 3.0, 5.0, 7.0]"
    explain: Первому окну из двух строк не хватает предыдущего значения.
    section: rolling
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      s = pd.Series([100, 120, 90])
      print(s.shift(1).tolist(), s.pct_change().round(2).tolist())
    answer: "[nan, 100.0, 120.0] [nan, 0.2, -0.25]"
    explain: shift сдвигает вниз, pct_change — (текущее − прошлое) / прошлое.
    section: shift
  - type: fill
    q: Впиши метод, чтобы пронумеровать заказы каждого клиента с единицы.
    code: |
      import pandas as pd
      df = pd.DataFrame({"c": ["a", "a", "b", "a"]})
      print((df.groupby("c").___() + 1).tolist())
    answer: ["cumcount"]
    expect: "[1, 2, 1, 3]"
    explain: cumcount нумерует строки внутри группы с нуля.
    section: rank
  - type: choice
    q: Чем resample("D") отличается от groupby по дате?
    options: ["Ничем", "resample добавляет дни без данных, groupby — только встретившиеся даты", "resample быстрее, но результат тот же", "groupby не умеет работать с датами"]
    answer: 1
    explain: Поэтому скользящее среднее считают после resample, а не после groupby.
    section: resample

express:
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      df = pd.DataFrame({"c": ["a", "a", "b", "b"], "v": [5, 7, 1, 4]})
      print(df.groupby("c")["v"].shift(1).tolist())
    answer: "[nan, 5.0, nan, 1.0]"
    explain: Сдвиг внутри группы — первая строка каждой группы получает NaN.
    section: shift
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      s = pd.Series([3, 5, 5, 1])
      print(s.rank(ascending=False, method="min").tolist(), s.rank(ascending=False, method="dense").tolist())
    answer: "[3.0, 1.0, 1.0, 4.0] [2.0, 1.0, 1.0, 3.0]"
    explain: min повторяет ранг и пропускает следующий, как RANK(); dense — без пропуска, как DENSE_RANK().
    section: rank
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      s = pd.Series([1, 2, 3, 4], index=pd.to_datetime(["2026-01-30", "2026-01-31", "2026-02-01", "2026-02-02"]))
      print(s.resample("MS").sum().tolist(), s.resample("MS").sum().index[1].day)
    answer: "[3, 7] 1"
    explain: MS подписывает месяц его первым днём.
    section: resample
  - type: choice
    q: Почему rolling(7) по результату groupby("order_date") может дать неверное среднее?
    options: ["rolling не работает с groupby", "Пропущенные дни не попадают в ряд, и окно из 7 строк охватывает больше 7 дней", "groupby сортирует по убыванию", "Ошибки не будет"]
    answer: 1
    explain: Сначала resample("D"), чтобы в ряду были все дни.
    section: mistakes
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      df = pd.DataFrame({"c": ["a", "b", "a", "a"], "v": [10, 1, 20, 5]})
      print(df.groupby("c")["v"].cumsum().tolist())
    answer: "[10, 1, 30, 35]"
    explain: Накопительный итог внутри группы, порядок строк — исходный.
    section: rank
  - type: predict
    q: Что выведет программа?
    code: |
      import pandas as pd
      s = pd.Series([4, 6, 8])
      print(s.rolling(2, min_periods=1).sum().tolist(), s.diff().tolist())
    answer: "[4.0, 10.0, 14.0] [nan, 2.0, 2.0]"
    explain: С min_periods=1 первое окно считается по одной строке.
    section: rolling
