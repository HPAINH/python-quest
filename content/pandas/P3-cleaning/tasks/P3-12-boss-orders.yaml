id: P3-12-boss-orders
type: dataframe
title: "Босс: чистая выгрузка кассы"
difficulty: 3
boss: true
lesson_section: why
statement: |
  Финансовый отдел просит превратить `orders_raw` в таблицу, по которой можно считать выручку. Создай две переменные.

  1. `clean` — очищенная таблица с колонками `order_id`, `customer_id`, `order_date`, `amount`, `status`, отсортированная по `order_id`:
     - полные повторы строк удалены;
     - `order_date` — дата (`datetime`), форматы смешаны, день идёт первым;
     - `amount` — число; строки с суммой ≤ 0 или ровно 999999 — сбои кассы, их удали;
     - `status` — без пробелов по краям, в нижнем регистре.
  2. `report` — словарь с ключами `raw` (строк в выгрузке), `duplicates` (удалено повторов), `bad_amount` (удалено строк со сбоем суммы) и `clean` (строк осталось). Все значения — `int`.
setup: |
  import pandas as pd
  raw = pd.read_csv("orders_raw.csv")
outputs:
  - var: clean
    title: очищенная таблица
    ordered: true
  - var: report
    title: отчёт об очистке
reference: |
  df = raw.drop_duplicates().copy()
  df["order_date"] = pd.to_datetime(df["order_date"], format="mixed", dayfirst=True)
  text = df["amount"].str.replace("₽", "").str.replace(" ", "").str.replace(",", ".")
  df["amount"] = pd.to_numeric(text)
  df["status"] = df["status"].str.strip().str.lower()
  bad = (df["amount"] <= 0) | (df["amount"] == 999999)
  clean = df[~bad].sort_values("order_id")
  report = {
      "raw": len(raw),
      "duplicates": len(raw) - len(df),
      "bad_amount": int(bad.sum()),
      "clean": len(clean),
  }
star3: [first_try]
