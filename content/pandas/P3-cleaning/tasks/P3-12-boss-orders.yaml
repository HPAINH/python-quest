  - code: "df = raw.copy()\ndf['order_date'] = pd.to_datetime(df['order_date'], format='mixed', dayfirst=True)\ntext = df['amount'].str.replace('₽', '').str.replace(' ', '').str.replace(',', '.')\ndf['amount'] = pd.to_numeric(text)\ndf['status'] = df['status'].str.strip().str.lower()\nbad = (df['amount'] <= 0) | (df['amount'] == 999999)\nclean = df[~bad].sort_values('order_id')\nreport = {'raw': len(raw), 'duplicates': 0, 'bad_amount': int(bad.sum()), 'clean': len(clean)}"
hints:
  - "Всё из уровня: drop_duplicates, to_datetime с format=\"mixed\", очистка текста перед to_numeric, strip и lower, маска сбоев."
  - "Удобный порядок: убрать повторы, привести типы и статусы, построить маску сбоев суммы, оставить строки без сбоя и отсортировать. Числа для отчёта — разности длин таблиц и сумма маски."
  - "raw.drop_duplicates(), pd.to_datetime(..., format=\"mixed\", dayfirst=True), pd.to_numeric(text), (df[\"amount\"] <= 0) | (df[\"amount\"] == 999999), df[~bad]."
  - "df = raw.drop_duplicates().copy()\ndf[\"order_date\"] = pd.to_datetime(df[\"order_date\"], format=___, dayfirst=True)\ntext = df[\"amount\"].str.replace(\"₽\", \"\").str.replace(\" \", \"\").str.replace(___, \".\")\ndf[\"amount\"] = pd.to_numeric(text)\ndf[\"status\"] = df[\"status\"].str.strip().str.___()\nbad = (df[\"amount\"] <= 0) | (df[\"amount\"] == ___)\nclean = df[~bad].sort_values(\"order_id\")\nreport = {\"raw\": len(raw), \"duplicates\": len(raw) - len(df), \"bad_amount\": int(bad.sum()), \"clean\": len(clean)}"
  - "Повторы удаляют до остальных шагов, иначе каждое преобразование делается дважды, а отчёт считает сбои с задвоением. ~ инвертирует маску: df[~bad] — строки без сбоя. Выброс 999999 — типичная «заглушка» кассы, его не видно без проверки максимума."
