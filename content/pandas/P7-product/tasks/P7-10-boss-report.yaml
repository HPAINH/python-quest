  - "Сентябрьскую когорту исключаем: её следующий месяц ещё не наступил, и m1 = 0 был бы ложным. Делить выручку источника на его покупателей — это ARPPU, а не ARPU. Один пользователь может пользоваться обеими платформами, поэтому сумма строк воронки больше общего числа пользователей."
