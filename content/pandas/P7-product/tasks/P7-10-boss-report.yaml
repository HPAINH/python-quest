  - "Для воронки добавь к событиям платформу из сессий и сделай pivot_table по платформе и событию с aggfunc=\"nunique\". Для m1 оставь сессии со смещением 1 и раздели число уникальных пользователей на размер когорты. Для ARPU дели выручку источника на всех его пользователей."
