hints:
  - "Всё из уровня: вычисляемая колонка, agg с именованными функциями, сортировка с head, доля через деление на общую сумму. Для категории — map по Series «product_id → category_id»."
  - "Сначала добавь колонку revenue в items. Потом agg по product_id: sum для quantity и revenue, nunique для order_id. Для долей: Series products.set_index(\"product_id\")[\"category_id\"], map по product_id, groupby по категории, деление на итог."
  - "items[\"quantity\"] * items[\"unit_price\"] * (1 - items[\"discount\"]), agg(units=..., revenue=..., orders=(\"order_id\", \"nunique\")), items[\"product_id\"].map(cat_of), by_cat / by_cat.sum()."
  - "items[\"revenue\"] = items[\"quantity\"] * items[\"unit_price\"] * (1 - ___)\nt = items.groupby(\"product_id\").agg(units=(\"quantity\", \"sum\"), revenue=(\"revenue\", \"sum\"), orders=(\"order_id\", ___)).reset_index()\nt[\"revenue\"] = t[\"revenue\"].round(2)\ntop = t.sort_values([\"revenue\", \"product_id\"], ascending=[False, True]).head(___)\ncat_of = products.set_index(\"product_id\")[___]\nitems[\"category_id\"] = items[\"product_id\"].map(cat_of)\nby_cat = items.groupby(\"category_id\")[\"revenue\"].sum()\ncat_share = (by_cat / by_cat.sum()).round(4).reset_index(name=\"share\").sort_values([\"share\", \"category_id\"], ascending=[False, True])"
  - "map с Series работает как словарь: для каждого product_id находит category_id по подписи — это «бедный JOIN», в уровне P5 то же сделает merge. Без скидки выручка завышена. Топ по штукам (units) и топ по выручке — разные списки: дешёвые товары продаются чаще."
