id: P4-12-boss-products
type: dataframe
title: "Босс: хиты продаж"
difficulty: 3
boss: true
lesson_section: agg
statement: |
  Категорийный менеджер просит отчёт по позициям заказов `order_items`. Выручка позиции — `quantity * unit_price * (1 - discount)`.

  Создай две переменные:
  1. `top` — 10 товаров с наибольшей выручкой: колонки `product_id`, `units` (сумма `quantity`), `revenue` (выручка, округлённая до 2 знаков), `orders` (число разных заказов). По убыванию `revenue`, при равенстве — по возрастанию `product_id`.
  2. `cat_share` — доля каждой категории в общей выручке: колонки `category_id` и `share` (округление до 4 знаков), по убыванию `share`. Категорию товара возьми из `products` через `map` — без merge.
setup: |
  import pandas as pd
  items = pd.read_csv("order_items.csv")
  products = pd.read_csv("products.csv")
outputs:
  - var: top
    title: топ-10 товаров
    ordered: true
  - var: cat_share
    title: доли категорий
    ordered: true
reference: |
  items["revenue"] = items["quantity"] * items["unit_price"] * (1 - items["discount"])
  t = items.groupby("product_id").agg(
      units=("quantity", "sum"),
      revenue=("revenue", "sum"),
      orders=("order_id", "nunique"),
  ).reset_index()
  t["revenue"] = t["revenue"].round(2)
  top = t.sort_values(["revenue", "product_id"], ascending=[False, True]).head(10)
  cat_of = products.set_index("product_id")["category_id"]
  items["category_id"] = items["product_id"].map(cat_of)
  by_cat = items.groupby("category_id")["revenue"].sum()
  cat_share = (by_cat / by_cat.sum()).round(4).reset_index(name="share").sort_values(["share", "category_id"], ascending=[False, True])
star3: [first_try]
