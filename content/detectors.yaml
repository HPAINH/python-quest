detectors:
  indentation:
    title: Сбиты отступы
    text: "Python определяет блоки по отступам. Всё, что относится к if, for, while или def, сдвигается на 4 пробела, а строки одного блока должны начинаться ровно на одном уровне. Не смешивай пробелы и табуляцию."
    lesson: C1#if-else
  assign_in_condition:
    title: "= вместо == в условии"
    text: "Один знак = присваивает значение, а сравнение пишется двумя: if x == 3. В условии всегда ==."
    lesson: C1#mistakes
  missing_colon:
    title: Забыто двоеточие
    text: "Строка с if, elif, else, for, while или def заканчивается двоеточием, после неё идёт блок с отступом."
    lesson: C1#if-else
  unclosed_string:
    title: Не закрыта кавычка
    text: "Строка открыта кавычкой, но не закрыта такой же кавычкой на той же строке."
    lesson: C0#print
  brackets:
    title: Не закрыта скобка
    text: "Число открывающих и закрывающих скобок не совпадает. Часто это print(int(input()) без последней скобки. Посмотри на строку из ошибки и строку перед ней."
    lesson: C0#mistakes
  syntax_generic:
    title: Синтаксическая ошибка
    text: "Python не смог разобрать код. Проверь строку из ошибки: скобки, кавычки, двоеточия, операторы между значениями."
    lesson: C0#mistakes
  str_int_concat:
    title: Строка складывается с числом
    text: "Нельзя сложить строку и число: '5' + 3 — ошибка. Переведи строку в число через int() или число в строку через str(), либо используй f-строку."
    lesson: C0#types
  unpack_int_input:
    title: "int(input()) для нескольких чисел"
    text: "int(input()) превращает всю строку в одно число, а строку '7 3' с пробелом вообще не превратит. Для нескольких чисел в строке: a, b = map(int, input().split())."
    lesson: C0#input
  input_no_int:
    title: Ввод остался строкой
    text: "input() всегда возвращает строку. '2' + '3' даст '23', а не 5. Оберни ввод в int() или float(): n = int(input())."
    lesson: C0#input
  not_callable:
    title: Значение вызывается как функция
    text: "Скобки после имени вызывают функцию. Похоже, ты вызываешь число или строку — например, перезаписал имя функции своей переменной, или забыл знак умножения: 2(a + b) вместо 2 * (a + b)."
    lesson: C0#mistakes
  none_value:
    title: Работа с None
    text: "Где-то получилось значение None. Чаще всего это результат метода, который меняет объект на месте и ничего не возвращает (sort, append), или функции без return."
    lesson: C4#mistakes
  missing_argument:
    title: Не хватает аргумента
    text: "Функция ждёт больше аргументов, чем ей передали. Сверь вызов с определением def."
    lesson: C4#def-basics
  immutable_assign:
    title: Объект нельзя изменить
    text: "Строки и кортежи неизменяемы: s[0] = 'A' не работает. Собери новую строку: s = 'A' + s[1:]."
    lesson: C3#indexes
  err_TypeError:
    title: Ошибка типа
    text: "Операция применена к значению неподходящего типа. Посмотри, какие типы указаны в сообщении, и приведи значение к нужному через int(), float() или str()."
    lesson: C0#types
  int_parse:
    title: int() не может разобрать строку
    text: "int() понимает только целое число без лишнего: int('12') работает, а int('12.5'), int('7 3') и int('') — нет. Для дробных используй float(), для нескольких чисел — split()."
    lesson: C0#input
  unpack_count:
    title: Не совпадает число значений
    text: "Слева от = столько переменных, сколько значений справа. a, b = '1 2 3'.split() — ошибка: значений три."
    lesson: C0#input
  err_ValueError:
    title: Неподходящее значение
    text: "Функции передано значение правильного типа, но неподходящего вида. Проверь входные данные и преобразования."
    lesson: C0#input
  name_error:
    title: "Имя {name} не найдено"
    text: "Переменная или функция {name} используется до того, как ей присвоили значение, или в имени опечатка. Регистр важен: Name и name — разные имена. Строки берутся в кавычки."
    lesson: C0#variables
  unbound_local:
    title: Переменная не задана на этом пути
    text: "Переменной присваивается значение только в одной ветке if, а используется после него. Задай ей значение до условия."
    lesson: C1#mistakes
  eof:
    title: Программа ждёт больше ввода
    text: "Программа вызывает input() больше раз, чем строк во входных данных. Если числа даны в одной строке через пробел, читай их одним input() и split()."
    lesson: C0#input
  zero_division:
    title: Деление на ноль
    text: "На ноль делить нельзя. Проверь делитель перед делением или подумай, может ли он стать нулём на граничных тестах."
    lesson: C0#arithmetic
  index_error:
    title: Индекс за пределами
    text: "Индекс больше или равен длине. В строке или списке длины n последний индекс n - 1. Проверь границы range и пустые входы."
    lesson: C3#indexes
  key_error:
    title: "Нет ключа {key}"
    text: "В словаре нет такого ключа. Используй d.get(key, 0) или проверь key in d перед обращением."
    lesson: C5#dict-methods
  attribute_error:
    title: У объекта нет такого метода
    text: "Метод вызван у значения, у которого его нет: например, append у строки или upper у числа. Проверь тип значения и написание метода."
    lesson: C3#methods
  recursion:
    title: Бесконечная рекурсия
    text: "Функция вызывает сама себя без остановки. Нужен базовый случай, при котором рекурсия заканчивается."
    lesson: C2#while
  no_files:
    title: Доступ к файлу запрещён
    text: "Открывай файлы по имени из рабочей папки задачи, например open('sales.txt'), без абсолютных путей и «..». Записывать файлы можно только в задачах, где это сказано."
    lesson: C7#files
  err_generic:
    title: "Ошибка {type}"
    text: "Программа упала во время выполнения. Строка с ошибкой подсвечена в редакторе."
    lesson: C0#mistakes
  infinite_loop:
    title: Программа не остановилась
    text: "Код выполнил слишком много шагов. Либо это бесконечный цикл — условие while никогда не становится ложным, — либо слишком медленный перебор для больших входных данных. Проверь, что переменная цикла меняется, и подумай, можно ли перебирать меньше."
    lesson: C2#while
  timeout:
    title: Превышен лимит времени
    text: "Проверка не уложилась в 5 секунд и была остановлена. Чаще всего это бесконечный цикл."
    lesson: C2#while
  output_flood:
    title: Слишком много вывода
    text: "Программа вывела больше 10 000 строк. Скорее всего, print стоит внутри бесконечного или лишнего цикла."
    lesson: C2#mistakes
  function_missing:
    title: "Функция {name} не найдена"
    text: "Проверка вызывает функцию {name}, а в коде её нет. Проверь имя в def — оно должно совпадать с условием до буквы."
    lesson: C4#def-basics
  mutable_default:
    title: Изменяемое значение по умолчанию
    text: "def {name}(x=[]) создаёт один список на все вызовы, и он копит данные между вызовами. Пиши x=None и внутри: if x is None: x = []."
    lesson: C4#mistakes
  shadow_builtin:
    title: "Перезаписано встроенное имя {name}"
    text: "Переменная {name} закрывает встроенную функцию с тем же именем. После этого {name}(...) перестанет работать. Назови переменную иначе: nums, total, text."
    lesson: C4#mistakes
  float_eq:
    title: Дробные числа через ==
    text: "0.1 + 0.2 == 0.3 даёт False из-за двоичного представления дробей. Сравнивай с допуском: abs(a - b) < 1e-9, или работай с целыми."
    lesson: C0#arithmetic
  is_literal:
    title: is вместо ==
    text: "is проверяет, что это один и тот же объект, а не равенство значений. Для чисел и строк используй ==."
    lesson: C1#mistakes
  modify_while_iterating:
    title: "Список {name} меняется во время обхода"
    text: "Удаление или добавление элементов в список внутри for по этому же списку пропускает элементы. Собери новый список: [x for x in {name} if ...]."
    lesson: C4#mistakes
  method_returns_none:
    title: "Метод {method} возвращает None"
    text: "Метод {method} меняет список на месте и возвращает None, поэтому xs = xs.{method}(...) теряет список. Пиши xs.{method}(...) отдельной строкой или используй sorted(xs)."
    lesson: C4#mistakes
  print_instead_of_return:
    title: print вместо return
    text: "Функция {name} печатает ответ, но возвращает None. Проверка берёт значение из return. Замени print(...) на return ..."
    lesson: C4#mistakes
  missing_return:
    title: Нет return
    text: "Функция {name} ничего не возвращает, поэтому её результат — None. Добавь return с ответом."
    lesson: C4#mistakes
  format_whitespace:
    title: Ответ верный, формат — нет
    text: "Значения совпадают, но разделители другие: пробелы вместо переносов строк или наоборот. Сверь вывод с примером: каждое ли значение на своей строке."
    lesson: C0#print
  format_case:
    title: Не тот регистр букв
    text: "Ответ отличается только большими и маленькими буквами. Выведи слово точно как в условии: YES, а не Yes."
    lesson: C0#print
  input_prompt:
    title: Лишний текст в input()
    text: "Текст внутри input('Введите число') попадает в вывод и ломает проверку. Пиши просто input()."
    lesson: C0#input
  slash_instead_floordiv:
    title: / вместо //
    text: "Оператор / всегда даёт дробь: 7 / 1 = 7.0. Для целой части деления используй //."
    lesson: C0#arithmetic
  format_commas:
    title: Лишние запятые в выводе
    text: "В выводе есть запятые, которых нет в ожидаемом ответе. print(a, b) разделяет значения пробелом, а print([a, b]) печатает список со скобками и запятыми."
    lesson: C0#print
  reversed_order:
    title: Порядок наоборот
    text: "Значения верные, но выведены в обратном порядке. Проверь порядок обхода или сортировки."
    lesson: C4#sorting
  type_mismatch:
    title: "Тип результата: {got} вместо {expected}"
    text: "Функция вернула {got}, а нужен {expected}. Например, строку '5' вместо числа 5 или список вместо кортежа."
    lesson: C0#types
  range_bounds:
    title: Проверь границы range
    text: "range(a, b) не включает b: range(1, 5) — это 1, 2, 3, 4. Если нужно включить n, пиши range(1, n + 1)."
    lesson: C2#for-range
  forbidden_import:
    title: "Импорт {name} запрещён"
    text: "Этот модуль в тренажёре недоступен: он ломает игру или позволяет обойти проверку. Задача решается без него."
    lesson: C0#why
  forbidden_call:
    title: "{name} запрещён"
    text: "{name} выполняет произвольный код и обходит проверку. Реши задачу обычными средствами."
    lesson: C0#why
  forbidden_dunder:
    title: "Служебный атрибут {name}"
    text: "Служебные атрибуты вида __имя__ в задачах не нужны."
    lesson: C0#why
  predict_empty:
    title: Пустой ответ
    text: "Впиши, что напечатает программа, строка за строкой."
    lesson: C0#print
  predict_lines:
    title: "Программа выводит строк: {n}"
    text: "Каждый print выводит отдельную строку. Посчитай, сколько раз сработает print, и проверь число строк в ответе."
    lesson: C0#print
  fill_structure:
    title: Изменён код вне пропусков
    text: "В этой задаче можно менять только места ___. Нажми «Сбросить код», чтобы вернуть шаблон."
    lesson: C0#why
  fill_gap:
    title: Пропуск не заполнен
    text: "Каждый ___ заменяется выражением на той же строке. Пропуск не может быть пустым."
    lesson: C0#why

  self_missing:
    title: Забыт self
    text: "Метод класса получает объект первым аргументом — self. Пиши def area(self): и обращайся к полям через self.width. Без self метод не видит данных объекта."
    lesson: C8#methods
  init_typo:
    title: Конструктор назван неверно
    text: "Конструктор пишется ровно так: __init__ — по два подчёркивания с каждой стороны. Иначе Python не вызовет его при создании объекта."
    lesson: C8#classes
  length_mismatch:
    title: Не совпадает длина
    text: "Новая колонка или список значений должны быть той же длины, что и таблица. Проверь, что ты присваиваешь Series или массив по всем строкам, а не результат агрегации."
    lesson: P2#columns
  missing_import:
    title: "Нет импорта для {name}"
    text: "Имя {name} не определено: его нужно импортировать в начале кода — {stmt}."
    lesson: C7#collections
  module_missing:
    title: Модуль недоступен
    text: "Такого модуля нет в тренажёре или он ещё не загружен на этом уровне. Задача решается модулями из урока."
    lesson: C7#collections
  file_not_found:
    title: Файл не найден
    text: "Файла с таким именем нет в рабочей папке задачи. Проверь имя и расширение — список файлов есть в условии."
    lesson: C7#files
  array_index_dims:
    title: Лишний индекс
    text: "У массива меньше осей, чем индексов в квадратных скобках. Для одномерного массива пиши a[i], для двумерного — a[i, j]. Проверь a.shape."
    lesson: N2#slicing2d
  iloc_bounds:
    title: Номер строки за пределами таблицы
    text: "iloc считает позиции с нуля, последняя строка — len(df) - 1. Проверь, не пустая ли таблица после фильтра."
    lesson: P2#loc-iloc
  column_key:
    title: "Нет колонки {key}"
    text: "В таблице нет такой колонки. Сверь название с df.columns — регистр, пробелы и подчёркивания важны. После groupby ключ группировки уходит в индекс: верни его в колонки через reset_index()."
    lesson: P2#columns
  df_attribute:
    title: "У {obj} нет атрибута {name}"
    text: "У объекта {obj} нет метода или колонки {name}. Проверь написание. Если это колонка с пробелом или совпадает с методом (например count), обращайся через квадратные скобки: df['{name}']."
    lesson: P1#dataframe
  df_call:
    title: Круглые скобки вместо квадратных
    text: "Таблицу и колонку не вызывают как функцию. Колонка выбирается так: df['amount'], а не df('amount')."
    lesson: P1#dataframe
  series_and_or:
    title: and / or с таблицей
    text: "and, or и not не работают с Series и массивами — Python не знает, истинна ли вся колонка. Для условий по строкам используй & (и), | (или), ~ (не), а каждое сравнение бери в скобки: df[(df.a > 1) & (df.b == 'x')]."
    lesson: P2#filter
  mask_parentheses:
    title: Не хватает скобок в условии
    text: "Операторы & и | выполняются раньше сравнений. df.a > 1 & df.b < 5 читается как df.a > (1 & df.b) < 5. Бери каждое сравнение в скобки: (df.a > 1) & (df.b < 5)."
    lesson: P2#filter
  broadcast_error:
    title: Формы массивов несовместимы
    text: "Массивы разной формы складываются, только если их оси совпадают или равны 1, начиная с конца. Посмотри .shape обоих массивов. Для столбца нужна форма (n, 1): a[:, None] или a.reshape(-1, 1)."
    lesson: N3#broadcasting
  matmul_shape:
    title: Размеры матриц не согласованы
    text: "При умножении матриц A @ B число столбцов A должно равняться числу строк B: (m, k) @ (k, n) → (m, n). Проверь .shape и, возможно, транспонируй через .T."
    lesson: N4#linalg
  reshape_size:
    title: reshape не сходится по числу элементов
    text: "Новая форма должна содержать столько же элементов, сколько исходный массив: 12 элементов — это (3, 4), (2, 6) или (4, -1), но не (5, 3)."
    lesson: N1#reshape
  convert_float:
    title: Строку нельзя перевести в число
    text: "В колонке есть текст, который не похож на число: пробелы между разрядами, запятая вместо точки, знак валюты. Сначала очисти строку через .str.replace(...), потом переводи в число."
    lesson: P3#types
  text_reduction:
    title: Числовая функция по текстовой колонке
    text: "sum, mean и другие числовые функции не работают с текстом. Если вызвать их у всей сгруппированной таблицы, pandas пытается посчитать и текстовые колонки. Выбери нужную колонку сразу после groupby: df.groupby(\"k\")[\"v\"].mean()."
    lesson: P4#mistakes
  date_parse:
    title: Дата не разбирается
    text: "Формат даты не совпадает с ожидаемым. Если форматы смешаны, используй pd.to_datetime(s, format='mixed', dayfirst=True)."
    lesson: P3#dates
  too_slow:
    title: Слишком медленно
    text: "Код работал {ms} мс при лимите {limit} мс. Замени поэлементную обработку на операции над целым массивом."
    lesson: N3#vectorization
  chained_assignment:
    title: Цепочное присваивание
    text: "Запись вида df[df.a > 0]['b'] = 1 меняет временную копию, а исходная таблица не меняется. Присваивай одним шагом через loc: df.loc[df.a > 0, 'b'] = 1."
    lesson: P2#loc-iloc
  inplace_none:
    title: inplace=True возвращает None
    text: "С inplace=True метод меняет таблицу на месте и возвращает None, поэтому df = df.sort_values(..., inplace=True) записывает в df None. Пиши без inplace: df = df.sort_values(...)."
    lesson: P2#sort
  result_type:
    title: "Тип результата: {got} вместо {expected}"
    text: "В переменной result должен лежать объект типа {expected}. Например, список вместо массива numpy или число вместо таблицы."
    lesson: task
  result_missing:
    title: "Нет переменной {var}"
    text: "Проверка берёт ответ из переменной {var}, а она не создана. Запиши ответ так: {var} = ..."
    lesson: task
  result_none:
    title: В результате None
    text: "В переменной лежит None. Скорее всего, туда попал результат метода, который меняет объект на месте или функции без return."
    lesson: task
  columns_mismatch:
    title: Не те колонки
    text: "Не хватает колонок: {missing}. Лишние колонки: {extra}. Сверь названия с условием; после groupby верни ключ в колонки через reset_index()."
    lesson: task
  columns_count:
    title: "Колонок {got}, а нужно {expected}"
    text: "Число колонок в результате не совпадает с ожидаемым. Проверь, что выбрал нужные колонки и не забыл ключ группировки."
    lesson: task
  shape_rows:
    title: "Строк {got}, а нужно {expected}"
    text: "В результате другое число строк. Проверь условие фильтра, границы (> или >=), пропуски и дубликаты."
    lesson: task
  row_order:
    title: Строки в другом порядке
    text: "Все строки верные, но порядок другой. Проверь сортировку: колонку, направление (ascending=False) и порядок при равенстве."
    lesson: P2#sort
  column_dtype:
    title: "Колонка {col}: тип {got} вместо {expected}"
    text: "Значения в колонке другого типа, например строки вместо чисел. Переведи колонку через astype, pd.to_numeric или pd.to_datetime."
    lesson: task
  column_values:
    title: "Отличаются значения: {cols}"
    text: "Число строк совпало, но в этих колонках другие значения. Проверь формулу, округление, фильтр и агрегатную функцию (sum или mean, count или nunique)."
    lesson: task
  row_mismatch:
    title: Строки собраны иначе
    text: "Каждая колонка по отдельности совпадает, но значения стоят в других строках. Проверь, что колонки не перепутаны местами и строки не перемешаны относительно друг друга."
    lesson: task
  axis_confusion:
    title: Перепутана ось
    text: "Форма результата {got}, а ожидалась {expected} — оси переставлены. axis=0 считает по столбцам (вниз по строкам), axis=1 — по строкам (вдоль столбцов)."
    lesson: N3#axis
  array_shape:
    title: "Форма {got} вместо {expected}"
    text: "У массива другая форма. Проверь ось агрегации, срез и reshape."
    lesson: task
  array_dtype:
    title: "Тип элементов {got} вместо {expected}"
    text: "Значения могут совпадать, но тип элементов другой: например, целые вместо дробных или bool вместо чисел. Задай тип через dtype= или astype."
    lesson: N1#dtype
  array_values:
    title: Значения массива отличаются
    text: "Форма и тип совпали, а значения — нет. Проверь формулу, срез и порядок операций."
    lesson: task
  merge_inner:
    title: merge потерял строки
    text: "По умолчанию merge делает inner join и выбрасывает строки без пары. Если нужно сохранить все строки левой таблицы, укажи how='left'."
    lesson: P5#how
  merge_dupes:
    title: После merge строк стало больше
    text: "Если ключ повторяется в правой таблице, каждая строка левой размножается. Проверь уникальность ключа (df.key.duplicated().sum()) или сначала агрегируй правую таблицу."
    lesson: P5#keys

  resample_index:
    title: Нужен индекс из дат
    text: "resample и rolling с окном вида \"7D\" работают только когда индекс — даты. Сначала переведи колонку в datetime и сделай её индексом: df.set_index(\"order_date\"), либо передай on=\"order_date\"."
    lesson: P6#resample
  model_metric:
    title: "{metric} на скрытой выборке — {got}, нужно {cmp} {threshold}"
    text: "Модель обучилась, но на новых клиентах работает хуже порога. Попробуй больше признаков, кодирование категорий, масштабирование для линейных моделей или более сильную модель — случайный лес, градиентный бустинг."
    lesson: task
  model_overfit:
    title: "Переобучение: {metric} на своих данных {train}, на скрытых — {test}"
    text: "На обучающих данных модель почти идеальна, а на новых — заметно хуже. Это переобучение или утечка: признак, который известен только после события. Упрости модель (min_samples_leaf, max_depth, регуляризация) и проверь признаки."
    lesson: task
  model_object:
    title: "{var} — это {got}, а не модель"
    text: "В переменной должна лежать обученная модель или Pipeline с методами predict и predict_proba. Частая ошибка — записать в неё результат fit на массиве или прогноз."
    lesson: task
  leak_fit_before_split:
    title: Утечка — fit до разбиения на train и test
    text: "Масштабирование, кодирование или отбор признаков обучены на всех данных, включая тестовые. Модель «подсмотрела» в тест, и оценка завышена. Сначала train_test_split, потом fit только на train — удобнее всего через Pipeline."
    lesson: M1#leaks
  leak_target:
    title: Модель работает и без настоящей цели
    text: "Проверка перемешала целевую переменную в обучающих данных, а модель всё равно прошла порог. Значит, ответ попадает в признаки откуда-то ещё — это утечка цели."
    lesson: M4#leaks
  unknown_category:
    title: Новая категория в данных
    text: "В скрытых данных встретился город или категория, которых не было при обучении. Передай OneHotEncoder(handle_unknown=\"ignore\") — тогда неизвестные значения закодируются нулями."
    lesson: M1#encoding
  encode_categorical:
    title: Текстовые признаки нужно закодировать
    text: "Модели sklearn работают только с числами. Категории вроде города и уровня лояльности кодируют через OneHotEncoder, обычно внутри ColumnTransformer."
    lesson: M1#encoding
  model_nan:
    title: Пропуски в признаках
    text: "Большинство моделей не принимают NaN. Добавь SimpleImputer в Pipeline для числовых колонок — тогда пропуски заполнятся и на новых данных."
    lesson: M1#pipeline
  feature_mismatch:
    title: Признаки не совпадают с обучением
    text: "Модель обучена на одном наборе колонок, а прогноз просят по другому. Обучай на таблице X целиком и выбирай колонки внутри Pipeline через ColumnTransformer — тогда модель сама возьмёт нужные."
    lesson: M1#pipeline
  not_fitted:
    title: Модель не обучена
    text: "Перед predict нужно вызвать fit. Если модель обучалась под другим именем, в переменной осталась необученная копия."
    lesson: task
  reshape_2d:
    title: Нужна таблица признаков, а не один столбец
    text: "sklearn ждёт двумерные X: строки — объекты, колонки — признаки. Один признак берут двойными скобками df[[\"col\"]] или reshape(-1, 1)."
    lesson: task
  label_type:
    title: Классификатор на непрерывной цели
    text: "Классификатор получил дробные значения цели. Для числовой цели нужна регрессия (LinearRegression, HistGradientBoostingRegressor), для классов — метки 0 и 1."
    lesson: task
  plot_empty:
    title: График не найден
    text: "После кода нет ни одной фигуры с данными. Построй график через plt, pandas .plot или seaborn — вызов plt.show() не обязателен."
    lesson: task
  plot_axes:
    title: "Графиков на фигуре {got}, а нужно {expected}"
    text: "Проверь, сколько областей построения (axes) создаёт код. Для нескольких графиков используй fig, axes = plt.subplots(строк, колонок) и рисуй на axes[i]."
    lesson: task
  plot_kind:
    title: "Тип графика{where}: {got} вместо «{expected}»"
    text: "Для этого вопроса нужен другой тип графика. Динамика во времени — линия (plot), сравнение категорий — столбцы (bar), связь двух чисел — точки (scatter), распределение — гистограмма или ящик с усами."
    lesson: task
  plot_series:
    title: "Линий{where}: {got}, а нужно {expected}"
    text: "На графике другое число серий. Если нужна линия на каждую группу, построй их в цикле по группам или передай hue в seaborn; если одна — проверь, что не рисуешь лишнего."
    lesson: task
  plot_count:
    title: "Число {what}{where}: {got}, а нужно {expected}"
    text: "Данные графика не совпадают с ожидаемыми по размеру. Проверь фильтр, группировку и то, что на график попадает именно та таблица, что нужна."
    lesson: task
  plot_bins:
    title: "Столбцов гистограммы{where}: {got}, а нужно {expected}"
    text: "Число корзин задаётся аргументом bins. Без него matplotlib берёт 10, а seaborn подбирает число сам."
    lesson: task
  plot_order:
    title: Столбцы в другом порядке
    text: "Высоты столбцов верные, но порядок другой. Отсортируй данные перед построением — sort_values или sort_index."
    lesson: task
  plot_data:
    title: "Не совпадают {what}{where}"
    text: "Тип графика верный, а данные другие. Проверь фильтр, агрегат (sum или mean), колонку и то, что X и Y не перепутаны."
    lesson: task
  plot_xy_swap:
    title: Оси X и Y перепутаны
    text: "Точки совпадут, если поменять оси местами. Первым аргументом идёт X — то, от чего зависит, вторым Y — то, что меряем."
    lesson: task
  plot_labels:
    title: "Не хватает подписей{where}: {missing}"
    text: "График без подписей не читается. Добавь ax.set_title(...), ax.set_xlabel(...) и ax.set_ylabel(...) или plt.title / plt.xlabel / plt.ylabel."
    lesson: task
  plot_legend:
    title: Нет легенды
    text: "Линий несколько, и без легенды непонятно, какая что значит. Задай label=... у каждой серии и вызови ax.legend()."
    lesson: task
  plot_dims:
    title: X и Y разной длины
    text: "Для графика нужно одинаковое число значений по X и по Y. Чаще всего одна из колонок взята до фильтра, а другая — после."
    lesson: task
  seaborn_column:
    title: seaborn не нашёл колонку
    text: "seaborn ищет x=, y= и hue= среди колонок таблицы data=. Проверь написание имени и то, что data — это DataFrame: после groupby получается Series, а ключ уходит в индекс. Нужен reset_index() или groupby(..., as_index=False)."
    lesson: task
  stat_value:
    title: "{var}: значение отличается больше допуска ±{tol}"
    text: "Число не совпадает с ожидаемым ({off}). Проверь, по каким данным считаешь, какой тест и с какими параметрами вызываешь, и что берёшь нужное поле результата (statistic или pvalue)."
    lesson: task
  stat_count:
    title: "Чисел {got}, а нужно {expected}"
    text: "Ожидается другое количество значений. Например, доверительный интервал — это пара (нижняя граница, верхняя граница)."
    lesson: task
  stat_nan:
    title: Получился NaN
    text: "В расчёт попали пропуски. Многие функции scipy возвращают nan, если в данных есть NaN: убери их через dropna() или передай nan_policy='omit'."
    lesson: task
  stat_sided:
    title: Похоже на одностороннюю и двустороннюю гипотезу
    text: "Полученное p-value ровно в два раза отличается от ожидаемого. Проверь аргумент alternative: 'two-sided' по умолчанию, 'greater' или 'less' — для односторонней гипотезы."
    lesson: task
  stat_sign:
    title: Знак перепутан
    text: "Значение совпадает по модулю, но со знаком минус. Скорее всего, группы переданы в обратном порядке: B − A вместо A − B."
    lesson: task
  stat_percent:
    title: Доли и проценты
    text: "Значение отличается ровно в 100 раз. В задаче ожидается доля (0.12), а не проценты (12), или наоборот — перечитай условие."
    lesson: task
  stat_decision:
    title: "Неверный вывод в {var}"
    text: "Решение об H0 принимается сравнением p-value с уровнем значимости: p < alpha — отвергаем H0 (True), иначе — нет оснований отвергнуть (False). Проверь знак сравнения и alpha из условия."
    lesson: task
