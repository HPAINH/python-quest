  uses:MLPClassifier: "Используй MLPClassifier."
  uses:silhouette_score: "Используй silhouette_score."
  uses:to_datetime: "Переведи даты через pd.to_datetime."
  uses:concat: "Используй pd.concat."
  uses:crosstab: "Используй pd.crosstab."
  uses:query: "Используй метод query."
  uses:loc: "Используй loc."
  uses:iloc: "Используй iloc."
  uses:where: "Используй np.where."
  uses:pivot_table: "Используй pivot_table."
  uses:agg: "Используй agg."
  uses:transform: "Используй transform."
