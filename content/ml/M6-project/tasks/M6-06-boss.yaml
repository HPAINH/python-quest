id: M6-06-boss
type: model
title: 'Босс: финальная модель оттока'
difficulty: 3
boss: true
lesson_section: why
statement: 'Собери итоговую модель проекта на сырой таблице `raw` и запиши в `model`:


  - новые признаки через `FunctionTransformer`;

  - без `customer_id` и утечки `cancel_request`;

  - пропуски, масштаб и новые города в скрытых данных обработаны;

  - любая модель, которая даст ROC-AUC не ниже **0.835** на скрытой выборке.


  Проверка дополнительно обучит модель на перемешанной цели — она не должна пройти порог.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.preprocessing import FunctionTransformer\nfrom sklearn.ensemble import HistGradientBoostingClassifier\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\nraw = df.drop(columns=[\"churned\"])\n"
model:
  metric: roc_auc
  threshold: 0.835
  data: churn
  target: churned
  drop: []
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(raw, y)'
  leak_check: true
reference: "def add_features(d):\n    d = d.copy()\n    d[\"orders_per_month\"] = d[\"orders_90d\"] / 3\n    d[\"inactive\"] = (d[\"days_since_last\"] > 60).astype(int)\n    d[\"new_discount\"] = d[\"discount_share\"] * (d[\"tenure_months\"] < 6)\n    return d\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in raw.columns if c not in cat + [\"customer_id\", \"cancel_request\"]] + [\"inactive\", \"new_discount\"]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nmodel = make_pipeline(FunctionTransformer(add_features), pre, LogisticRegression(max_iter=1000, C=0.5))\nmodel.fit(raw, y)\n"
star3:
- first_try
buggy_variants:
- code: 'cat = [''city'', ''loyalty'']

    num = [c for c in raw.columns if c not in cat + [''customer_id'', ''cancel_request'']]

    pre = ColumnTransformer([(''num'', make_pipeline(SimpleImputer(strategy=''median''), StandardScaler()), num), (''cat'', OneHotEncoder(handle_unknown=''ignore''), cat)])

    model = make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(raw, y)'
  expect_detector: model_metric
- code: "def add_features(d):\n    d = d.copy()\n    d[\"orders_per_month\"] = d[\"orders_90d\"] / 3\n    d[\"inactive\"] = (d[\"days_since_last\"] > 60).astype(int)\n    d[\"new_discount\"] = d[\"discount_share\"] * (d[\"tenure_months\"] < 6)\n    return d\ncat = ['city', 'loyalty']\nnum = [c for c in raw.columns if c not in cat + ['customer_id']] + ['inactive', 'new_discount']\npre = ColumnTransformer([('num', make_pipeline(SimpleImputer(strategy='median'), StandardScaler()), num), ('cat', OneHotEncoder(handle_unknown='ignore'), cat)])\nmodel = make_pipeline(FunctionTransformer(add_features), pre, LogisticRegression(max_iter=1000)).fit(raw, y)"
  expect_detector: model_overfit
hints:
- 'Всё из трека: Pipeline, признаки, никакой утечки, подходящая модель.'
- Модель из задачи «Модель с признаками» уже близка к порогу. Проверь, что признаки встроены в Pipeline, а cancel_request исключён; можно чуть усилить регуляризацию или попробовать бустинг с признаками.
- make_pipeline(FunctionTransformer(add_features), pre, LogisticRegression(max_iter=1000, C=0.5)).fit(raw, y).
- "def add_features(d):\n    d = d.copy()\n    d[\"orders_per_month\"] = d[\"orders_90d\"] / 3\n    d[\"inactive\"] = (d[\"days_since_last\"] > 60).astype(int)\n    d[\"new_discount\"] = d[\"discount_share\"] * (d[\"tenure_months\"] < 6)\n    return d\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in raw.columns if c not in cat + [\"customer_id\", \"cancel_request\"]] + [\"inactive\", \"new_discount\"]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nmodel = make_pipeline(FunctionTransformer(___), pre, LogisticRegression(max_iter=1000, C=___))\nmodel.fit(raw, y)"
- 'Итог трека: признаки-гипотезы дали больше, чем смена модели. С утечкой модель блестит на своих данных и проваливается на живых клиентах; без признаков — не дотягивает до порога.'
