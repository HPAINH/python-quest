id: M6-05-profit
type: stat
title: Порог под деньги
difficulty: 3
lesson_section: business
statement: 'Предложение стоит 300 ₽ на клиента. Если уходящий его получил, с вероятностью 30% он остаётся и приносит 2500 ₽. Для порогов `np.arange(0.05, 0.95, 0.01)` посчитай на валидации прибыль `0.3 * 2500 * TP - 300 * contacted` и найди порог с наибольшей прибылью. Запиши `best_threshold` (допуск ±0.006) и `best_profit` (допуск ±1).

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.preprocessing import FunctionTransformer\nfrom sklearn.ensemble import HistGradientBoostingClassifier\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\nraw = df.drop(columns=[\"churned\"])\ndef add_features(d):\n    d = d.copy()\n    d[\"orders_per_month\"] = d[\"orders_90d\"] / 3\n    d[\"inactive\"] = (d[\"days_since_last\"] > 60).astype(int)\n    d[\"new_discount\"] = d[\"discount_share\"] * (d[\"tenure_months\"] < 6)\n    return d\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in raw.columns if c not in cat + [\"customer_id\", \"cancel_request\"]] + [\"inactive\", \"new_discount\"]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nX_tr, X_val, y_tr, y_val = train_test_split(raw, y, test_size=0.3, stratify=y, random_state=7)\nmodel = make_pipeline(FunctionTransformer(add_features), pre, LogisticRegression(max_iter=1000)).fit(X_tr, y_tr)\nproba = model.predict_proba(X_val)[:, 1]\n"
outputs:
- var: best_threshold
  tol: 0.006
- var: best_profit
  tol: 1
reference: "yv = y_val.to_numpy()\nbest_threshold, best_profit = None, -np.inf\nfor t in np.arange(0.05, 0.95, 0.01):\n    c = proba >= t\n    p = 0.3 * 2500 * (c & (yv == 1)).sum() - 300 * c.sum()\n    if p > best_profit:\n        best_threshold, best_profit = t, p\n"
star3:
- first_try
- max_lines:8
buggy_variants:
- code: "yv = y_val.to_numpy()\nbest_threshold, best_profit = None, -np.inf\nfor t in np.arange(0.05, 0.95, 0.01):\n    c = proba >= t\n    p = 2500 * (c & (yv == 1)).sum() - 300 * c.sum()\n    if p > best_profit:\n        best_threshold, best_profit = t, p"
  expect_detector: stat_value
hints:
- Деньги и порог — раздел «Бизнес-метрика».
- Для каждого порога найди, кого контактируем, сколько среди них уходящих (TP), и посчитай прибыль по формуле. Запоминай лучший порог.
- c = proba >= t; tp = (c & (y_val == 1)).sum(); p = 0.3 * 2500 * tp - 300 * c.sum().
- "yv = y_val.to_numpy()\nbest_threshold, best_profit = None, -np.inf\nfor t in np.arange(0.05, 0.95, 0.01):\n    c = proba >= t\n    p = ___ * 2500 * (c & (yv == 1)).sum() - 300 * c.___()\n    if p > best_profit:\n        best_threshold, best_profit = t, p"
- Без доли удержания 30% каждая найденная потеря кажется спасённой, и порог уезжает вниз — рассылка становится шире и дороже, чем нужно. Оптимальный порог по деньгам обычно не совпадает ни с 0.5, ни с лучшим F1.
