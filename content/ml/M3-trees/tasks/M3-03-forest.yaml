id: M3-03-forest
type: model
title: Случайный лес
difficulty: 2
lesson_section: forest
statement: 'Обучи на всех данных Pipeline из `pre` и `RandomForestClassifier` и запиши в `model`. Порог — ROC-AUC не ниже 0.815 на скрытой выборке. Подсказка из урока: 100 деревьев и `min_samples_leaf=5` работают хорошо; `random_state=0`.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.ensemble import RandomForestClassifier, HistGradientBoostingClassifier, HistGradientBoostingRegressor\nfrom sklearn.inspection import permutation_importance\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", SimpleImputer(strategy=\"median\"), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\n"
model:
  metric: roc_auc
  threshold: 0.815
  data: churn
  target: churned
  drop:
  - customer_id
  - cancel_request
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(X, y)'
requires:
- uses:RandomForestClassifier
reference: 'model = make_pipeline(pre, RandomForestClassifier(n_estimators=100, min_samples_leaf=5, random_state=0))

  model.fit(X, y)

  '
star3:
- first_try
- max_lines:2
buggy_variants:
- code: model = make_pipeline(pre, RandomForestClassifier(n_estimators=5, max_depth=2, random_state=0)).fit(X, y)
  expect_detector: model_metric
hints:
- Лес — раздел «Случайный лес».
- Замени дерево на RandomForestClassifier. Лес из сотни деревьев с небольшим ограничением листа устойчивее одного дерева.
- make_pipeline(pre, RandomForestClassifier(n_estimators=100, min_samples_leaf=5, random_state=0)).fit(X, y).
- 'model = make_pipeline(pre, RandomForestClassifier(n_estimators=___, min_samples_leaf=___, random_state=0))

  model.fit(X, y)'
- Лес с параметрами по умолчанию тоже неплох, но его деревья дорастают до чистых листьев и чуть переобучаются; min_samples_leaf=5 их сглаживает.
