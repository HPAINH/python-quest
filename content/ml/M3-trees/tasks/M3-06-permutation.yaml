id: M3-06-permutation
type: value
title: Перемешай и посмотри
difficulty: 3
lesson_section: importance
same_ok: true
statement: 'Для леса `rf` из `setup` посчитай `permutation_importance` по первым 1500 строкам `X`, `y` с `n_repeats=3`, `random_state=0`, `scoring="roc_auc"`. Запиши в `result` имя исходной колонки `X`, перемешивание которой сильнее всего роняет метрику.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.ensemble import RandomForestClassifier, HistGradientBoostingClassifier, HistGradientBoostingRegressor\nfrom sklearn.inspection import permutation_importance\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", SimpleImputer(strategy=\"median\"), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nrf = make_pipeline(pre, RandomForestClassifier(n_estimators=100, min_samples_leaf=5, random_state=0)).fit(X, y)\n"
reference: 'pi = permutation_importance(rf, X.head(1500), y.head(1500), n_repeats=3, random_state=0, scoring="roc_auc")

  result = pd.Series(pi.importances_mean, index=X.columns).idxmax()

  '
