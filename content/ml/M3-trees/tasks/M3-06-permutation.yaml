hints:
- permutation_importance — раздел «Важность признаков».
- Функция принимает модель целиком и исходную таблицу. Средние падения метрики лежат в importances_mean в порядке колонок X.
- permutation_importance(rf, X.head(1500), y.head(1500), n_repeats=3, random_state=0, scoring="roc_auc"), pd.Series(pi.importances_mean, index=X.columns).idxmax().
- 'pi = permutation_importance(rf, X.head(1500), y.head(1500), n_repeats=3, random_state=0, scoring=___)

  result = pd.Series(pi.___, index=X.columns).idxmax()'
- Permutation importance работает с исходными колонками, поэтому имена — из X, а не из подготовки. Она честнее feature_importances_, которая завышает важность признаков с большим числом уникальных значений.
