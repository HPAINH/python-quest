id: M3-01-tree
type: model
title: Неглубокое дерево
difficulty: 1
lesson_section: tree
statement: 'Обучи на всех `X`, `y` Pipeline из `pre` (заполнение пропусков и кодирование уже готовы) и `DecisionTreeClassifier` с ограничениями `max_depth=6`, `min_samples_leaf=50`, `random_state=0`. Запиши в `model`. Порог — ROC-AUC не ниже 0.78 на скрытой выборке.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.ensemble import RandomForestClassifier, HistGradientBoostingClassifier, HistGradientBoostingRegressor\nfrom sklearn.inspection import permutation_importance\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", SimpleImputer(strategy=\"median\"), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\n"
model:
  metric: roc_auc
  threshold: 0.78
  data: churn
  target: churned
  drop:
  - customer_id
  - cancel_request
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(X, y)'
requires:
- uses:DecisionTreeClassifier
reference: 'model = make_pipeline(pre, DecisionTreeClassifier(max_depth=6, min_samples_leaf=50, random_state=0))

  model.fit(X, y)

  '
star3:
- first_try
- max_lines:2
buggy_variants:
- code: model = make_pipeline(pre, DecisionTreeClassifier(random_state=0)).fit(X, y)
  expect_detector: model_overfit
hints:
- Ограничения дерева — раздел «Дерево решений».
- Поставь после pre дерево с параметрами max_depth и min_samples_leaf и обучи на всех данных.
- make_pipeline(pre, DecisionTreeClassifier(max_depth=6, min_samples_leaf=50, random_state=0)).fit(X, y).
- 'model = make_pipeline(pre, DecisionTreeClassifier(max_depth=___, min_samples_leaf=___, random_state=0))

  model.fit(X, y)'
- 'Без ограничений дерево дорастает до листьев из одного клиента и запоминает шум: на обучении идеально, на новых клиентах — около 0.63.'
