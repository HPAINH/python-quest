id: M3-09-compare
type: dataframe
title: Сравнение моделей
difficulty: 3
lesson_section: boosting
statement: 'Сравни три модели кросс-валидацией: `cross_val_score` с `cv=StratifiedKFold(3, shuffle=True, random_state=0)` и `scoring="roc_auc"` на всех `X`, `y`. Модели — Pipeline из `pre` и:

  - `tree`: `DecisionTreeClassifier(max_depth=6, min_samples_leaf=50, random_state=0)`;

  - `forest`: `RandomForestClassifier(n_estimators=60, min_samples_leaf=5, random_state=0)`;

  - `boosting`: `HistGradientBoostingClassifier(random_state=0)`.


  Запиши в `result` таблицу с колонками `model` и `auc` (среднее по фолдам, 3 знака), по убыванию `auc`.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.ensemble import RandomForestClassifier, HistGradientBoostingClassifier, HistGradientBoostingRegressor\nfrom sklearn.inspection import permutation_importance\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", SimpleImputer(strategy=\"median\"), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nfrom sklearn.model_selection import cross_val_score, StratifiedKFold\n"
ordered: true
reference: "cv = StratifiedKFold(3, shuffle=True, random_state=0)\nmodels = {\n    \"tree\": DecisionTreeClassifier(max_depth=6, min_samples_leaf=50, random_state=0),\n    \"forest\": RandomForestClassifier(n_estimators=60, min_samples_leaf=5, random_state=0),\n    \"boosting\": HistGradientBoostingClassifier(random_state=0),\n}\nrows = [{\"model\": k, \"auc\": round(cross_val_score(make_pipeline(pre, m), X, y, cv=cv, scoring=\"roc_auc\").mean(), 3)} for k, m in models.items()]\nresult = pd.DataFrame(rows).sort_values(\"auc\", ascending=False)\n"
star3:
- first_try
buggy_variants:
