    models = {''tree'': DecisionTreeClassifier(max_depth=6, min_samples_leaf=50, random_state=0), ''forest'': RandomForestClassifier(n_estimators=60, min_samples_leaf=5, random_state=0), ''boosting'': HistGradientBoostingClassifier(random_state=0)}

    rows = [{''model'': k, ''auc'': round(cross_val_score(make_pipeline(pre, m), X, y, cv=cv).mean(), 3)} for k, m in models.items()]

    result = pd.DataFrame(rows).sort_values(''auc'', ascending=False)'
  expect_detector: column_values
hints:
- Сравнение моделей — разделы урока; cross_val_score подробно — уровень M4.
- Пройди циклом по словарю моделей, для каждой посчитай среднее cross_val_score с одним и тем же cv и scoring и собери таблицу.
- cross_val_score(make_pipeline(pre, m), X, y, cv=cv, scoring="roc_auc").mean(), pd.DataFrame(rows).sort_values("auc", ascending=False).
- 'cv = StratifiedKFold(3, shuffle=True, random_state=0)

  models = {...}

  rows = [{"model": k, "auc": round(cross_val_score(make_pipeline(pre, m), X, y, cv=cv, scoring=___).mean(), 3)} for k, m in models.items()]

  result = pd.DataFrame(rows).sort_values("auc", ascending=___)'
- Без scoring cross_val_score считает accuracy — на несбалансированных данных она почти одинакова у всех моделей. Один и тот же объект cv гарантирует одинаковые фолды для честного сравнения.
