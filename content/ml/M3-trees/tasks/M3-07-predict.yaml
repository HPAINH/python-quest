id: M3-07-predict
type: predict
title: Как решает дерево
difficulty: 2
lesson_section: tree
statement: 'Впиши, что выведет программа.

  '
code: 'from sklearn.tree import DecisionTreeClassifier, DecisionTreeRegressor

  X = [[1], [2], [3], [10], [11], [12]]

  t = DecisionTreeClassifier(max_depth=1).fit(X, [0, 0, 0, 1, 1, 1])

  print(t.predict([[0], [6], [7], [100]]).tolist())

  print(t.predict_proba([[5]]).tolist())

  r = DecisionTreeRegressor(max_depth=1).fit(X, [5, 7, 9, 20, 22, 30])

  print(r.predict([[2], [11]]).tolist())

  print(t.get_depth(), t.get_n_leaves())

  '
hints:
- Повтори раздел «Дерево решений».
- Порог дерева — посередине между 3 и 10, то есть 6.5.
- 'Лист классификатора выдаёт долю классов, лист регрессора — среднее: (5 + 7 + 9) / 3 и (20 + 22 + 30) / 3.'
- 'Четыре строки: список меток, список из одного списка вероятностей, список из двух чисел, два числа.'
- 'Ответ: «[0, 0, 1, 1]», «[[1.0, 0.0]]», «[7.0, 24.0]», «1 2».'
