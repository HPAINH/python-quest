id: M3-10-boss
type: model
title: 'Босс: лучшая модель оттока'
difficulty: 3
boss: true
lesson_section: boosting
statement: 'Обучи на всех `X`, `y` модель оттока с ROC-AUC не ниже 0.825 на скрытой выборке и запиши в `model`. Одиночное дерево так не умеет, лес с настройками урока — на грани. Подсказка: аккуратный бустинг — маленький `learning_rate`, больше итераций, неглубокие деревья.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.ensemble import RandomForestClassifier, HistGradientBoostingClassifier, HistGradientBoostingRegressor\nfrom sklearn.inspection import permutation_importance\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", SimpleImputer(strategy=\"median\"), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\n"
model:
  metric: roc_auc
  threshold: 0.825
  data: churn
  target: churned
  drop:
  - customer_id
  - cancel_request
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(X, y)'
  leak_check: true
reference: 'model = make_pipeline(pre, HistGradientBoostingClassifier(learning_rate=0.05, max_iter=300, max_depth=3, random_state=0))

  model.fit(X, y)

  '
star3:
- first_try
buggy_variants:
- code: model = make_pipeline(pre, DecisionTreeClassifier(max_depth=6, min_samples_leaf=50, random_state=0)).fit(X, y)
  expect_detector: model_metric
hints:
- 'Всё из уровня: ансамбли и их параметры.'
- Возьми HistGradientBoostingClassifier и уменьши шаг обучения, компенсировав его числом итераций, а глубину деревьев ограничь.
- HistGradientBoostingClassifier(learning_rate=0.05, max_iter=300, max_depth=3, random_state=0).
- 'model = make_pipeline(pre, HistGradientBoostingClassifier(learning_rate=___, max_iter=___, max_depth=___, random_state=0))

  model.fit(X, y)'
- Бустинг по умолчанию делает крупные шаги и подстраивается под шум. Маленький learning_rate с большим max_iter двигается к решению осторожно, а max_depth=3 не даёт отдельным деревьям запоминать данные.
