id: M4-04-timesplit
type: stat
title: Прогноз на будущее
difficulty: 2
lesson_section: timesplit
statement: 'Оцени модель спроса `model_d` из `setup` по времени: `cross_val_score` с `cv=TimeSeriesSplit(4)` и `scoring="neg_mean_absolute_error"` на `Xd`, `yd`. Запиши `mae_folds` — список MAE по фолдам **положительными** числами (допуск ±0.001) и `first_worst` — `True`, если первый фолд хуже всех.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.model_selection import cross_val_score, KFold, StratifiedKFold, GridSearchCV, TimeSeriesSplit\nfrom sklearn.ensemble import HistGradientBoostingClassifier, HistGradientBoostingRegressor\ndd = pd.read_csv(\"demand.csv\", parse_dates=[\"date\"])\ndd[\"month\"] = dd[\"date\"].dt.month\nXd = dd.drop(columns=[\"date\", \"product_id\", \"units\"])\nyd = dd[\"units\"]\nif SHUFFLE:\n    yd = yd.sample(frac=1, random_state=1).reset_index(drop=True)\nmodel_d = make_pipeline(ColumnTransformer([(\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), [\"category\"])], remainder=\"passthrough\"), HistGradientBoostingRegressor(random_state=0))\n"
outputs:
- var: mae_folds
  tol: 0.001
- var: first_worst
reference: 's = -cross_val_score(model_d, Xd, yd, cv=TimeSeriesSplit(4), scoring="neg_mean_absolute_error")

  mae_folds = s.tolist()

  first_worst = bool(s[0] == s.max())

  '
star3:
- first_try
- max_lines:3
buggy_variants:
- code: 's = -cross_val_score(model_d, Xd, yd, cv=KFold(4, shuffle=True, random_state=0), scoring=''neg_mean_absolute_error'')

    mae_folds = s.tolist()

    first_worst = bool(s[0] == s.max())'
  expect_detector: stat_value
- code: 's = cross_val_score(model_d, Xd, yd, cv=TimeSeriesSplit(4), scoring=''neg_mean_absolute_error'')

    mae_folds = s.tolist()

    first_worst = bool(s[0] == s.max())'
  expect_detector: stat_sign
hints:
- Разбиение по времени — раздел «Время».
- Передай TimeSeriesSplit в cv. Метрика ошибки в sklearn отрицательная — смени знак.
- -cross_val_score(model_d, Xd, yd, cv=TimeSeriesSplit(4), scoring="neg_mean_absolute_error").
- 's = -cross_val_score(model_d, Xd, yd, cv=___(4), scoring=___)

  mae_folds = s.tolist()

  first_worst = bool(s[0] == s.max())'
- Первый фолд обучается на самой короткой истории — без зимы модель плохо знает зимний спрос. Случайный KFold смешивает дни и даёт ошибку ниже, чем будет в работе.
