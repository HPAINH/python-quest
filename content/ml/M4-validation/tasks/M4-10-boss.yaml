id: M4-10-boss
type: model
title: 'Босс: подобранная модель'
difficulty: 3
boss: true
lesson_section: grid
statement: 'Собери из таблицы `raw` модель оттока с подбором гиперпараметров.


  - Подготовка: без `customer_id` и `cancel_request`, пропуски — медианой, категории — `OneHotEncoder(handle_unknown="ignore")`. Масштабирование для бустинга не нужно.

  - Модель: `HistGradientBoostingClassifier(learning_rate=0.05, max_iter=200, random_state=0)`.

  - Подбор: `GridSearchCV` по `max_depth` из `[3, None]`, `cv=StratifiedKFold(3, shuffle=True, random_state=0)`, `scoring="roc_auc"`.

  - Обученный объект поиска запиши в `model`.


  Порог — ROC-AUC не ниже 0.825 на скрытой выборке, плюс проверка на перемешанной цели.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.model_selection import cross_val_score, KFold, StratifiedKFold, GridSearchCV, TimeSeriesSplit\nfrom sklearn.ensemble import HistGradientBoostingClassifier, HistGradientBoostingRegressor\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\nraw = df.drop(columns=[\"churned\"])\n"
model:
  metric: roc_auc
  threshold: 0.825
  data: churn
  target: churned
  drop: []
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(raw, y)'
  leak_check: true
reference: 'cat = ["city", "loyalty"]

  num = [c for c in raw.columns if c not in cat + ["customer_id", "cancel_request"]]

  pre = ColumnTransformer([("num", SimpleImputer(strategy="median"), num), ("cat", OneHotEncoder(handle_unknown="ignore"), cat)])

  pipe = make_pipeline(pre, HistGradientBoostingClassifier(learning_rate=0.05, max_iter=200, random_state=0))

  cv = StratifiedKFold(3, shuffle=True, random_state=0)

  model = GridSearchCV(pipe, {"histgradientboostingclassifier__max_depth": [3, None]}, cv=cv, scoring="roc_auc")

  model.fit(raw, y)

  '
