id: M4-06-no-leak
type: model
title: Модель без утечки
difficulty: 2
lesson_section: leaks
statement: 'Обучи на таблице `raw` (все колонки, кроме `churned`) Pipeline с подготовкой и `LogisticRegression(max_iter=1000)`, который **не использует** `customer_id` и `cancel_request`, и запиши в `model`. Модель будет получать таблицы в формате `raw`. Порог — ROC-AUC не ниже 0.80, плюс проверка на перемешанной цели.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.model_selection import cross_val_score, KFold, StratifiedKFold, GridSearchCV, TimeSeriesSplit\nfrom sklearn.ensemble import HistGradientBoostingClassifier, HistGradientBoostingRegressor\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\nraw = df.drop(columns=[\"churned\"])\n"
model:
  metric: roc_auc
  threshold: 0.8
  data: churn
  target: churned
  drop: []
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(raw, y)'
  leak_check: true
reference: "cat = [\"city\", \"loyalty\"]\nnum = [c for c in raw.columns if c not in cat + [\"customer_id\", \"cancel_request\"]]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nmodel = make_pipeline(pre, LogisticRegression(max_iter=1000))\nmodel.fit(raw, y)\n"
star3:
- first_try
buggy_variants:
- code: "cat = [\"city\", \"loyalty\"]\nnum = [c for c in raw.columns if c not in cat + [\"customer_id\"]]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nmodel = make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(raw, y)"
  expect_detector: model_overfit
hints:
- Утечка цели — раздел «Утечка цели».
- Перечисли числовые колонки явно, исключив идентификатор и утечку; ColumnTransformer отбросит всё неперечисленное.
- num = [c for c in raw.columns if c not in cat + ["customer_id", "cancel_request"]].
- "cat = [\"city\", \"loyalty\"]\nnum = [c for c in raw.columns if c not in cat + [___, ___]]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nmodel = make_pipeline(pre, LogisticRegression(max_iter=1000))\nmodel.fit(raw, y)"
- С cancel_request модель на своих данных выглядит блестяще, а на живых клиентах, у которых заявок ещё нет, проигрывает честной модели. Детектор видит это по разрыву метрик.
