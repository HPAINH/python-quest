id: M4-05-find-leak
type: stat
title: Найди утечку
difficulty: 2
lesson_section: leaks
statement: 'В `raw` — все колонки `churn.csv`, кроме `churned`. Для каждой **числовой** колонки, кроме `customer_id`, посчитай ROC-AUC, используя саму колонку как оценку (пропуски заполни медианой колонки), и возьми `max(auc, 1 - auc)`. Запиши `leak` — имя колонки с наибольшим значением и `leak_auc` — само значение (допуск ±0.0001).

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.model_selection import cross_val_score, KFold, StratifiedKFold, GridSearchCV, TimeSeriesSplit\nfrom sklearn.ensemble import HistGradientBoostingClassifier, HistGradientBoostingRegressor\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\nraw = df.drop(columns=[\"churned\"])\n"
outputs:
- var: leak
- var: leak_auc
  tol: 0.0001
reference: "scores = {}\nfor c in raw.select_dtypes(\"number\").columns.drop(\"customer_id\"):\n    auc = metrics.roc_auc_score(y, raw[c].fillna(raw[c].median()))\n    scores[c] = max(auc, 1 - auc)\nleak = max(scores, key=scores.get)\nleak_auc = scores[leak]\n"
star3:
- first_try
- max_lines:6
buggy_variants:
