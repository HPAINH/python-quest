id: M4-07-predict
type: predict
title: Фолды и сетки
difficulty: 2
lesson_section: kfold
statement: 'Впиши, что выведет программа.

  '
code: 'import numpy as np

  from sklearn.model_selection import KFold, StratifiedKFold, TimeSeriesSplit

  X = np.arange(12)

  print([len(te) for _, te in KFold(5).split(X)])

  y = np.array([0] * 9 + [1] * 3)

  print([int(y[te].sum()) for _, te in StratifiedKFold(3).split(X, y)])

  print([te.tolist() for _, te in TimeSeriesSplit(2).split(X)])

  grid = {"a": [1, 2, 3], "b": [True, False]}

  print(len(grid["a"]) * len(grid["b"]) * 5)

  '
hints:
- Повтори разделы «Фолды», «Время» и «Подбор гиперпараметров».
- '12 строк на 5 фолдов: первые две части получают по 3 строки, остальные по 2.'
- 'TimeSeriesSplit(2) делит 12 строк на 3 части по 4: проверяются вторая и третья. В сетке 3 × 2 = 6 комбинаций, каждая обучается 5 раз.'
- 'Четыре строки: три списка и одно число.'
- 'Ответ: «[3, 3, 2, 2, 2]», «[1, 1, 1]», «[[4, 5, 6, 7], [8, 9, 10, 11]]», «30».'
