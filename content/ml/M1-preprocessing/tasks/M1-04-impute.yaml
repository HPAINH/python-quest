- SimpleImputer(strategy="median").fit(X_train).statistics_.tolist(), X_test.isna().sum().sum().
- 'cols = ["avg_check", "email_opens_30d"]

  X_train, X_test, y_train, y_test = train_test_split(X[cols], y, test_size=0.25, stratify=y, random_state=42)

  imp = SimpleImputer(strategy=___).fit(X_train)

