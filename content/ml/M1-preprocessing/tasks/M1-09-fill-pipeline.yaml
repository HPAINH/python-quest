id: M1-09-fill-pipeline
type: fill_gaps
base: model
title: Собери Pipeline
difficulty: 1
lesson_section: pipeline
statement: 'Заполни пропуски `___`, чтобы получилась обученная модель оттока в `model` (ROC-AUC на скрытой выборке не ниже 0.80).

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\n"
model:
  metric: roc_auc
  threshold: 0.8
  data: churn
  target: churned
  drop:
  - customer_id
  - cancel_request
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(X, y)'
template: "cat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(___(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", ___(handle_unknown=\"ignore\"), cat),\n])\nmodel = ___(pre, LogisticRegression(max_iter=1000))\nmodel.fit(X, y)\n"
reference: "cat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nmodel = make_pipeline(pre, LogisticRegression(max_iter=1000))\nmodel.fit(X, y)\n"
star3:
- first_try
hints:
- Три кирпича — раздел «Pipeline и ColumnTransformer».
- Пропуски в числах заполняет импьютер, категории кодирует one-hot, а соединяет подготовку с моделью функция из sklearn.pipeline.
- SimpleImputer, OneHotEncoder, make_pipeline.
- 'Три пропуска: класс для пропусков, класс для категорий, функция-соединитель.'
- 'Ответ: SimpleImputer, OneHotEncoder, make_pipeline. С Pipeline модель хранит в себе всю подготовку и одинаково готовит и обучающие, и новые данные.'
