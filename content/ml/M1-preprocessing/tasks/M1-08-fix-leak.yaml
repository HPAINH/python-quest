id: M1-08-fix-leak
type: fix_bug
base: model
title: Исправь утечку масштабирования
difficulty: 2
lesson_section: leaks
statement: 'Код масштабирует числовые признаки до разбиения на train и test. Это утечка — проверка её найдёт. Перепиши так, чтобы подготовка жила внутри Pipeline, и запиши обученную модель в `model` (ROC-AUC на скрытой выборке не ниже 0.80).

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\n"
model:
  metric: roc_auc
  threshold: 0.8
  data: churn
  target: churned
  drop:
  - customer_id
  - cancel_request
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(X, y)'
starter: 'num = X.drop(columns=["city", "loyalty"]).fillna(0)

  X_scaled = StandardScaler().fit_transform(num)

  X_train, X_test, y_train, y_test = train_test_split(X_scaled, y, test_size=0.25, stratify=y, random_state=42)

  model = LogisticRegression(max_iter=1000).fit(X_train, y_train)

  '
reference: "cat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\nmodel = make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(X_train, y_train)\n"
star3:
- first_try
hints:
- Утечки — раздел «Утечки», и пара «неправильно → правильно» в «Частых ошибках».
- Сначала разбей исходную таблицу X, а масштабирование, заполнение пропусков и кодирование помести в Pipeline вместе с моделью. fit вызывай только на X_train.
- train_test_split(X, y, ...), make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(X_train, y_train).
- "cat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nX_train, X_test, y_train, y_test = train_test_split(___, y, test_size=0.25, stratify=y, random_state=42)\nmodel = make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(___, y_train)"
- fit_transform на всех данных учит среднее и разброс с учётом тестовых клиентов. Кроме того, такая модель ждёт массив из числовых колонок, а на проверке получит таблицу — Pipeline решает обе проблемы.
