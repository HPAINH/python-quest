    sc = StandardScaler().fit(X_test)

    test_means = sc.transform(X_test).mean(axis=0).tolist()'
  expect_detector: stat_value
- code: 'cols = [''days_since_last'', ''orders_90d'', ''support_tickets'']

    X_train, X_test, y_train, y_test = train_test_split(X[cols], y, test_size=0.25, stratify=y, random_state=42)

