id: M1-06-first-model
type: model
title: Первая модель оттока
difficulty: 2
lesson_section: pipeline
statement: 'Обучи на всех `X`, `y` Pipeline из подготовки (как в прошлой задаче) и `LogisticRegression(max_iter=1000)`. Запиши обученную модель в `model`. Проверка посчитает ROC-AUC на скрытой выборке других клиентов: нужно не ниже 0.80.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\n"
model:
  metric: roc_auc
  threshold: 0.8
  data: churn
  target: churned
  drop:
  - customer_id
  - cancel_request
  baseline: 'from sklearn.dummy import DummyClassifier

    model = DummyClassifier().fit(X, y)'
reference: "cat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nmodel = make_pipeline(pre, LogisticRegression(max_iter=1000))\nmodel.fit(X, y)\n"
star3:
- first_try
buggy_variants:
- code: model = LogisticRegression(max_iter=1000).fit(X[['days_since_last']], y)
  expect_detector: feature_mismatch
- code: 'cat = [''city'', ''loyalty'']

    num = [c for c in X.columns if c not in cat]

    pre = ColumnTransformer([(''num'', make_pipeline(SimpleImputer(strategy=''median''), StandardScaler()), num), (''cat'', OneHotEncoder(), cat)])

    model = make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(X, y)'
  expect_detector: unknown_category
hints:
- Pipeline с моделью — раздел «Pipeline и ColumnTransformer».
- Собери тот же ColumnTransformer и поставь после него логистическую регрессию через make_pipeline. Обучай на всей таблице X — нужные колонки модель выберет сама.
- model = make_pipeline(pre, LogisticRegression(max_iter=1000)); model.fit(X, y).
- "cat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=___), cat),\n])\nmodel = make_pipeline(pre, LogisticRegression(max_iter=___))\nmodel.fit(X, y)"
- Модель получает на проверке таблицу тех же колонок, что X, — поэтому учить её нужно на всём X, а выбор колонок делать внутри Pipeline. Без handle_unknown модель упадёт на новом городе из скрытой выборки.
