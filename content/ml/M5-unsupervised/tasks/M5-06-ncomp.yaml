hints:
- Накопленная доля — раздел «PCA».
- Посчитай накопленную сумму долей и найди первую позицию, где она достигает 0.9. Позиции считаются с нуля, а компоненты — с единицы.
- np.cumsum(ratios), np.argmax(cum >= 0.9) + 1.
- 'Z = StandardScaler().fit_transform(df[cols].fillna(df[cols].median()))

  cum = np.___(PCA().fit(Z).explained_variance_ratio_)

  result = int(np.argmax(cum >= 0.9)) + ___'
- 'argmax по булевому массиву возвращает индекс первого True. Почти все компоненты нужны — сжатие здесь не помогает. Ещё короче: PCA(0.9).fit(Z).n_components_.'
