- Стандартизируй, обучи PCA без ограничения числа компонент и возьми explained_variance_ratio_.
- PCA().fit(Z).explained_variance_ratio_.tolist().
- 'Z = StandardScaler().fit_transform(df[cols].fillna(df[cols].median()))

  p = PCA().fit(___)

  ratios = p.___.tolist()

  first_two = sum(ratios[:2])'
- 'Без стандартизации первая компонента — это почти целиком чек в рублях, и её доля близка к 1. После стандартизации доли почти равные: признаки слабо связаны.'
