id: M5-03-elbow
type: stat
title: Кривая локтя
difficulty: 2
lesson_section: choose-k
statement: 'Для первых 3000 клиентов стандартизируй колонки `orders_90d`, `avg_check`, `days_since_last`, `discount_share` (пропуски — медианой по этим строкам) и запиши в `inertias` инерцию `KMeans(k, n_init=10, random_state=0)` для k от 1 до 6 (допуск ±0.0001%).

  '
setup: 'import numpy as np

  import pandas as pd

  from sklearn.cluster import KMeans

  from sklearn.decomposition import PCA

  from sklearn.preprocessing import StandardScaler

  from sklearn.metrics import silhouette_score

  from sklearn.datasets import make_blobs

  df = pd.read_csv("churn.csv")

  '
outputs:
- var: inertias
  rtol: 1.0e-06
reference: 'seg = ["orders_90d", "avg_check", "days_since_last", "discount_share"]

  X = df[seg].head(3000)

  Z = StandardScaler().fit_transform(X.fillna(X.median()))

  inertias = [KMeans(k, n_init=10, random_state=0).fit(Z).inertia_ for k in range(1, 7)]

  '
star3:
- first_try
- max_lines:4
buggy_variants:
- code: 'seg = [''orders_90d'', ''avg_check'', ''days_since_last'', ''discount_share'']

    X = df[seg].head(3000)

    Z = X.fillna(X.median()).to_numpy()

    inertias = [KMeans(k, n_init=10, random_state=0).fit(Z).inertia_ for k in range(1, 7)]'
  expect_detector: stat_value
- code: 'seg = [''orders_90d'', ''avg_check'', ''days_since_last'', ''discount_share'']

    X = df[seg].head(3000)

    Z = StandardScaler().fit_transform(X.fillna(X.median()))

    inertias = [KMeans(k, n_init=10, random_state=0).fit(Z).inertia_ for k in range(2, 8)]'
  expect_detector: stat_value
hints:
- Инерция и локоть — раздел «Выбор числа кластеров».
- Подготовь стандартизованную матрицу и в цикле по k от 1 до 6 обучай KMeans, сохраняя inertia_.
- '[KMeans(k, n_init=10, random_state=0).fit(Z).inertia_ for k in range(1, 7)].'
- 'seg = ["orders_90d", "avg_check", "days_since_last", "discount_share"]

  X = df[seg].head(3000)

  Z = StandardScaler().fit_transform(X.fillna(X.median()))

  inertias = [KMeans(k, n_init=10, random_state=0).fit(Z).___ for k in range(___, ___)]'
- 'При k = 1 инерция равна сумме дисперсий: 4 признака × 3000 строк = 12 000 после стандартизации. Дальше она падает всё медленнее — где падение резко замедлилось, там и «локоть».'
