hints:
- Масштаб и расстояния — раздел «Масштаб».
- Заполни пропуски медианами, кластеризуй сырые значения, затем стандартизируй и кластеризуй снова. fit_predict сразу возвращает метки.
- df[c].fillna(df[c].median()), KMeans(3, n_init=10, random_state=0).fit_predict(X), StandardScaler().fit_transform(X).
