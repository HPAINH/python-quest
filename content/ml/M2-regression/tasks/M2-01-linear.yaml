id: M2-01-linear
type: model
title: Линейный прогноз спроса
difficulty: 1
lesson_section: linreg
statement: 'Обучи на всех `Xd`, `yd` (признаки спроса и число проданных штук) Pipeline из `pre_d` — кодирования категории — и `LinearRegression`. Запиши модель в `model`. Порог: MAE на скрытой выборке других товаров не больше 7.9 штук. Прогноз средним даёт около 8.6.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\ndd = pd.read_csv(\"demand.csv\", parse_dates=[\"date\"])\ndd[\"month\"] = dd[\"date\"].dt.month\nXd = dd.drop(columns=[\"date\", \"product_id\", \"units\"])\nyd = dd[\"units\"]\nif SHUFFLE:\n    yd = yd.sample(frac=1, random_state=1).reset_index(drop=True)\npre_d = ColumnTransformer([(\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), [\"category\"])], remainder=\"passthrough\")\n"
model:
  var: model
  metric: mae
  threshold: 7.9
  test_setup: 'import pandas as pd

    _d = pd.read_csv("demand.csv", parse_dates=["date"])

    _d["month"] = _d["date"].dt.month

    X_test = _d.drop(columns=["date", "product_id", "units"])

    y_test = _d["units"]

    '
  data: demand
  baseline: 'from sklearn.dummy import DummyRegressor

    model = DummyRegressor().fit(Xd, yd)'
reference: 'model = make_pipeline(pre_d, LinearRegression())

  model.fit(Xd, yd)

  '
star3:
- first_try
- max_lines:2
buggy_variants:
- code: model = LinearRegression().fit(Xd[['promo', 'holiday']], yd)
  expect_detector: feature_mismatch
- code: model = LinearRegression().fit(Xd, yd)
  expect_detector: encode_categorical
hints:
- Линейная регрессия — раздел «Линейная регрессия».
- Категория — текст, поэтому сначала pre_d кодирует её, а остальные колонки проходят как есть. Соедини pre_d и LinearRegression через make_pipeline и обучи на всех данных.
- make_pipeline(pre_d, LinearRegression()).fit(Xd, yd).
- 'model = make_pipeline(___, LinearRegression())

  model.fit(___, yd)'
- 'MAE около 7.7 — лучше среднего, но немного: спрос зависит от сочетаний температуры и категории, которые прямая не видит. В боссе этого уровня понадобится модель посильнее.'
