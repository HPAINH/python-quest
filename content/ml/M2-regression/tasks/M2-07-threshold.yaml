id: M2-07-threshold
type: stat
title: Лучший порог по F1
difficulty: 3
lesson_section: threshold
statement: 'Для модели из `setup` найди порог, при котором F1 на `X_test` максимален, через `precision_recall_curve`. Запиши `best_threshold` (допуск ±0.002) и `best_f1` (допуск ±0.0001).

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\nclf = make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(X_train, y_train)\nproba = clf.predict_proba(X_test)[:, 1]\n"
outputs:
- var: best_threshold
  tol: 0.002
- var: best_f1
  tol: 0.0001
reference: 'prec, rec, thr = metrics.precision_recall_curve(y_test, proba)

  f1s = 2 * prec[:-1] * rec[:-1] / (prec[:-1] + rec[:-1] + 1e-12)

  i = int(np.argmax(f1s))

  best_threshold = thr[i]

  best_f1 = f1s[i]

  '
star3:
- first_try
- max_lines:5
buggy_variants:
- code: 'best_threshold = 0.5

    best_f1 = metrics.f1_score(y_test, (proba >= 0.5).astype(int))'
  expect_detector: stat_value
hints:
- Выбор порога — раздел «Порог».
- precision_recall_curve даёт precision, recall и пороги. Посчитай F1 для каждой точки (без последней — у неё нет порога) и возьми индекс максимума.
- metrics.precision_recall_curve(y_test, proba), 2 * p * r / (p + r), np.argmax.
- 'prec, rec, thr = metrics.precision_recall_curve(y_test, proba)

  f1s = 2 * prec[:-1] * rec[:-1] / (prec[:-1] + rec[:-1] + 1e-12)

  i = int(np.___(f1s))

  best_threshold = thr[___]

  best_f1 = f1s[i]'
- 'Лучший порог по F1 заметно ниже 0.5: на редком классе модель редко бывает уверена. Подбирать порог честнее на отдельной валидационной части, а не на тесте, — это тема уровня M4.'
