id: M2-06-prf
type: stat
title: Precision, recall, F1
difficulty: 1
lesson_section: clf-metrics
statement: 'Для модели из `setup` при пороге 0.5 посчитай на `X_test` `precision`, `recall`, `f1` и `auc` (ROC-AUC по вероятностям). Допуск ±0.0001.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\nclf = make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(X_train, y_train)\nproba = clf.predict_proba(X_test)[:, 1]\n"
outputs:
- var: precision
  tol: 0.0001
- var: recall
  tol: 0.0001
- var: f1
  tol: 0.0001
- var: auc
  tol: 0.0001
reference: 'pred = (proba >= 0.5).astype(int)

  precision = metrics.precision_score(y_test, pred)

  recall = metrics.recall_score(y_test, pred)

  f1 = metrics.f1_score(y_test, pred)

  auc = metrics.roc_auc_score(y_test, proba)

  '
star3:
- first_try
- max_lines:5
buggy_variants:
- code: 'pred = (proba >= 0.5).astype(int)

    precision = metrics.precision_score(y_test, pred)

    recall = metrics.recall_score(y_test, pred)

    f1 = metrics.f1_score(y_test, pred)

    auc = metrics.roc_auc_score(y_test, pred)'
  expect_detector: stat_value
- code: 'pred = (proba >= 0.5).astype(int)

    precision = metrics.recall_score(y_test, pred)

    recall = metrics.precision_score(y_test, pred)

    f1 = metrics.f1_score(y_test, pred)

    auc = metrics.roc_auc_score(y_test, proba)'
  expect_detector: stat_value
hints:
- Определения — раздел «Метрики классификации».
- Три метрики считаются по меткам, ROC-AUC — по вероятностям.
- metrics.precision_score, recall_score, f1_score по pred, roc_auc_score по proba.
- 'pred = (proba >= 0.5).astype(int)

  precision = metrics.precision_score(y_test, pred)

  recall = metrics.recall_score(y_test, pred)

  f1 = metrics.f1_score(y_test, pred)

  auc = metrics.roc_auc_score(y_test, ___)'
- 'Модель при пороге 0.5 осторожна: precision заметно выше recall — она тревожит редко, но многих уходящих пропускает. ROC-AUC по меткам — оценка одной точки, а не всей кривой.'
