id: M2-04-accuracy-trap
type: stat
title: Ловушка accuracy
difficulty: 1
lesson_section: clf-metrics
statement: 'В `setup` уже обучена логистическая регрессия `clf` и посчитаны вероятности `proba` для `X_test`. Посчитай accuracy модели при пороге 0.5 (`acc_model`) и accuracy «модели», которая всем говорит 0 (`acc_zero`). Допуск ±0.0001.

  '
setup: "import numpy as np\nimport pandas as pd\nfrom sklearn import metrics\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import make_pipeline, Pipeline\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\ndf = pd.read_csv(\"churn.csv\")\nX = df.drop(columns=[\"customer_id\", \"cancel_request\", \"churned\"])\ny = df[\"churned\"]\nif SHUFFLE:\n    y = y.sample(frac=1, random_state=1).reset_index(drop=True)\ncat = [\"city\", \"loyalty\"]\nnum = [c for c in X.columns if c not in cat]\npre = ColumnTransformer([\n    (\"num\", make_pipeline(SimpleImputer(strategy=\"median\"), StandardScaler()), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\nclf = make_pipeline(pre, LogisticRegression(max_iter=1000)).fit(X_train, y_train)\nproba = clf.predict_proba(X_test)[:, 1]\n"
outputs:
- var: acc_model
  tol: 0.0001
- var: acc_zero
  tol: 0.0001
reference: 'acc_model = metrics.accuracy_score(y_test, (proba >= 0.5).astype(int))

  acc_zero = metrics.accuracy_score(y_test, np.zeros(len(y_test), dtype=int))

  '
star3:
- first_try
- max_lines:2
buggy_variants:
- code: 'acc_model = metrics.accuracy_score(y_test, (proba >= 0.5).astype(int))

    acc_zero = y_test.mean()'
  expect_detector: stat_value
hints:
- Accuracy и дисбаланс — раздел «Метрики классификации».
- Сделай метки по порогу 0.5 и сравни с y_test. Для «всем 0» передай массив нулей той же длины.
- metrics.accuracy_score(y_test, (proba >= 0.5).astype(int)), np.zeros(len(y_test), dtype=int).
- 'acc_model = metrics.accuracy_score(y_test, (proba >= ___).astype(int))

  acc_zero = metrics.accuracy_score(y_test, np.___(len(y_test), dtype=int))'
- Константа «никто не уйдёт» почти догоняет модель по accuracy, хотя не находит ни одного уходящего. Поэтому для оттока смотрят recall, F1 и ROC-AUC.
